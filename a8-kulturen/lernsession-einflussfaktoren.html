      : 'Folien und Übungen zu Ernährung, Temperatur, Sauerstoff, pH und aw-Wert'; },
    docTitle: function(mode){ return 'Einflussfaktoren – ' + (mode==='challenge'?'Challenge':'Lernpfad') + ' (a.8)'; }
  }
});

LSEngine.initState();

function buildBody(idx, st){
  if(st.type==='slides')  LSEngine.buildSlides(idx, st);
  if(st.type==='tf')      LSEngine.buildTF(idx, st);
  if(st.type==='gaps')    LSEngine.buildGaps(idx, st);
  if(st.type==='table')   LSEngine.buildTable(idx, st);
  if(st.type==='quiz')    LSEngine.buildQuiz(idx, st);
  if(st.type==='decide')  LSEngine.buildDecide(idx, st);
  if(st.type==='errors')  LSEngine.buildErrors(idx, st);
  if(st.type==='reason')  LSEngine.buildReason(idx, st);
}

LSEngine.buildAll(); LSEngine.showCard(0); LSEngine.updateNav();
</script>
</body>
</html>
