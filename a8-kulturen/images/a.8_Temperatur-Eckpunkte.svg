<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="Vermehrung in Abhängigkeit von der Temperatur mit Minimum, Optimum, Maximum und Letaltemperatur">
<line x1="50" y1="40" x2="50" y2="320" stroke="#475569" stroke-width="2"/><line x1="50" y1="320" x2="620" y2="320" stroke="#475569" stroke-width="2"/>
<text x="20" y="190" font-size="17" fill="#475569" transform="rotate(-90 20 190)" text-anchor="middle" font-family="Inter, Arial, sans-serif">Vermehrung</text><text x="620" y="390" font-size="17" fill="#475569" text-anchor="end" font-family="Inter, Arial, sans-serif">Temperatur</text>
<line x1="120" y1="120" x2="120" y2="320" stroke="#2563eb" stroke-width="2" stroke-dasharray="6 5"/><circle cx="120" cy="320" r="6" fill="#2563eb"/>
<line x1="310" y1="70" x2="310" y2="320" stroke="#15803d" stroke-width="2" stroke-dasharray="6 5"/><circle cx="310" cy="320" r="6" fill="#15803d"/>
<line x1="450" y1="120" x2="450" y2="320" stroke="#b91c1c" stroke-width="2" stroke-dasharray="6 5"/><circle cx="450" cy="320" r="6" fill="#b91c1c"/>
<line x1="570" y1="120" x2="570" y2="320" stroke="#7f1d1d" stroke-width="2" stroke-dasharray="6 5"/><circle cx="570" cy="320" r="6" fill="#7f1d1d"/>
<path d="M 120 320 C 200 316, 250 70, 310 70 C 370 70, 420 230, 450 320 L 570 320" fill="none" stroke="#134061" stroke-width="4" stroke-linejoin="round"/>
<text x="120" y="345" text-anchor="middle" font-size="18" font-weight="700" fill="#1d4ed8" font-family="Inter, Arial, sans-serif">Minimum</text>
<text x="310" y="345" text-anchor="middle" font-size="18" font-weight="700" fill="#15803d" font-family="Inter, Arial, sans-serif">Optimum</text>
<text x="450" y="345" text-anchor="middle" font-size="18" font-weight="700" fill="#b91c1c" font-family="Inter, Arial, sans-serif">Maximum</text>
<text x="570" y="345" text-anchor="middle" font-size="18" font-weight="700" fill="#7f1d1d" font-family="Inter, Arial, sans-serif">Letaltemperatur</text>
<text x="310" y="52" text-anchor="middle" font-size="16" fill="#334155" font-family="Inter, Arial, sans-serif">Bebrütungsschrank</text>
<text x="120" y="108" text-anchor="middle" font-size="16" fill="#334155" font-family="Inter, Arial, sans-serif">Kühlschrank</text>
<text x="570" y="108" text-anchor="middle" font-size="16" fill="#334155" font-family="Inter, Arial, sans-serif">Sterilisation</text><text x="570" y="128" text-anchor="middle" font-size="16" fill="#334155" font-family="Inter, Arial, sans-serif">der Kulturen-Milch</text>

</svg>