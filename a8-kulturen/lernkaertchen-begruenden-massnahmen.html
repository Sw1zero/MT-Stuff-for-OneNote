    { vorne: 'Sie kontrollieren eine Kultur nach der vorgesehenen Bebrütungszeit und messen einen Säuregrad von 44 °SH, deutlich über dem Sollwert.', hinten: '<b>Ursache:</b> Die Bebrütungszeit war zu lang.<br><b>Massnahme:</b> Sie passen die Bebrütungszeit an und kontrollieren sie künftig mit einem Timer.<br><b>Wirkung:</b> So bricht die Milchsäuregärung rechtzeitig ab, bevor der Säuregrad den Sollwert übersteigt.' },
    { vorne: 'Eine neue Lernende meldet: ihre Kultur ist nach der planmässigen Bebrütungszeit noch komplett flüssig, der Säuregrad liegt bei nur 18 °SH.', hinten: '<b>Ursache:</b> Die Bebrütungstemperatur war zu tief.<br><b>Massnahme:</b> Sie kontrollieren die Temperatur mit einem Thermometer und stellen sie auf den Sollwert ein.<br><b>Wirkung:</b> Bei der richtigen Temperatur läuft die Milchsäuregärung im normalen Tempo ab, und der Säuregrad erreicht rechtzeitig den Sollwert.' },
    { vorne: 'Trotz korrekter Temperatur und Zeit bleibt eine Kultur ungewöhnlich dünnflüssig. Sie vermuten ein Problem mit der Ausgangsmilch.', hinten: '<b>Ursache:</b> Ein Hemmstoff in der Ausgangsmilch bremst die Bakterientätigkeit.<br><b>Massnahme:</b> Sie führen einen Hemmstoffnachweis durch, zum Beispiel einen Delvo- oder SNAP-Test.<br><b>Wirkung:</b> So erkennen Sie, ob zum Beispiel Antibiotikarückstände die Bakterien hemmen, und können die betroffene Milch aussortieren.' },
    { vorne: 'Eine Kultur zeigt nach der Bebrütung einen deutlich zu tiefen Säuregrad, obwohl Temperatur und Zeit korrekt eingehalten wurden. Im Betriebsjournal fällt eine kleinere Kulturmenge als sonst auf.', hinten: '<b>Ursache:</b> Die Impfmenge war zu klein.<br><b>Massnahme:</b> Sie passen die Impfmenge an die Vorgaben an.<br><b>Wirkung:</b> Mit ausreichend Kulturmenge steht von Anfang an genug Bakterienmasse zur Verfügung, damit die Säuerung im vorgesehenen Tempo abläuft.' }
