<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hotspot – Bakterienzelle</title>
  <link rel="stylesheet" href="../style.css?v=06398179">
</head>
<body>

<header class="bzwu-header">
  <div class="header-text">
  <span class="school-badge">BZWU Wil-Uzwil · Milchtechnologin / Milchtechnologe EFZ · a.8</span>
  <h1>Bakterienzelle</h1>
  <p>Tippen Sie im Bild auf die gesuchte Struktur.</p>
  </div>
  <div class="header-logos">
    <img src="../assets/logos/bzwu.png" alt="BZWU" class="header-logo">
    <img src="../assets/logos/milchtechnologen.svg" alt="Milchtechnologen" class="header-logo">
  </div>
</header>

<main class="q-wrap">
  <a class="back-link" href="../index.html">← Alle Lerntools</a>
  <section class="q-card" id="hKarte">
    <div class="q-meta" id="hMeta"><span>Struktur <strong id="hPos">1</strong> / 8</span></div>
    <p class="q-text" id="hFrage">Tippen Sie auf: <span id="hName"></span></p>
    <p class="h-tipp" id="hTipp"></p>
    <div class="h-bild" id="hBild">
      <img id="hImg" src="images/a.8_Bakterienzelle_leer.png" alt="Bakterienzelle ohne Beschriftung" draggable="false">
      <svg id="hSvg" viewBox="0 0 656 551" preserveAspectRatio="xMidYMid meet" aria-hidden="true"></svg>
    </div>
    <div class="q-feedback" id="hFb" role="status" aria-live="polite"></div>
  </section>
  <section class="q-card q-end" id="hEnd">
    <h2>Fertig!</h2>
    <p id="hErgebnis"></p>
    <button type="button" class="q-btn" id="hNochmals">Nochmals</button>
    <button type="button" class="q-btn ghost" id="hAlle">Alle Strukturen anzeigen</button>
  </section>
  <div class="q-next" id="hNext"><button type="button" class="q-btn" id="hBtn">Weiter</button></div>
</main>

<footer class="bzwu-footer">
  BZWU Wil-Uzwil · Milchtechnologin / Milchtechnologe EFZ · Philipp Neukomm
</footer>

<script>
  var IMG_W = 656, IMG_H = 551;
  var OK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>';
  var NOK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>';
  function farbe(v) { return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }

  /* Zonentypen:
     circle   → {cx, cy in %, r in px}
     polygon  → Tippen muss INNERHALB der Fläche sein
     polyline → Tippen muss max. tolerance px neben der Linie sein        */
  var ZONES = [
    {
      name: 'Zellwand', type: 'polyline', tolerance: 25, marke: { cx: 45, cy: 26 },
      hint: 'Der äusserste dunkle Ring',
      points: [{cx:23,cy:26},{cx:69,cy:26},{cx:78,cy:31},{cx:86,cy:46},
               {cx:84,cy:62},{cx:73,cy:74},{cx:16,cy:74},{cx:6,cy:67},
               {cx:1,cy:52},{cx:8,cy:32},{cx:23,cy:26}]
    },
    {
      name: 'Cytoplasmamembran', type: 'polyline', tolerance: 22, marke: { cx: 45, cy: 70 },
      hint: 'Der innere Ring',
      points: [{cx:16,cy:31},{cx:73,cy:32},{cx:82,cy:45},{cx:73,cy:69},
               {cx:19,cy:70},{cx:9,cy:64},{cx:5,cy:51},{cx:9,cy:38},{cx:16,cy:31}]
    },
    {
      name: 'Cytoplasma', type: 'polygon', marke: { cx: 18, cy: 50 },
      hint: 'Irgendwo im Zellinneren',
      points: [{cx:17,cy:32},{cx:69,cy:32},{cx:82,cy:48},
               {cx:71,cy:69},{cx:18,cy:70},{cx:6,cy:52}]
    },
    {
      name: 'Bakterienchromosom', type: 'polygon',
      points: [{cx:31,cy:44},{cx:57,cy:45},{cx:56,cy:56},{cx:31,cy:59}]
    },
    { name: 'Zelleinschlüsse', type: 'circle', cx: 69, cy: 60, r: 35 },
    {
      name: 'Geissel', type: 'polyline', tolerance: 30,
      points: [{cx:23,cy:65},{cx:9,cy:76},{cx:7,cy:85},{cx:13,cy:90},
               {cx:24,cy:84},{cx:39,cy:90},{cx:60,cy:84},{cx:76,cy:85},{cx:90,cy:74}]
    },
    {
      name: 'Schleimkapsel', type: 'polyline', tolerance: 35, marke: { cx: 88, cy: 52 },
      hint: 'Der gestrichelte Aussenbereich',
      points: [{cx:46,cy:23},{cx:73,cy:24},{cx:81,cy:31},
               {cx:88,cy:47},{cx:86,cy:61},{cx:78,cy:74},{cx:46,cy:77}]
    },
    { name: 'Ribosomen', type: 'circle', cx: 53, cy: 64, r: 40 },
  ];

  var fragen = [], pos = 0, treffer = 0, gesperrt = false;
  function el(id) { return document.getElementById(id); }
  function mischen(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

  /* ---- Hilfsfunktionen Geometrie ---- */
  function ptPx(p) { return { x: p.cx / 100 * IMG_W, y: p.cy / 100 * IMG_H }; }

  function pointInPolygon(px, py, pts) {
    var inside = false;
    for (var i = 0, j = pts.length - 1; i < pts.length; j = i++) {
      var xi = pts[i].x, yi = pts[i].y, xj = pts[j].x, yj = pts[j].y;
      if ((yi > py) !== (yj > py) && px < (xj - xi) * (py - yi) / (yj - yi) + xi)
        inside = !inside;
    }
    return inside;
  }

  function distToSegment(px, py, x1, y1, x2, y2) {
    var dx = x2 - x1, dy = y2 - y1, lenSq = dx * dx + dy * dy;
    if (lenSq === 0) return Math.sqrt((px-x1)*(px-x1)+(py-y1)*(py-y1));
    var t = Math.max(0, Math.min(1, ((px-x1)*dx + (py-y1)*dy) / lenSq));
    return Math.sqrt(Math.pow(px-x1-t*dx,2) + Math.pow(py-y1-t*dy,2));
  }

  function nearPolyline(px, py, pts, tol) {
    for (var i = 0; i < pts.length - 1; i++) {
      if (distToSegment(px, py, pts[i].x, pts[i].y, pts[i+1].x, pts[i+1].y) <= tol)
        return true;
    }
    return false;
  }

  function isHit(clickX, clickY, zone) {
    if (zone.type === 'circle') {
      var zx = zone.cx / 100 * IMG_W, zy = zone.cy / 100 * IMG_H;
      return Math.sqrt(Math.pow(clickX-zx,2)+Math.pow(clickY-zy,2)) <= zone.r;
    }
    var pts = zone.points.map(ptPx);
    if (zone.type === 'polygon')  return pointInPolygon(clickX, clickY, pts);
    if (zone.type === 'polyline') return nearPolyline(clickX, clickY, pts, zone.tolerance);
    return false;
  }

  /* ---- Zonen als SVG zeichnen ---- */
  function drawZoneSvg(svg, zone, color, label) {
    if (zone.type === 'circle') {
      var zx = zone.cx / 100 * IMG_W, zy = zone.cy / 100 * IMG_H;
      var c = document.createElementNS('http://www.w3.org/2000/svg','circle');
      c.setAttribute('cx', zx); c.setAttribute('cy', zy); c.setAttribute('r', zone.r);
      c.setAttribute('fill', color); c.setAttribute('fill-opacity', '0.2');
      c.setAttribute('stroke', color); c.setAttribute('stroke-width', '2.5');
      c.setAttribute('stroke-dasharray', '6 4');
      svg.appendChild(c);
      if (label) addLabel(svg, zx, zy, zone.name, color);
    } else {
      var pts = zone.points.map(ptPx);
      var d = 'M ' + pts[0].x + ' ' + pts[0].y;
      for (var i = 1; i < pts.length; i++) d += ' L ' + pts[i].x + ' ' + pts[i].y;
      if (zone.type === 'polygon') d += ' Z';
      var path = document.createElementNS('http://www.w3.org/2000/svg','path');
      path.setAttribute('d', d);
      path.setAttribute('fill', zone.type === 'polygon' ? color : 'none');
      path.setAttribute('fill-opacity', '0.18');
      path.setAttribute('stroke', color);
      path.setAttribute('stroke-width', zone.type === 'polyline' ? '4' : '2.5');
      path.setAttribute('stroke-dasharray', '7 4');
      path.setAttribute('stroke-linecap', 'round');
      svg.appendChild(path);
      if (label) {
        var mx = pts.reduce(function(s,p){return s+p.x;},0)/pts.length;
        var my = pts.reduce(function(s,p){return s+p.y;},0)/pts.length;
        addLabel(svg, mx, my, zone.name, color);
      }
    }
  }

  function mitte(z) {
    if (z.marke) return ptPx(z.marke);  // Ringe: Mittelpunkt läge in der Zellmitte
    if (z.type === 'circle') return { x: z.cx / 100 * IMG_W, y: z.cy / 100 * IMG_H };
    var pts = z.points.map(ptPx);
    return { x: pts.reduce(function (s, p) { return s + p.x; }, 0) / pts.length, y: pts.reduce(function (s, p) { return s + p.y; }, 0) / pts.length };
  }
  function addLabel(svg, x, y, text, color) {
    var w = String(text).length * 13 + 18;  // 22 Einheiten im 656er-Bild = gut 12 px auf dem Handy
    var bg = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    bg.setAttribute('x', x - w / 2); bg.setAttribute('y', y - 20); bg.setAttribute('width', w); bg.setAttribute('height', 32);
    bg.setAttribute('rx', 5); bg.setAttribute('fill', 'white'); bg.setAttribute('fill-opacity', '0.92');
    svg.appendChild(bg);
    var t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    t.setAttribute('x', x); t.setAttribute('y', y + 4); t.setAttribute('text-anchor', 'middle');
    t.setAttribute('font-size', '22'); t.setAttribute('font-weight', '700'); t.setAttribute('fill', color);
    t.textContent = text;
    svg.appendChild(t);
  }

  function start() {
    fragen = mischen(ZONES.map(function (_, i) { return i; }));
    pos = 0; treffer = 0;
    el('hEnd').classList.remove('show');
    el('hKarte').hidden = false;
    frage();
  }

  function frage() {
    var z = ZONES[fragen[pos]];
    el('hPos').textContent = pos + 1;
    el('hFrage').innerHTML = 'Tippen Sie auf: <span id="hName"></span>';  // «Alle Strukturen» überschreibt die Frage
    el('hName').textContent = z.name;
    el('hTipp').textContent = z.hint ? 'Tipp: ' + z.hint : '';
    el('hTipp').hidden = !z.hint;
    el('hFb').className = 'q-feedback';
    el('hMeta').hidden = false;
    el('hNext').classList.remove('show');
    el('hSvg').innerHTML = '';
    el('hBild').classList.remove('gesperrt');
    gesperrt = false;
  }

  el('hBild').addEventListener('click', function (e) {
    if (gesperrt) return;
    var r = el('hImg').getBoundingClientRect();
    var x = (e.clientX - r.left) / r.width * IMG_W, y = (e.clientY - r.top) / r.height * IMG_H;
    var z = ZONES[fragen[pos]], ok = isHit(x, y, z), svg = el('hSvg');
    var c = farbe(ok ? '--success' : '--red');
    gesperrt = true;
    el('hBild').classList.add('gesperrt');
    var dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    dot.setAttribute('cx', x); dot.setAttribute('cy', y); dot.setAttribute('r', 14);
    dot.setAttribute('fill', c); dot.setAttribute('fill-opacity', '0.35'); dot.setAttribute('stroke', c); dot.setAttribute('stroke-width', 3);
    svg.appendChild(dot);
    if (!ok) drawZoneSvg(svg, z, farbe('--success'), true);
    if (ok) treffer++;
    var fb = el('hFb');
    fb.className = 'q-feedback show ' + (ok ? 'ok' : 'nok');
    fb.innerHTML = (ok ? OK : NOK) + '<div><b>' + (ok ? 'Richtig!' : 'Nicht ganz.') + '</b><span>' +
      (ok ? z.name + ' gefunden.' : 'Gesucht war: ' + z.name + ' (grün eingezeichnet).') + '</span></div>';
    el('hBtn').textContent = pos === fragen.length - 1 ? 'Ergebnis anzeigen' : 'Weiter';
    el('hNext').classList.add('show');
    el('hBtn').focus({ preventScroll: true });
  });

  el('hBtn').onclick = function () {
    if (++pos < fragen.length) return frage();
    el('hNext').classList.remove('show');
    el('hKarte').hidden = true;
    el('hErgebnis').textContent = treffer + ' von ' + fragen.length + ' Strukturen beim ersten Tippen gefunden.';
    el('hEnd').classList.add('show');
  };

  el('hNochmals').onclick = start;
  el('hAlle').onclick = function () {
    el('hEnd').classList.remove('show');
    el('hKarte').hidden = false;
    el('hFrage').textContent = 'Alle Strukturen';
    el('hMeta').hidden = true;
    el('hTipp').hidden = false;
    el('hTipp').textContent = ZONES.map(function (z, i) { return (i + 1) + ' ' + z.name; }).join(' · ');
    el('hFb').className = 'q-feedback';
    gesperrt = true;
    el('hBild').classList.add('gesperrt');
    el('hSvg').innerHTML = '';
    var c = farbe('--blue-dark');
    ZONES.forEach(function (z, i) { drawZoneSvg(el('hSvg'), z, c, false); });
    ZONES.forEach(function (z, i) { var m = mitte(z); addLabel(el('hSvg'), m.x, m.y, i + 1, c); });  // Nummern im Bild, Namen darunter
    el('hBtn').textContent = 'Nochmals üben';
    el('hBtn').onclick = function () { el('hBtn').onclick = weiter; start(); };
    el('hNext').classList.add('show');
  };
  var weiter = el('hBtn').onclick;

  window.LerntoolTest = { typ: 'hotspot' };
  start();
</script>
</body>
</html>
