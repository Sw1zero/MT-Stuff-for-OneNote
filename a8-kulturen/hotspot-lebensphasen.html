<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hotspot – Lebensphasen der Mikroorganismen</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    .page-main {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .back-link {
      font-size: 0.78rem;
      color: var(--text-subtle);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin-bottom: 20px;
      align-self: flex-start;
    }
    .back-link:hover { color: var(--red); }

    .game-wrap {
      width: 760px;
      max-width: 96vw;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .question-card {
      background: var(--surface);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      padding: 20px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 68px;
    }
    .question-text { font-size: 1.05rem; font-weight: 600; color: var(--text); }
    .question-text span { color: var(--blue-dark); }
    .progress-badge {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text-subtle);
      background: #f1f5f9;
      border-radius: 20px;
      padding: 4px 12px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .feedback-bar {
      border-radius: var(--radius-sm);
      padding: 12px 16px;
      font-size: 0.88rem;
      font-weight: 600;
      opacity: 0;
      max-height: 0;
      overflow: hidden;
      transition: opacity 0.2s;
    }
    .feedback-bar.visible { opacity: 1; max-height: 200px; }
    .feedback-bar.correct-fb { background: #dcfce7; color: #166534; }
    .feedback-bar.wrong-fb   { background: var(--red-light); color: #991b1b; }
    .feedback-detail { font-weight: 400; margin-top: 6px; line-height: 1.4; }

    .diagram-wrap {
      position: relative;
      display: block;
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      background: var(--surface);
      padding: 12px;
    }
    .diagram-wrap svg { display: block; width: 100%; height: auto; }
    .zone { cursor: pointer; transition: opacity 0.15s; }
    .zone:hover { opacity: 0.75; }
    .zone.locked { cursor: default; pointer-events: none; }

    .end-screen {
      background: var(--surface);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      padding: 40px 32px;
      text-align: center;
      display: none;
    }
    .end-screen.visible { display: block; }
    .end-score { font-size: 2.8rem; font-weight: 800; color: var(--blue-dark); margin-bottom: 4px; }
    .end-label { font-size: 0.88rem; color: var(--text-subtle); margin-bottom: 28px; }

    .recap {
      display: none;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      margin-top: 8px;
    }
    .recap.visible { display: grid; }
    .recap-card {
      background: var(--surface);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
      padding: 16px 18px;
      border-top: 4px solid var(--phase-color, var(--blue-dark));
    }
    .recap-card h3 { margin: 0 0 6px; font-size: 0.98rem; color: var(--text); }
    .recap-card ul { margin: 0 0 10px; padding-left: 18px; font-size: 0.85rem; color: var(--text-muted); line-height: 1.45; }
    .recap-ferien {
      font-size: 0.8rem;
      font-style: italic;
      color: var(--text-subtle);
      background: #f8fafc;
      border-radius: var(--radius-sm);
      padding: 8px 10px;
    }
    .recap-ferien b { color: var(--blue-dark); font-style: normal; }

    .start-overlay {
      position: absolute;
      inset: 0;
      background: rgba(255,255,255,0.82);
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-lg);
      backdrop-filter: blur(2px);
    }
    .start-overlay.hidden { display: none; }
  </style>
</head>
<body>

<header class="bzwu-header">
  <div class="header-text">
    <span class="school-badge">BZWU Wil-Uzwil · Milchtechnologin / Milchtechnologe EFZ · a.8</span>
    <h1>Lebensphasen der Mikroorganismen</h1>
    <p>Klick auf den richtigen Abschnitt der Wachstumskurve.</p>
  </div>
  <div class="header-logos">
    <img src="../assets/logos/bzwu.png" alt="BZWU" class="header-logo">
    <img src="../assets/logos/milchtechnologen.svg" alt="Milchtechnologen" class="header-logo">
  </div>
</header>

<main class="page-main">
  <a class="back-link" href="../index.html">← Alle Lerntools</a>

<div class="game-wrap">

  <div class="question-card" id="questionCard">
    <div class="question-text" id="questionText">–</div>
    <div class="progress-badge" id="progressBadge">0 / 4</div>
  </div>

  <div class="feedback-bar" id="feedbackBar"></div>

  <div class="diagram-wrap" id="diagramWrap">
    <svg id="curveSvg" viewBox="0 0 720 360" preserveAspectRatio="xMidYMid meet"></svg>
    <div class="start-overlay" id="startOverlay">
      <button class="btn btn-primary" onclick="startGame()" style="font-size:1rem;padding:12px 32px;">
        Starten
      </button>
    </div>
  </div>

  <div class="end-screen" id="endScreen">
    <div class="end-score" id="endScore">–</div>
    <div class="end-label">von 4 Phasen beim ersten Versuch gefunden</div>
    <button class="btn btn-primary" onclick="startGame()" style="margin-right:10px">Nochmals</button>
    <button class="btn btn-ghost" onclick="showRecap()">Alle Phasen im Detail</button>
  </div>

  <div class="recap" id="recap"></div>

</div>

</main>

<footer class="bzwu-footer">
  BZWU Wil-Uzwil · Milchtechnologin / Milchtechnologe EFZ · Philipp Neukomm
</footer>

<script>
  var W = 720, H = 360;
  var AX = 64, AX_END = 700, AY_BASE = 300, AY_TOP = 30;

  var PHASES = [
    {
      id: 'A', name: 'Anpassungsphase', x1: AX, x2: 230,
      color: '#94a3b8',
      points: ['Die Bakterien passen sich der neuen Umwelt an.',
               'Praktisch keine Vermehrung (erst gegen Ende der Phase).',
               'Keine bis geringe Erhöhung der Keimzahl.',
               'Stoffwechsel schwach und verlangsamt, nimmt erst gegen Ende zu.'],
      ferien: 'Sie kommen am Ferienort an und müssen Läden, Lokale und Restaurants erst mühsam suchen.'
    },
    {
      id: 'B', name: 'Vermehrungsphase', x1: 230, x2: 400,
      color: '#3b82f6',
      points: ['Die Bakterien haben sich angepasst.',
               'Sehr starke und sehr schnelle Vermehrung, kürzeste Generationszeit, intensivster Stoffwechsel.',
               'Die Keimzahl nimmt schnell zu.'],
      ferien: 'Sie fühlen sich richtig wohl, sind unternehmungslustig und entdecken laufend Neues.'
    },
    {
      id: 'C', name: 'Stationäre Phase', x1: 400, x2: 560,
      color: '#f59e0b',
      points: ['Nährstoffmangel, Umweltbedingungen werden ungünstig (Säure).',
               'Vermehrung und Stoffwechsel sind gebremst.',
               'Keimzahl bleibt konstant (Gleichgewicht neu entstehender und sterbender Zellen).'],
      ferien: 'Sie kennen den Ferienort schon lange, nichts ist mehr neu – die Faszination lässt nach.'
    },
    {
      id: 'D', name: 'Absterbephase', x1: 560, x2: AX_END,
      color: '#64748b',
      points: ['Nährstoffmangel und sehr ungünstige Umweltbedingungen (Säuregrad).',
               'Die Keimzahl sinkt (hoher Anteil sterbender Zellen).'],
      ferien: 'Jeden Tag das Gleiche – Sie sehnen sich zurück nach Zuhause.'
    }
  ];

  var CURVE_PTS = [
    {x: AX, y: 275}, {x: 160, y: 268}, {x: 230, y: 262},
    {x: 280, y: 210}, {x: 330, y: 120}, {x: 400, y: 55},
    {x: 480, y: 50},  {x: 560, y: 55},
    {x: 620, y: 110}, {x: AX_END, y: 190}
  ];

  var questions = [], current = 0, score = 0, locked = false;

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function svgEl(tag, attrs) {
    var el = document.createElementNS('http://www.w3.org/2000/svg', tag);
    for (var k in attrs) el.setAttribute(k, attrs[k]);
    return el;
  }

  function drawBase(svg, revealAll) {
    svg.innerHTML = '';

    /* Achsen */
    svg.appendChild(svgEl('line', {x1: AX, y1: AY_TOP, x2: AX, y2: AY_BASE, stroke: '#cbd5e1', 'stroke-width': 2}));
    svg.appendChild(svgEl('line', {x1: AX, y1: AY_BASE, x2: AX_END, y2: AY_BASE, stroke: '#cbd5e1', 'stroke-width': 2}));
    var yLabel = svgEl('text', {x: 18, y: AY_TOP + 30, 'font-size': 12, fill: '#94a3b8', 'font-family': 'system-ui,sans-serif', transform: 'rotate(-90 18 ' + (AY_TOP + 30) + ')'});
    yLabel.textContent = 'Anzahl Bakterien';
    svg.appendChild(yLabel);
    var xLabel = svgEl('text', {x: (AX + AX_END) / 2, y: 340, 'text-anchor': 'middle', 'font-size': 12, fill: '#94a3b8', 'font-family': 'system-ui,sans-serif'});
    xLabel.textContent = 'Zeit';
    svg.appendChild(xLabel);

    /* Phasen-Zonen (Hintergrund) */
    PHASES.forEach(function(p) {
      var rect = svgEl('rect', {
        x: p.x1, y: AY_TOP, width: p.x2 - p.x1, height: AY_BASE - AY_TOP,
        fill: p.color, 'fill-opacity': revealAll ? 0.22 : 0.001,
        class: 'zone', 'data-id': p.id
      });
      svg.appendChild(rect);
      if (p.x1 !== AX) {
        svg.appendChild(svgEl('line', {x1: p.x1, y1: AY_TOP, x2: p.x1, y2: AY_BASE, stroke: '#e2e8f0', 'stroke-width': 1, 'stroke-dasharray': '4 4'}));
      }
    });

    /* Kurve */
    var d = 'M ' + CURVE_PTS[0].x + ' ' + CURVE_PTS[0].y;
    for (var i = 1; i < CURVE_PTS.length; i++) d += ' L ' + CURVE_PTS[i].x + ' ' + CURVE_PTS[i].y;
    svg.appendChild(svgEl('path', {d: d, fill: 'none', stroke: 'var(--blue-dark)', 'stroke-width': 3, 'stroke-linejoin': 'round'}));

    if (revealAll) {
      PHASES.forEach(function(p) {
        var midX = (p.x1 + p.x2) / 2;
        var label = svgEl('text', {x: midX, y: AY_TOP + 18, 'text-anchor': 'middle', 'font-size': 13, 'font-weight': 700, fill: p.color, 'font-family': 'system-ui,sans-serif'});
        label.textContent = p.id;
        svg.appendChild(label);
      });
    }
  }

  function startGame() {
    document.getElementById('startOverlay').classList.add('hidden');
    document.getElementById('endScreen').classList.remove('visible');
    document.getElementById('recap').classList.remove('visible');
    document.getElementById('diagramWrap').style.display = 'block';
    document.getElementById('questionCard').style.display = 'flex';
    document.getElementById('feedbackBar').className = 'feedback-bar';
    questions = shuffle(PHASES.map(function(_, i) { return i; }));
    current = 0; score = 0; locked = false;
    var svg = document.getElementById('curveSvg');
    drawBase(svg, false);
    attachZoneClicks();
    showQuestion();
  }

  function attachZoneClicks() {
    var zones = document.querySelectorAll('#curveSvg .zone');
    zones.forEach(function(z) {
      z.addEventListener('click', function() { onZoneClick(z.getAttribute('data-id')); });
    });
  }

  function showQuestion() {
    if (current >= questions.length) { showEndScreen(); return; }
    var phase = PHASES[questions[current]];
    document.getElementById('questionText').innerHTML = 'Klick auf: <span>' + phase.name + '</span>';
    document.getElementById('progressBadge').textContent = (current + 1) + ' / ' + questions.length;
    document.getElementById('feedbackBar').className = 'feedback-bar';
    locked = false;
  }

  function onZoneClick(id) {
    if (locked) return;
    locked = true;
    var target = PHASES[questions[current]];
    var correct = id === target.id;
    var clicked = PHASES.filter(function(p) { return p.id === id; })[0];

    var bar = document.getElementById('feedbackBar');
    if (correct) {
      score++;
      bar.className = 'feedback-bar visible correct-fb';
      bar.innerHTML = '✓  ' + target.name + ' – Richtig!<div class="feedback-detail">' + target.points[0] + '</div>';
      setTimeout(function() { current++; showQuestion(); }, 1800);
    } else {
      bar.className = 'feedback-bar visible wrong-fb';
      bar.innerHTML = '✗  Das war die ' + clicked.name + '. Gesucht war: ' + target.name + '.';
      setTimeout(function() { current++; showQuestion(); }, 2200);
    }
  }

  function showEndScreen() {
    document.getElementById('diagramWrap').style.display = 'none';
    document.getElementById('questionCard').style.display = 'none';
    document.getElementById('feedbackBar').className = 'feedback-bar';
    document.getElementById('endScore').textContent = score + ' / ' + questions.length;
    document.getElementById('endScreen').classList.add('visible');
  }

  function showRecap() {
    document.getElementById('endScreen').classList.remove('visible');
    var recap = document.getElementById('recap');
    recap.innerHTML = '';
    PHASES.forEach(function(p) {
      var card = document.createElement('div');
      card.className = 'recap-card';
      card.style.setProperty('--phase-color', p.color);
      var ul = p.points.map(function(pt) { return '<li>' + pt + '</li>'; }).join('');
      card.innerHTML = '<h3>' + p.id + ' – ' + p.name + '</h3><ul>' + ul + '</ul>' +
        '<div class="recap-ferien"><b>🏖️ Ferien-Vergleich:</b> ' + p.ferien + '</div>';
      recap.appendChild(card);
    });
    recap.classList.add('visible');

    var diagramWrap = document.getElementById('diagramWrap');
    diagramWrap.style.display = 'block';
    drawBase(document.getElementById('curveSvg'), true);
  }
</script>
</body>
</html>
