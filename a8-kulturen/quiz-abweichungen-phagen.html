<script>
  const QUESTIONS = [
    { badge:"Technische Ursache", question:"Der Säuregrad ist zu tief, die Kultur bleibt flüssig. Welche Ursache ist möglich?",
      answers:["Zu hohe Bebrütungstemperatur","Zu tiefe Bebrütungstemperatur oder zu kurze Bebrütungszeit","Zu lange Bebrütungszeit","Zu hohe Impfmenge"],
      correct:1, explanation:"Ein zu tiefer Säuregrad entsteht u. a. durch zu tiefe Temperatur, zu kurze Bebrütung, zu kleine Impfmenge oder einen Hemmstoff in der Milch." },
    { badge:"Massnahme", question:"Sie vermuten einen Hemmstoff in der Ausgangsmilch. Welche Massnahme ist richtig?",
      answers:["Impfmenge stark erhöhen","Hemmstoffnachweis durchführen (z. B. Delvo- oder SNAP-Test)","Temperatur senken","Länger bebrüten"],
      correct:1, explanation:"Bei Hemmstoffverdacht wird ein Hemmstoffnachweis gemacht (z. B. Delvo- oder SNAP-Test). Hemmstoffe (Antibiotika) hemmen die Milchsäurebakterien massiv." },
    { badge:"Technische Ursache", question:"Der Säuregrad ist zu hoch, die Kultur ist sehr sauer. Welche Ursache passt?",
      answers:["Zu kurze Bebrütungszeit","Hemmstoff in der Milch","Zu hohe Bebrütungstemperatur oder zu lange Bebrütungszeit","Zu kleine Impfmenge"],
      correct:2, explanation:"Ein zu hoher Säuregrad (zu tiefer pH) entsteht durch zu hohe Bebrütungstemperatur oder zu lange Bebrütungszeit." },
    { badge:"Bakteriophagen", question:"Was sind Bakteriophagen?",
      answers:["Bakterien, die andere Bakterien fressen","Viren, die Bakterien befallen","Hefen in der Kultur","Eine Form von Milchsäurebakterien"],
      correct:1, explanation:"Bakteriophagen (kurz Phagen) sind die Viren der Bakterien. Sie benutzen Bakterien als Wirtszelle und vermehren sich darin um das 50- bis 300-Fache." },
    { badge:"Bakteriophagen", question:"Welche Folge hat ein Phagenbefall in einer Milchsäurebakterienkultur?",
      answers:["Bessere Aromabildung","Säuerungsstörung in der Fabrikation","Höhere Haltbarkeit der Kultur","Keine Auswirkung"],
      correct:1, explanation:"Phagen zerstören die Milchsäurebakterien, die Folge ist eine Säuerungsstörung bei der Herstellung von Käse oder Sauermilchprodukten." },
    { badge:"Vermehrungszyklus", question:"Was geschieht beim LYTISCHEN Vermehrungszyklus?",
      answers:["Die Phagen-Erbsubstanz wird ins Bakterium eingebaut, ohne es zu schädigen","Das Bakterium wird zerstört und setzt 50–300 neue Phagen frei","Der Phage stirbt ab","Das Bakterium vermehrt sich schneller"],
      correct:1, explanation:"Im lytischen Zyklus übernimmt die Phagen-Erbmasse das Kommando, die Zellwand wird aufgelöst und 50–300 neue Phagen werden freigesetzt (Kettenreaktion) → Säuerungsstörung." },
    { badge:"Vermehrungszyklus", question:"Was kennzeichnet den LYSOGENEN Vermehrungszyklus?",
      answers:["Die Bakterienzelle wird sofort zerstört","Die Phagen-Erbsubstanz (Prophage) ist im Bakterium eingebaut, meist keine Säuerungsstörung","Es entstehen sofort 300 neue Phagen","Der Phage kann sich nicht vermehren"],
      correct:1, explanation:"Im lysogenen Zyklus bildet die Phagen-Erbsubstanz (Prophage) mit der Bakterien-Erbsubstanz eine Einheit. Das Bakterium arbeitet normal weiter, ein Übergang zum lytischen Zyklus ist aber möglich." },
    { badge:"Eigenschaften", question:"Welche Aussage über Bakteriophagen stimmt?",
      answers:["Sie sind hitzeempfindlicher als ihre Wirte","Sie sind weniger hitzeempfindlich als ihre Wirte und wirtsspezifisch","Sie befallen jede beliebige Bakterienart","Sie sind gegen Chlor und Peroxid unempfindlich"],
      correct:1, explanation:"Phagen sind weniger hitzeempfindlich als ihre Wirte, aber empfindlich auf Chlor/Peroxid und auf pH < 3 bzw. > 11. Sie sind wirtsspezifisch (befallen nur wenige Stämme)." },
    { badge:"Bekämpfung", question:"Welche Massnahme hilft GEGEN Phagen?",
      answers:["Kulturen im Fabrikationsraum zubereiten","Kulturenrotation: alle 2–3 Tage die Kultur wechseln","Auf Desinfektion verzichten","Bebrütungsbedingungen ständig ändern"],
      correct:1, explanation:"Wichtige Massnahmen: separater, sauberer Raum, aseptisches Arbeiten, Reinigung/Entkeimung, Spritzer vermeiden und Kulturenrotation alle 2–3 Tage, da nicht alle Kulturen gleich phagenempfindlich sind." },
    { badge:"Bekämpfung", question:"Warum sollen Molke- und Milchproduktespritzer im Kulturenraum vermieden werden?",
      answers:["Sie verändern den pH-Wert","Sie können grosse Mengen Phagen enthalten","Sie kühlen die Kultur ab","Sie enthalten Hemmstoffe"],
      correct:1, explanation:"Molke- und Milchproduktespritzer können grosse Mengen Phagen enthalten und so die Kulturen infizieren, deshalb unbedingt vermeiden." },
  ];

  Quiz.init({

    subMessages: {
      excellent: "Alle Fragen richtig. Sie kennen Ursachen, Massnahmen und Phagen bestens.",
      retry: "Wiederholen Sie Abweichungen und Bakteriophagen und versuchen Sie es nochmals."
    }
  });
</script>
