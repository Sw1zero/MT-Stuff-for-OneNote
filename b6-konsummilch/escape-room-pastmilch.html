<script>
// Fachquelle aller Werte: lehrmittel/efz/b.6 - Konsummilch herstellen.md (Seiten = PDF-Seiten), Belege in material/efz/b.6/escape-room/QUELLEN_b6_escape-room.md
var z2 = function (n) { return EscapeRoom.zahl(n); };
var uhr = function (m) { return EscapeRoom.zeit(m); };

function tabelle(kopf, zeilen) {
  return '<div class="er-tabelle"><table class="r-tabelle"><thead><tr>' + kopf.map(function (k) { return '<th scope="col">' + k + '</th>'; }).join('') +
    '</tr></thead><tbody>' + zeilen.map(function (r) { return '<tr>' + r.map(function (c) { return '<td>' + c + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table></div>';
}
function mailbox(von, uhr, html, audio) {
  return dokument('Anrufbeantworter, ' + uhr + ' Uhr, ' + von, audio
    ? '<audio controls preload="none" src="' + audio + '" style="width:100%"></audio><details><summary>Transkript</summary>' + html + '</details>' : html);
}
function dokument(kopf, inhalt) { return '<div class="er-papier"><p class="er-papier-kopf">' + kopf + '</p>' + inhalt + '</div>'; }

// Tanklager als Bild: drei Tanks mit Füllstand und Anzeige
function tanks(liste) {
  return '<figure class="er-kurve"><svg viewBox="0 0 330 190" role="img" aria-label="' + liste.map(function (t) { return t.name + ', ' + t.inhalt + ', Fett ' + t.fett; }).join('; ') + '">' +
    liste.map(function (t, i) {
      var x = 20 + i * 105, h = 110, f = Math.round(h * t.stand);
      return '<rect x="' + x + '" y="20" width="80" height="' + h + '" rx="10" class="er-tank"/>' +
        '<rect x="' + (x + 4) + '" y="' + (24 + h - 8 - f) + '" width="72" height="' + f + '" rx="6" class="er-tank-milch"/>' +
        '<text x="' + (x + 40) + '" y="14" text-anchor="middle" class="er-wert">' + t.name + '</text>' +
        '<rect x="' + (x + 2) + '" y="140" width="76" height="40" rx="4" class="er-anzeige"/>' +
        '<text x="' + (x + 40) + '" y="156" text-anchor="middle" class="er-anzeige-text">' + t.inhalt + '</text>' +
        '<text x="' + (x + 40) + '" y="173" text-anchor="middle" class="er-anzeige-text">Fett ' + t.fett + '</text>';
    }).join('') + '</svg><figcaption>Tankanzeigen im Tanklager</figcaption></figure>';
}

var LEGENDE = ['Vorlaufgefäss Milch', 'Milchpumpe', 'Durchflussregler', 'Plattenwärmetauscher', 'Separator', 'Konstantdruckventil', 'Durchflussmessgerät', 'Dichtemessgerät',
  'Regelventil', 'Absperrventil', 'Rückschlagventil', 'Homogenisator', 'Druckerhöhungspumpe', 'Heisshalter', 'Umschaltventil', 'Anlagensteuerung'];

var MAENGEL = [
  { name: 'talgig', klage: '«Die Milch schmeckt talgig.»', ursachen: ['Ungenügender Lichtschutz der Milchverpackung'],
    tipp: 'Talgigkeit hängt mit der Verpackung zusammen: Was schützt die Milch im Regal?' },
  { name: 'ranzig', klage: '«Die Milch schmeckt ranzig.»', ursachen: ['Bei weniger als 60 °C homogenisiert', 'Homogenisierte Pastmilch mit Rohmilch vermischt'],
    tipp: 'Denken Sie an die Lipase: Bei welcher Temperatur ist sie inaktiviert, und wo kommt noch aktive Lipase vor?' },
  { name: 'Kochgeschmack', klage: '«Die Milch hat einen Kochgeschmack.»', ursachen: ['Zu hohe Hitzebelastung während der Pasteurisation'],  // «Schlechte Rührwirkung im Chargenpasteur» weggelassen: kein Chargenpasteur in diesem Raum
    tipp: 'Kochgeschmack entsteht durch Hitze.' },
  { name: 'Gehaltsabweichungen', klage: '«Der Fettgehalt weicht von der Angabe auf der Packung ab.»', ursachen: ['Vermischung mit Spülwasser', 'Fehlerhafte Fettgehaltstandardisation'],
    tipp: 'Was verändert die Zusammensetzung der Milch, nachdem sie eingestellt wurde, oder schon beim Einstellen?' },
  { name: 'ungenügende Haltbarkeit', klage: '«Die Milch ist vor dem Verbrauchsdatum verdorben.»', ursachen: ['Keimreiche Rohmilch', 'Nachinfektion beim Kühlen oder Abfüllen', 'Infektion durch Verpackungsmaterial', 'Ungenügendes Kühlen', 'Unterbrochene Kühlkette', 'Ungenügende Pasteurisation'],
    nichtBei: ['Zu hohe Hitzebelastung während der Pasteurisation', 'Homogenisierte Pastmilch mit Rohmilch vermischt', 'Vermischung mit Spülwasser'],  // als Ursache für Verderb vertretbar
    tipp: 'Das ist mikrobiologischer Verderb: Woher kommen Keime, oder warum vermehren sie sich?' }
];

function raum(z) {
  /* ---- Welt: alle Zahlen eines Durchlaufs, damit die Dokumente zusammenpassen ---- */
  // Tanklager, Mischungskreuz
  var ziel = z.pick([
    { name: 'halbentrahmte Milch', grenze: 'tiefsten', g: 15, andere: 18 },
    { name: 'halbentrahmte Milch', grenze: 'höchsten', g: 18, andere: 15 },
    { name: 'standardisierte Vollmilch', grenze: 'tiefsten', g: 35 }
  ]);
  var V = z.int(38, 44) / 10, m = 0.05, M = z.int(4, 16) * 50, Z = ziel.g / 10, R = z.int(35, 40), rahmKg = z.int(6, 18) * 10;
  var kgV = M * (Z - m) / (V - m), kgM = M - kgV;
  var irrS2 = [{ wert: kgM, tol: 0.5, text: 'Das ist die Menge Magermilch. Gefragt ist die Vollmilch.' },
    { wert: M * (Z - m) / (R - m), tol: 0.5, text: 'Sie haben mit dem Rahm gerechnet. Der Tagesauftrag verlangt Vollmilch und Magermilch.' }];
  if (ziel.andere) irrS2.push({ wert: M * (ziel.andere / 10 - m) / (V - m), tol: 0.5, text: 'Sie haben mit ' + ziel.andere + ' g/kg gerechnet. Der Tagesauftrag verlangt den ' + ziel.grenze + ' erlaubten Fettgehalt.' });

  // Pastanlage: Spülung (Wasser am Ende des Kühlers)
  var start = 5 * 60 + z.int(0, 6), k = z.pick([2, 3, 4, 6]), spuel = [], t = z.int(600, 640) / 10, i;
  for (i = 0; i < 8; i++) {
    if (i < k - 1) t = Math.min(t + z.int(15, 40) / 10, 73.8);
    else if (i === k - 1) t = z.int(740, 748) / 10;
    else if (i === k) t = z.int(750, 756) / 10;
    else t = t + z.int(0, 4) / 10;
    spuel.push(Math.round(t * 10) / 10);
  }
  var erreicht = start + 2 * k, prod = erreicht + 10;

  // Pastanlage: Schreiberstreifen Heisshalter
  var nUnter = z.int(1, 4), nGrenz = z.int(1, 2), schreib = [];
  for (i = 0; i < nUnter; i++) schreib.push(z.int(700, 718) / 10);
  for (i = 0; i < nGrenz; i++) schreib.push(z.int(721, 729) / 10);
  while (schreib.length < 8) schreib.push(z.int(730, 750) / 10);
  schreib = z.mische(schreib);
  // Der letzte Messpunkt hat keinen «nächsten»: er liegt nie unter 72 °C, sonst wäre die Regel für ihn unklar
  if (schreib[7] < 72) { var tj = schreib.findIndex(function (w) { return w >= 73; }); var tw = schreib[7]; schreib[7] = schreib[tj]; schreib[tj] = tw; }
  var punkte = schreib.map(function (w, j) { return { zeit: uhr(6 * 60 + 2 * j), wert: w }; });
  var unter = punkte.filter(function (p) { return p.wert < 72; }), gut = punkte.filter(function (p) { return p.wert >= 73; });
  var nenn = z.pick([3000, 4500, 6000]), litSperr = nUnter * 2 * nenn / 60;  // Nennleistung l/h, Messabstand 2 min: gesperrte Menge in Litern
  var nennText = String(nenn).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');

  // Labor: Probennummern, Probenahme passt zum Schreiberstreifen
  var nr = z.ziffern(3), pK = nr[0], pW = nr[1], pS = nr[2];
  var zeitK = z.pick(gut).zeit, zeitW = z.pick(unter).zeit;
  var minuten = function (hhmm) { return +hhmm.slice(0, 2) * 60 + +hhmm.slice(3); };
  var proben = z.mische([
    [pK, zeitK + ' Uhr, Pastanlage', 'negativ', 'positiv'],
    [pW, zeitW + ' Uhr, Pastanlage', 'positiv', 'positiv'],
    [pS, 'Rückstellmuster von gestern, Linie 2', 'negativ', 'negativ']]);

  // Kühlraum: Reklamation
  var mg = z.pick(MAENGEL), ursache = z.pick(mg.ursachen);
  var frei = function (x) { return x.ursachen.filter(function (u) { return (mg.nichtBei || []).indexOf(u) < 0; }); };
  var falschU = z.mische(MAENGEL.filter(function (x) { return x !== mg && frei(x).length; })).slice(0, 3).map(function (x) {
    return { text: z.pick(frei(x)), warum: 'Diese Ursache steht in der Tabelle beim Mangel «' + x.name + '».' };
  });

  /* ---- Räume ---- */
  var orte = [
    { id: 'leitstand', name: 'Leitstand', uhr: '05:30', plan: { x: 35, y: 2, b: 30, h: 16 },
      ansicht: {"src": "images/leitstand_a.webp", "alt": "Leitstand: Pult mit Bildschirm und Telefon, Pinnwand mit Tagesauftrag und Zettel, Regal, Wanduhr", "hotspots": [{"titel": "Bildschirm", "x": 32.9, "y": 44.7, "b": 19.6, "h": 26.3, "schloss": "s1"}, {"titel": "Tagesauftrag", "x": 11.1, "y": 34.6, "b": 6.1, "h": 14.5, "dok": "auftrag"}, {"titel": "Zettel der Nachtschicht", "x": 22.2, "y": 40.6, "b": 3.2, "h": 5.7, "dok": "nacht"}, {"titel": "Telefon, Anrufbeantworter", "x": 61.5, "y": 67.9, "b": 6.3, "h": 5.8, "dok": "mb1"}]},
      szene: '<p>Der Bildschirm im Leitstand zeigt «Ablauf unvollständig. Anlage gesperrt.» Auf dem Pult liegen der Tagesauftrag und ein Zettel der Nachtschicht. Am Telefon blinkt der Anrufbeantworter.</p>' },
    { id: 'tank', name: 'Tanklager', uhr: '05:40', plan: { x: 2, y: 22, b: 31, h: 18 }, oeffnetMit: ['s1'],
      ansicht: {"src": "images/tanklager_a.webp", "alt": "Tanklager: drei liegende Tanks mit Anzeigen, Mischventil am Rohr, Aushang und Wandtelefon", "hotspots": [{"titel": "Tank 1", "x": 5.2, "y": 52.1, "b": 28.0, "h": 19.9, "dok": "tanks"}, {"titel": "Tank 2", "x": 37.5, "y": 52.1, "b": 25.7, "h": 27.4, "dok": "tanks"}, {"titel": "Tank 3", "x": 67.4, "y": 52.1, "b": 27.4, "h": 27.4, "dok": "tanks"}, {"titel": "Mischventil", "x": 78.3, "y": 69.8, "b": 4.0, "h": 9.9, "schloss": "s2"}, {"titel": "Aushang", "x": 32.9, "y": 36.2, "b": 5.3, "h": 12.4, "dok": "vlth"}, {"titel": "Wandtelefon, Anrufbeantworter", "x": 63.2, "y": 34.0, "b": 2.5, "h": 7.5, "dok": "mb2"}]},
      szene: '<p>Drei Tanks, drei Anzeigen. Das Mischventil zur Pastanlage öffnet erst, wenn die Menge Vollmilch eingegeben ist. An der Wand hängt ein Aushang. Am Wandtelefon blinkt der Anrufbeantworter.</p>' },
    { id: 'past', name: 'Pastanlage', uhr: '05:50', plan: { x: 67, y: 22, b: 31, h: 18 }, oeffnetMit: ['s1'],
      ansicht: {"src": "images/pastanlage_a.webp", "alt": "Pastanlage: Plattenwärmetauscher, Heisshalter, Homogenisator und Schaltschrank mit Schreiber", "hotspots": [{"titel": "Heisshalter, Typenschild", "x": 15.8, "y": 36.3, "b": 27.5, "h": 35.7, "dok": "typenschild"}, {"titel": "Homogenisator", "x": 51.4, "y": 35.0, "b": 22.7, "h": 40.7, "schloss": "s3"}, {"titel": "Wärmetauscher, Temperaturanzeige", "x": 0, "y": 41.2, "b": 14.3, "h": 30.8, "dok": "temperatur"}, {"titel": "Steuerpult", "x": 81.1, "y": 34.2, "b": 10.4, "h": 33.7, "schloss": "s4"}, {"titel": "Schreiberstreifen", "x": 84.5, "y": 51.7, "b": 6.0, "h": 6.1, "dok": "schreiber"}, {"titel": "Anlagenschema", "x": 54.2, "y": 24.9, "b": 7.9, "h": 11.2, "dok": "legende"}, {"titel": "Warnschild", "x": 23.3, "y": 29.0, "b": 4.6, "h": 5.7, "dok": "warnschild"}, {"titel": "Spülprotokoll", "x": 68.5, "y": 62.6, "b": 5.4, "h": 13.3, "dok": "spuel"}]},
      szene: '<p>Die Anlage ist mit Wasser gefüllt und keimarm gemacht. Hier hat die Qualitätssicherung in der Nacht gesperrt. An der Wand hängt das Anlagenschema.</p>' },
    { id: 'labor', name: 'Labor', uhr: '06:20', plan: { x: 35, y: 22, b: 30, h: 18 }, oeffnetMit: ['s2', 's4'],
      ansicht: {"src": "images/labor_a.webp", "alt": "Labor: Probenschrank mit Proben, Laborbericht an der Wand, Laborbank mit Waage, Reagenzglasgestell und Telefon", "hotspots": [{"titel": "Probenschrank", "x": 72.2, "y": 25.7, "b": 22.3, "h": 72.5, "schloss": "s5"}, {"titel": "Laborbericht", "x": 38.9, "y": 30.5, "b": 8.1, "h": 19.4, "dok": "labor"}, {"titel": "Waage", "x": 3.4, "y": 57.5, "b": 14.5, "h": 6.1, "dok": "fett"}, {"titel": "Reagenzglasgestell", "x": 22.8, "y": 56.4, "b": 8.3, "h": 6.4, "dok": "hemm"}, {"titel": "Telefon, Anrufbeantworter", "x": 54.3, "y": 58.4, "b": 5.0, "h": 4.5, "dok": "mb3"}]},
      szene: '<p>Im Labor stehen drei Proben im Kühlschrank. Der Probenschrank öffnet nur, wenn die Proben richtig geordnet sind. Am Telefon blinkt der Anrufbeantworter.</p>' },
    { id: 'kuehl', name: 'Kühlraum', uhr: '06:45', plan: { x: 35, y: 44, b: 30, h: 18 }, oeffnetMit: ['s5'],
      ansicht: {"src": "images/kuehlraum_a.webp", "alt": "Kühlraum: Paletten mit Milchkisten, Reklamation und Freigabe-Terminal an der Wand, Streifenvorhang", "hotspots": [{"titel": "Reklamation", "x": 55.3, "y": 37.0, "b": 7.1, "h": 17.8, "dok": "klage"}, {"titel": "Freigabe-Terminal", "x": 64.5, "y": 36.7, "b": 9.2, "h": 21.2, "schloss": "s6"}]},
      szene: '<p>Letzte Tür vor der Laderampe. Am Freigabe-Terminal hängt eine offene Reklamation vom Vortag. Der Lastwagen wartet.</p>' }
  ];

  var dokumente = [
    { id: 'mb1', ort: 'leitstand', titel: 'Anrufbeantworter: Nachricht von Frau Keller', html: mailbox('Frau Keller, Betriebsleitung', '05:31', '<p>Guten Morgen, hier spricht Frau Keller aus der Betriebsleitung. Es ist halb sechs, und ich stehe im Stau hinter einem Güllewagen, falls Sie sich fragen, warum es so rauscht.</p><p>Die Kaffeemaschine im Aufenthaltsraum ist übrigens schon wieder kaputt. Bitte nicht daran herumschrauben, der Hauswart kommt am Donnerstag.</p><p>Nun zur Sache. Die Qualitätssicherung hat die Pastanlage heute Nacht gesperrt, ein Messwert war auffällig. Die Frühtour muss um sieben Uhr los, und der Fahrer ruft sowieso alle zehn Minuten an. Sie geben frei, nicht ich.</p><p>Damit Sie wissen, worum es geht: Beim Pasteurisieren töten wir alle krankmachenden Keime ab und die meisten übrigen auch. Das gibt dem Konsumenten Sicherheit und der Milch eine längere Haltbarkeit. Darum müssen wir jederzeit nachweisen können, dass die Milch heiss genug war.</p><p>Fangen Sie im Leitstand an. Dort liegt der Tagesauftrag, und der Bildschirm zeigt, was an der Anlage noch fehlt. Dann sehen Sie weiter.</p><p>Ach ja, am Samstag ist Betriebsfest. Sie sind eingeladen, es gibt Raclette. Danke, tschüss.</p>', 'audio/mailbox_1.mp3') },
    { id: 'mb2', ort: 'tank', titel: 'Anrufbeantworter: Nachricht von Herrn Brunner', html: mailbox('Herr Brunner, Nachtschicht', '05:48', '<p>Hallo, hier ist Brunner von der Nachtschicht. Ich hoffe, ich erwische die Mailbox richtig. Mein Handy hat nur noch zehn Prozent, und meine Tochter hat gestern die Hälfte meiner Kontakte gelöscht.</p><p>Ich bin um sechs raus und sage lieber, was gestern Nacht los war. Der Schreiber am Heisshalter hat zwischendurch gepiept. Ich habe ihn nicht weiter beachtet, es lief ja alles.</p><p>Vor der Produktion haben wir die Anlage wie immer keimarm gemacht: Wasser durch, heiss, und am Ende vom Kühler gemessen. Ich glaube, es waren so um die fünfundsiebzig Grad. Dann haben wir noch eine Weile laufen lassen. Wie lange genau, weiss ich nicht mehr, das steht im Spülprotokoll.</p><p>Den Homogenisator habe ich nach Gefühl eingestellt. Auf dem Zettel steht, was ich genommen habe. Mein Kollege sagt immer, mehr Druck sei besser. Ich bin da nicht so sicher.</p><p>Und bitte, die Fische im Aquarium im Pausenraum nicht füttern, die sind auf Diät. Gute Schicht noch.</p>', 'audio/mailbox_2.mp3') },
    { id: 'mb3', ort: 'labor', titel: 'Anrufbeantworter: Nachricht von Frau Dr. Studer', html: mailbox('Frau Dr. Studer, Labor', '06:22', '<p>Guten Tag, hier ist Studer vom Labor. Ich habe heute Nacht drei Proben gezogen und in den Probenschrank gelegt. Er geht nur auf, wenn man weiss, welche Probe wie stark erhitzt wurde.</p><p>Zur Erinnerung: Die Phosphatase wird bei 72 Grad in 15 Sekunden inaktiviert, die Peroxidase erst bei 85 Grad in 10 Sekunden. Ist die Phosphatase nicht mehr nachweisbar, wurde genug erhitzt. Ist auch die Peroxidase weg, wurde zu stark erhitzt. Dann ist es keine Pastmilch mehr, sondern Hochpastmilch.</p><p>Den Laborbericht habe ich auf den Tisch gelegt. Vergleichen Sie die Probenahmezeiten mit dem Schreiberstreifen von der Pastanlage.</p><p>Und wenn Sie wissen wollen, wie viel Milch betroffen ist: Die Anlage lief die ganze Zeit mit Nennleistung. Die steht auf dem Typenschild vom Heisshalter. Rechnen Sie bitte selbst, ich habe meinen Taschenrechner heute nicht gefunden.</p><p>Der Lastwagenfahrer hat mich übrigens schon dreimal gefragt, ob er einen Kaffee bekommt. Er bekommt keinen, die Maschine ist kaputt. Danke.</p>', 'audio/mailbox_3.mp3') },
    { id: 'typenschild', ort: 'past', titel: 'Typenschild Heisshalter', html: dokument('Typenschild Heisshalter', tabelle(['Angabe', 'Wert'], [['Typ', 'HH-2'], ['Nennleistung', nennText + ' l/h'], ['Heisshaltezeit bei Nennleistung', '18 s']])) },
    { id: 'temperatur', ort: 'past', titel: 'Temperaturanzeige Wärmetauscher', html: dokument('Anzeige am Plattenwärmetauscher', tabelle(['Messstelle', 'Anzeige'], [['Milch Austritt Kühlabteilung', '4.5 °C']])) },
    { id: 'warnschild', ort: 'past', titel: 'Warnschild', html: dokument('Warnschild', '<p><strong>Achtung heiss.</strong> Heisse Oberflächen und Dampf. Nicht berühren.</p>') },
    { id: 'auftrag', ort: 'leitstand', titel: 'Tagesauftrag', html: dokument('Tagesauftrag Frühschicht',
      tabelle(['Linie', 'Auftrag'], [
        ['Pastmilch (kontinuierlich)', z2(M) + ' kg ' + ziel.name + ' mit dem ' + ziel.grenze + ' Fettgehalt, den Art. 33 VLtH erlaubt. Mischen aus Vollmilch und Magermilch.'],
        ['ESL-Linie', 'Revision, keine Produktion.'],
        ['Spätschicht', z2(rahmKg) + ' kg Rahm abfüllen.']])) },
    { id: 'nacht', ort: 'leitstand', titel: 'Zettel der Nachtschicht', html: dokument('Notiz Nachtschicht',
      '<p class="er-hand">Homogenisator: Habe das Programm mit 55 °C und 120 bar genommen, dann geht das Vorwärmen schneller. Lief ohne Störung.</p>') },
    { id: 'tanks', ort: 'tank', titel: 'Tankanzeigen', html: tanks([
      { name: 'Tank 1', inhalt: 'Vollmilch', fett: z2(V) + ' %', stand: 0.7 },
      { name: 'Tank 2', inhalt: 'Magermilch', fett: '0.05 %', stand: 0.55 },
      { name: 'Tank 3', inhalt: 'Rahm', fett: R + ' %', stand: 0.3 }]) },
    { id: 'vlth', ort: 'tank', titel: 'Aushang Art. 33 VLtH', html: dokument('Art. 33 VLtH, Fettgehaltsstufen genussfertiger Milch',
      '<ul><li>Vollmilch: mindestens 35 g/kg, Fettgehalt nicht verändert</li><li>Standardisierte Vollmilch: mindestens 35 g und weniger als 50 g/kg</li>' +
      '<li>Teilentrahmte Milch: mehr als 5 g und weniger als 35 g/kg</li><li>Halbentrahmte Milch: mindestens 15 g und höchstens 18 g/kg</li>' +
