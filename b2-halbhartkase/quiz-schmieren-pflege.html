<script>
  const QUESTIONS = [
    {"badge": "Häufigkeit", "question": "Wie oft schmieren Sie junge Käse in den ersten 10 bis 15 Tagen?", "answers": ["Täglich, bis die Schmiere flächendeckend ist", "Alle 2 bis 3 Tage, je nach Abtrocknen", "Einmal pro Woche, damit sie abtrocknen", "Gar nicht, bis die Rinde fest geworden ist"], "correct": 0, "explanation": "Junge Käse schmieren Sie täglich, bis die Schmiere flächendeckend sichtbar ist. Danach reduzieren Sie je nach Abtrocknen auf alle 2 bis 3 Tage."},
    {"badge": "Häufigkeit", "question": "Wann dürfen Sie einen Käse schmieren?", "answers": ["Wenn er nach dem Wenden nicht auf der Unterlage klebt", "Sobald er aus dem Salzbad kommt", "Nur wenn er noch nass glänzt", "Immer zur gleichen Uhrzeit, egal wie er aussieht"], "correct": 0, "explanation": "Vor jedem Schmieren müssen die Käse soweit abgetrocknet sein, dass sie nach dem Wenden nicht auf der Unterlage kleben. Das Abtrocknen legt das Intervall fest."},
    {"badge": "Beobachten", "question": "Wofür beobachten Sie das Abtrocknen und die Schmiereentwicklung?", "answers": ["Nur für die Qualitätsnote am Ende der Reifung", "Damit Sie das Salzbad besser einstellen können", "Für Intervall, Wenden, Bürstendruck und Befeuchtung", "Damit Sie die Käse seltener wenden müssen"], "correct": 2, "explanation": "Das Beobachten dient zur Festlegung des Behandlungsintervalls, des Wendens, des Bürstendrucks und der Oberflächenbefeuchtung. Beim Schmieren von Hand passen Sie die Pflege so von Charge zu Charge an."},
    {"badge": "Wenden", "question": "Weshalb schmieren Sie nur die nach oben gewendete Seite?", "answers": ["Die Unterseite hat keine Schmiereflora", "Nasse Unterseiten kleben, die Schmiere reisst ab", "Das Schmierwasser läuft sonst in den Teig", "Die Unterseite wird beim Wenden von selbst nass"], "correct": 1, "explanation": "Nasse Unterseiten kleben auf der Unterlage fest. Beim nächsten Wenden würde die Schmiere abgerissen."},
    {"badge": "Mechanik", "question": "Was passiert bei zu starker mechanischer Behandlung mit zu viel Schmierewasser?", "answers": ["Die Schmiere löst sich vom Käse ab", "Die Schmiereflora entwickelt sich schneller", "Der Käse trocknet sofort ab", "Die Käse kleben nicht mehr auf der Unterlage"], "correct": 0, "explanation": "Mit dem richtigen Bürstendruck, der angemessenen Wassermenge und der idealen Dauer verteilen sich die Schmiereflorakolonien gleichmässig. Zu viel davon löst die Schmiere ab."},
    {"badge": "Befeuchten", "question": "Was bedeutet «Schmieren heisst feuchthalten, nicht waschen»?", "answers": ["Der aw-Wert steigt kurz, das fördert die Schmiereflora", "Sie bürsten die Käse mit viel Wasser gründlich sauber", "Die Schmiere soll am Käse herunterlaufen und sich verteilen", "Sie arbeiten nur mit einer ganz trockenen Bürste"], "correct": 0, "explanation": "Mit der richtigen Wassermenge steigt der aw-Wert der Käseoberfläche vorübergehend. Das begünstigt die Schmiereflora. Zu viel Wasser wäscht die Schmiere ab."},
    {"badge": "Befeuchten", "question": "Was passiert bei zu hoher Schmierewassermenge?", "answers": ["Der Käse bekommt mehr Rinde und einen festeren Teig", "Die Schmiere wird abgewaschen, Fäulnis droht", "Die Schmiereflora entwickelt sich schneller", "Der aw-Wert an der Käseoberfläche sinkt"], "correct": 1, "explanation": "Zu viel Wasser wäscht die Schmiere ab und durchnässt Stellen. Dort entstehen Weissschmierigkeit und Fäulnis. Mehr Rinde und festerer Teig sind die Folge von zu trockenem Schmieren."},
    {"badge": "Befeuchten", "question": "Die Käse sind innert zwei Tagen wieder mit Schimmel überzogen. Was tun Sie?", "answers": ["Kochsalz ins Schmierwasser und kürzere Intervalle", "Schmierwasser ohne Salz und längere Intervalle", "Die Käse stärker bürsten", "Die Luftfeuchtigkeit im Keller senken"], "correct": 0, "explanation": "Die Käse trocknen zu rasch ab. Etwa 5 bis 10 % Kochsalz im Schmierwasser und kürzere Schmierintervalle verhindern das."},
    {"badge": "Infektionskreislauf", "question": "Was ist beim Retourschmieren (von älteren auf junge Käse) der Vorteil, was das Risiko?", "answers": ["Vorteil: keine Keime übertragen. Risiko: Schmiere entwickelt sich langsam", "Vorteil: Schmiere entwickelt sich schnell. Risiko: unerwünschte Keime werden verschleppt", "Vorteil: Infektionskreislauf unterbrochen. Risiko: es braucht Schmierekulturen", "Es gibt weder einen Vorteil noch ein Risiko"], "correct": 1, "explanation": "Retourschmieren bringt die Schmiere schnell auf junge Käse, verschleppt aber auch unerwünschte Keime. Vorwärtsschmieren (jung auf alt) unterbricht den Infektionskreislauf, braucht aber Schmierekulturen."},
    {"badge": "Hygiene", "question": "Wo stellen Sie die Käsebretter ab?", "answers": ["In Bretter- oder Käsegestelle, nie auf den Boden", "Auf den Kellerboden, wenn er sauber aussieht", "Auf den Tisch neben dem Wasserbehälter", "Auf den Boden, wenn eine Gummimatte darunterliegt"], "correct": 0, "explanation": "Feuchte Kellerböden sind das grösste Infektionsrisiko, weil das Schuhwerk fremde Keime einschleppt. Bretter gehören nur in Bretter- oder Käsegestelle."},
    {"badge": "Hygiene", "question": "Wie reinigen Sie Holzbretter nach dem Schmieren?", "answers": ["Mit Desinfektionsmittel, damit sie keimfrei sind", "Mit Chlorlösung im Tauchbad", "Gar nicht, Holz ist von Natur aus keimfrei", "Nur durch Hitze, nie mit Desinfektionsmittel"], "correct": 3, "explanation": "Desinfektionsmittelreste im porösen Holz stören die Schmierebildung und den Geschmack. Bei Holz ist nur eine Keimreduktion durch Hitze möglich."}
  ];

    }
  });
