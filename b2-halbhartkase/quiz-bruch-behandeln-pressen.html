<script>
  const QUESTIONS = [
    {"badge": "Sirte abpumpen", "question": "Welchen Vorteil hat es, möglichst viel Sirte abzupumpen?", "answers": ["Sie brauchen weniger Bruchwaschwasser und müssen weniger Masse erwärmen.", "Sie brauchen weniger Lab.", "Der Käse wird fetter.", "Der Bruch wird schneller sauer."], "correct": 0, "explanation": "Weniger Masse im Fertiger: weniger Bruchwaschwasser, weniger Wärmeenergie."},
    {"badge": "Sirte abpumpen", "question": "Weshalb darf das Rührwerk beim Sirteabpumpen höchstens 5 min stillstehen?", "answers": ["Der Motor überhitzt.", "Das Bruchwaschwasser kühlt ab.", "Der Bruch setzt sich und verklebt zu Knollen, das gibt Lochungsfehler.", "Die Sirte wird sonst sauer."], "correct": 2, "explanation": "Der Bruch verklebt durch sein Eigengewicht zu Knollen. Grosse Knollen lassen sich nicht mehr ausrühren und führen zu Lochungsfehlern."},
    {"badge": "Bruchwaschwasser", "question": "Was beachten Sie bei der Zugabe vom heissen Bruchwaschwasser (65 bis 75 °C)?", "answers": ["Sie stellen das Rührwerk ab.", "Sie geben alles auf einmal zu.", "Sie geben es dosiert zu, sonst werden die Körner örtlich überhitzt.", "Sie kühlen es vorher auf 20 °C ab."], "correct": 2, "explanation": "Dosiert zugeben, sonst werden die Bruchkörner örtlich überhitzt."},
    {"badge": "Bruchwaschwasser", "question": "Welche Bakteriengruppe eliminieren Sie mit der Pasteurisation vom Bruchwaschwasser nicht?", "answers": ["Hefen", "Coli-Bakterien", "Sporenbildner", "Milchsäurebakterien"], "correct": 2, "explanation": "Sporenbildner überleben die Pasteurisation."},
    {"badge": "Bruchwaschwasser", "question": "Welchen Vorteil hat es, das Bruchwaschwasser in einem drucklosen Behälter zu erwärmen?", "answers": ["Das Wasser bleibt kälter.", "Das Wasser wird entgast, so gibt es keine nestige Lochung.", "Das Wasser wird steril.", "Das Wasser wird salziger."], "correct": 1, "explanation": "Leitungswasser enthält kleine Luftblasen. Im drucklosen Behälter entweichen sie. Sonst gibt es eine ungleichmässige, nestige Lochung."},
    {"badge": "Wasseraufbereitung", "question": "Wozu setzen Sie eine UV-Lampe beim Bruchwaschwasser ein?", "answers": ["Um die Sporen von Buttersäure- und Putrifikuserregern zu reduzieren", "Um das Wasser zu entkalken", "Um das Wasser zu entgasen", "Um das Wasser zu erwärmen"], "correct": 0, "explanation": "Die UV-Lampe reduziert den Sporengehalt von Buttersäure- und Putrifikuserregern im Bruchwaschwasser."},
    {"badge": "Wasseraufbereitung", "question": "Welche Methode hat die gleiche Wirkung auf das Wasser wie die UV-Lampe?", "answers": ["Entgasung", "Kühlung", "Enthärtung", "Mikrofiltration"], "correct": 3, "explanation": "Mikrofiltration (oder Pasteurisation) reduziert ebenfalls die Keime im Wasser."},
    {"badge": "Bruch wärmen", "question": "Weshalb wärmt man den Tilsiter-Bruch tiefer (39 bis 42 °C) als den Appenzeller (40 bis 45 °C)?", "answers": ["Der Tilsiter soll mehr Löcher haben.", "Der Tilsiter hat mehr Fett.", "Der Tilsiter wird nicht gesalzen.", "Der Tilsiter soll mehr Wasser enthalten (max. 425 statt 400 g/kg)."], "correct": 3, "explanation": "Tiefere Bruchwärmtemperatur, mehr Wasser bleibt im Korn. Tilsiter: max. 425 g/kg Wasser, Appenzeller max. 400 g/kg."},
    {"badge": "Abfüllen", "question": "Weshalb muss der Bruch beim Abfüllen in die Sirte eintauchen?", "answers": ["So kühlt der Bruch schneller ab.", "So geht weniger Fett verloren.", "So wird der Bruch salziger.", "So wird die Luft nach oben abgedrängt."], "correct": 3, "explanation": "Der Bruch taucht in die Sirte ein, die Luft wird nach oben abgedrängt. Der Sirtenspiegel beträgt ca. 18 bis 20 cm."},
    {"badge": "Pressen", "question": "Wahr oder falsch? Beim Bruchkuchenabfüllen pressen Sie den Bruch als ganzes Stück vor und schneiden danach Blöcke für die Pressformen.", "answers": ["Wahr", "Falsch"], "correct": 0, "explanation": "Wahr. Der Bruchkuchen wird vorgepresst und danach in Blöcke für die Formen geschnitten."},
    {"badge": "Pressen", "question": "Wie lange pressen Sie nach der Direktabfüllung bis zum ersten Wenden?", "answers": ["ca. 50 min", "ca. 5 min", "ca. 3 h", "ca. 20 min"], "correct": 3, "explanation": "Bis zum ersten Wenden ca. 20 min mit 40 bis 60 kg pro Käse, danach ca. 50 min mit 40 bis 80 kg."},
