<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kulturen den Sorten zuordnen</title>
  <link rel="stylesheet" href="../style.css">
  <script src="../assets/dnd.js"></script>
  <script src="../assets/zuordnung3.js"></script>
  <style>
    .back-link {
      display: inline-block;
      font-size: 0.82rem;
      color: var(--text-muted);
      text-decoration: none;
      margin-bottom: 1.5rem;
      transition: color 0.15s;
    }
    .back-link:hover { color: var(--red); }

    .level-bar { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:1.25rem; }
    .level-btn { font-family:var(--font); font-size:0.82rem; font-weight:600; padding:7px 16px; border-radius:20px; border:1.5px solid var(--border); background:var(--surface); color:var(--text-muted); cursor:pointer; transition:all 0.15s; }
    .level-btn:hover { border-color:var(--blue); color:var(--blue-dark); }
    .level-btn.active { background:var(--blue-dark); border-color:var(--blue-dark); color:#fff; }

    .instruction {
      font-size: 0.84rem;
      color: var(--text-muted);
      margin-bottom: 1.25rem;
      text-align: center;
      line-height: 1.5;
    }

    /* ---------- Einfach: Karten-Pool ---------- */
    .card-pool {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      justify-content: center;
      background: var(--blue-light);
      border-radius: var(--radius-md);
      padding: 0.9rem 1rem;
      margin-bottom: 1.75rem;
      min-height: 60px;
    }

    .karte {
      font-family: var(--font);
      font-size: 0.78rem;
      font-weight: 500;
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 0.35rem 0.7rem;
      cursor: grab;
      color: var(--text);
      line-height: 1.4;
      user-select: none;
      touch-action: none;
      max-width: 240px;
      transition: border-color 0.15s, box-shadow 0.15s, opacity 0.15s;
    }
    .karte:hover { border-color: var(--blue); }
    .karte.dragging { opacity: 0.3; }
    .karte.used { opacity: 0.18; pointer-events: none; }
    .karte.selected {
      background: var(--blue);
      border-color: var(--blue);
      color: #fff;
    }

    .sorte-row {
      background: var(--surface);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      padding: 0.85rem 1rem;
      margin-bottom: 0.85rem;
    }
    .sorte-name {
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--blue-dark);
      margin-bottom: 0.55rem;
    }

    .drop-zone {
      width: 100%;
      min-height: 44px;
      border: 2px dashed var(--border);
      border-radius: var(--radius-sm);
      padding: 0.4rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.35rem;
      background: #fafbfc;
      transition: all 0.15s;
    }
    .drop-zone.over {
      border-color: var(--blue);
      border-style: solid;
      background: #e8f4ff;
    }
    .drop-zone.ready {
      border-color: var(--blue);
      border-style: solid;
      background: #f0f7ff;
    }

    .placed-karte {
      font-family: var(--font);
      font-size: 0.74rem;
      font-weight: 500;
      background: var(--surface);
      border: 2px solid var(--blue);
      border-radius: var(--radius-sm);
      padding: 0.26rem 0.5rem;
      color: var(--text);
      cursor: grab;
      user-select: none;
      touch-action: none;
      line-height: 1.3;
      transition: border-color 0.15s, background 0.15s;
    }
    .placed-karte:hover { border-color: var(--blue-dark); }
    .placed-karte.dragging { opacity: 0.3; }
    .placed-karte.correct {
      border-color: #16a34a !important;
      background: #f0fdf4 !important;
      color: #15803d !important;
      cursor: default;
      pointer-events: none;
    }
    .placed-karte.wrong {
      border-color: var(--red) !important;
      background: var(--red-light, #fff0f0) !important;
      color: var(--red) !important;
      cursor: default;
      pointer-events: none;
    }

    /* ---------- Mittel: Matrix zum Anklicken ---------- */
    .table-scroll { overflow-x: auto; margin-bottom: 1rem; }
    .matrix-table {
      border-collapse: collapse;
      background: var(--surface);
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      min-width: 720px;
    }
    .matrix-table th, .matrix-table td {
      padding: 0.5rem 0.4rem;
      border-bottom: 1px solid var(--border);
      font-size: 0.72rem;
      text-align: center;
      vertical-align: middle;
    }
    .matrix-table thead th {
      background: var(--red);
      color: #fff;
      font-weight: 700;
      font-size: 0.68rem;
      line-height: 1.25;
      padding: 0.6rem 0.4rem;
    }
    .matrix-table thead th:first-child { background: #c40027; }
    .matrix-table tr:last-child td { border-bottom: none; }
    .matrix-table td.sorte-label {
      font-weight: 600;
      color: var(--text);
      background: #f8f9fb;
      text-align: left;
      white-space: nowrap;
      padding-left: 0.75rem;
    }
    .cell-toggle {
      font-size: 1rem;
      width: 34px;
      height: 34px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface);
      cursor: pointer;
      color: var(--text-muted);
      transition: all 0.15s;
    }
    .cell-toggle:hover { border-color: var(--blue); }
    .cell-toggle.checked { background: var(--blue); border-color: var(--blue); color: #fff; }
    .cell-toggle.correct { background: #f0fdf4 !important; border-color: #16a34a !important; color: #15803d !important; cursor: default; }
    .cell-toggle.wrong   { background: var(--red-light) !important; border-color: var(--red) !important; color: var(--red) !important; cursor: default; }
    .cell-toggle.locked  { pointer-events: none; }

    /* ---------- Schwer: Freitext pro Sorte ---------- */
    .type-input {
      width: 100%;
      font-family: var(--font);
      font-size: 0.8rem;
      padding: 0.45rem 0.6rem;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      background: #f8fafc;
      color: var(--text);
      transition: border-color 0.15s;
    }
    .type-input:focus { outline: none; border-color: var(--blue); background: #fff; }
    .type-input.correct { border-color: #16a34a; background: #f0fdf4; }
    .type-input.wrong { border-color: var(--red); background: var(--red-light); }
    .type-sol { font-size: 0.7rem; color: #15803d; margin-top: 5px; display: none; }

    .btn-row {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 0.5rem;
    }

    .result-banner {
      margin-top: 1.25rem;
      padding: 0.9rem 1rem;
      border-radius: var(--radius-md);
      font-weight: 600;
      font-size: 0.92rem;
      text-align: center;
      display: none;
    }
    .result-banner.show   { display: block; }
    .result-banner.perfect { background: #f0fdf4; color: #15803d; border: 1.5px solid #bbf7d0; }
    .result-banner.partial { background: #fff7ed; color: #c2410c; border: 1.5px solid #fed7aa; }
  </style>
</head>
<body>

<header class="bzwu-header">
  <div class="header-text">
    <span class="school-badge">BZWU Wil-Uzwil · Milchtechnologin / Milchtechnologe EFZ · b.2</span>
    <h1>Kulturen zuordnen</h1>
    <p>Welche Kultur(en) passen zu welcher Halbhartkäse-Sorte? Mehrfachzuweisung möglich.</p>
  </div>
  <div class="header-logos">
    <img src="../assets/logos/bzwu.png" alt="BZWU" class="header-logo">
    <img src="../assets/logos/milchtechnologen.svg" alt="Milchtechnologen" class="header-logo">
  </div>
</header>

<main class="page-main">

  <a class="back-link" href="../index.html">← Alle Lerntools</a>

  <div class="level-bar">
    <button class="level-btn active" id="lvl-einfach" onclick="setLevel('einfach')">Einfach – zuordnen</button>
    <button class="level-btn"        id="lvl-mittel"  onclick="setLevel('mittel')">Mittel – anklicken</button>
    <button class="level-btn"        id="lvl-schwer"  onclick="setLevel('schwer')">Schwer – eintippen</button>
  </div>

  <p class="instruction" id="instruction"></p>

  <div id="modeBody"></div>

  <div class="btn-row" id="btnRow">
    <button type="button" class="btn btn-primary" id="checkBtn" onclick="checkLevel()">Überprüfen</button>
    <button type="button" class="btn btn-ghost" onclick="resetLevel()">Neu mischen</button>
  </div>

  <div class="result-banner" id="resultBanner"></div>

</main>

<footer class="bzwu-footer">
  BZWU Wil-Uzwil · Milchtechnologin / Milchtechnologe EFZ · Philipp Neukomm
</footer>

<script>
/* Datengrundlage: Lehrmittel b.2 (S. 26/30/38-39/47) + LS_b.2_start-halbhartkaese-kulturen.md
   Aufgabe 4 -- dieselben 8 Kulturtypen-Spalten wie im Arbeitsblatt. */
var KULTUR_TYPEN = [
  "Mesophile Starterkulturen",
  "Gefriergetrocknete Direktkulturen",
  "Thermophile Sc und Lb",
  "Joghurtkultur",
  "RMK «jung» (z.B. RMK 280)",
  "RMK «alt» (z.B. RMK 291)",
  "FSML",
  "Lochbildner"
];
/* Schwer-Stufe: groebere Kernbegriffe, RMK jung/alt zu einem Begriff zusammengefasst
   (Freitext-Erkennung fuer "jung" vs "alt" waere nicht robust genug). */
var KULTUR_KEYS = [
  ["mesophil", "starterkultur", "saeurewecker"],
  ["direktkultur", "gefriergetrocknet"],
  ["thermophil"],
  ["joghurt", "jogurt"],
  ["rmk", "rohmischkultur"],
  ["rmk", "rohmischkultur"],
  ["fsml"],
  ["lochbildner"]
];

var SORTEN = [
  { slug: "tilsiter",    name: "Tilsiter",                          correct: [3, 4, 5, 6, 7] },
  { slug: "appenzeller", name: "Appenzeller",                       correct: [3, 4, 5, 6, 7] },
  { slug: "raclette",    name: "Past. Halbhartkäse (z.B. Raclette)", correct: [0, 1, 2] },
  { slug: "tetedemoine", name: "Tête de Moine AOP",                 correct: [3, 4, 5] },
  { slug: "vacherin",    name: "Vacherin Fribourgeois AOP",         correct: [0] }
];

/* ---------- KARTEN fuer Einfach: eine Karten-Instanz pro (Sorte, Kulturtyp)-Paar,
   Instanzen desselben Kulturtyps teilen dasselbe match-Array -- damit ist es
   egal, WELCHE der gleichlautenden Karten in welche der zulaessigen Zonen
   gezogen wird (kein "falsches" Los unter gleichaussehenden Karten). ---------- */
var KARTEN = [];
(function buildKarten() {
  var nextId = 1;
  KULTUR_TYPEN.forEach(function(text, kIdx) {
    var validZones = SORTEN.filter(function(s) { return s.correct.indexOf(kIdx) !== -1; }).map(function(s) { return s.slug; });
    validZones.forEach(function() {
      KARTEN.push({ id: nextId++, text: text, match: validZones });
    });
  });
})();

var engine = Zuordnung3.karten.createEngine(KARTEN, 'match', { singleSlot: false });

/* ---------- EINFACH: Drag & Drop, mehrere Karten pro Zone ---------- */
function buildEinfach(body) {
  body.innerHTML = '<div class="card-pool" id="cardPool"></div><div id="sorteList"></div>';

  engine.renderPool(document.getElementById('cardPool'));

  var list = document.getElementById('sorteList');
  SORTEN.forEach(function(s) {
    var row = document.createElement('div');
    row.className = 'sorte-row';
    row.innerHTML = '<div class="sorte-name">' + s.name + '</div>' +
      '<div class="drop-zone" data-match="' + s.slug + '" id="zone-' + s.slug + '"></div>';
    list.appendChild(row);
  });

  engine.setupZones();
}

function checkEinfach() {
  var res = engine.checkEinfach();
  showResult(res.correct, res.total, res.total);
}

/* ---------- MITTEL: Matrix zum Anklicken (wie die Arbeitsblatt-Tabelle) ---------- */
function buildMittel(body) {
  var wrap = document.createElement('div');
  wrap.className = 'table-scroll';
  var table = document.createElement('table');
  table.className = 'matrix-table';

  var thead = '<thead><tr><th></th>' + KULTUR_TYPEN.map(function(t) { return '<th>' + t + '</th>'; }).join('') + '</tr></thead>';
  var tbody = '<tbody>' + SORTEN.map(function(s, si) {
    var cells = KULTUR_TYPEN.map(function(t, ki) {
      return '<td><button type="button" class="cell-toggle" id="cell-' + si + '-' + ki + '" onclick="toggleCell(' + si + ',' + ki + ')">☐</button></td>';
    }).join('');
    return '<tr><td class="sorte-label">' + s.name + '</td>' + cells + '</tr>';
  }).join('') + '</tbody>';

  table.innerHTML = thead + tbody;
  wrap.appendChild(table);
  body.appendChild(wrap);
}
function toggleCell(si, ki) {
  var btn = document.getElementById('cell-' + si + '-' + ki);
  if (btn.classList.contains('locked')) return;
  var on = btn.classList.toggle('checked');
  btn.textContent = on ? '☑' : '☐';
}
function checkMittel() {
  var correct = 0, total = SORTEN.length * KULTUR_TYPEN.length;
  SORTEN.forEach(function(s, si) {
    KULTUR_TYPEN.forEach(function(t, ki) {
      var btn = document.getElementById('cell-' + si + '-' + ki);
      var shouldCheck = s.correct.indexOf(ki) !== -1;
      var isChecked = btn.classList.contains('checked');
      btn.classList.add('locked');
      if (shouldCheck === isChecked) { btn.classList.add('correct'); correct++; }
      else { btn.classList.add('wrong'); btn.textContent = shouldCheck ? '☑' : '☐'; }
    });
  });
  showResult(correct, total, total);
}

/* ---------- SCHWER: Freitext pro Sorte, alle Kernbegriffe muessen vorkommen ---------- */
function buildSchwer(body) {
  SORTEN.forEach(function(s, i) {
    var row = document.createElement('div');
    row.className = 'sorte-row';
    row.innerHTML = '<div class="sorte-name">' + s.name + '</div>' +
      '<input class="type-input" id="ti-' + i + '" type="text" autocomplete="off" placeholder="Alle zutreffenden Kulturarten, mit Komma getrennt …">' +
      '<div class="type-sol" id="tisol-' + i + '"></div>';
    body.appendChild(row);
  });
}
function checkSchwer() {
  var correctSorten = 0;
  SORTEN.forEach(function(s, i) {
    var input = document.getElementById('ti-' + i), sol = document.getElementById('tisol-' + i);
    input.classList.remove('correct', 'wrong');
    var missing = [];
    s.correct.forEach(function(ki) {
      if (!Zuordnung3.matchKeys(input.value, KULTUR_KEYS[ki])) missing.push(KULTUR_TYPEN[ki]);
    });
    if (missing.length === 0) {
      input.classList.add('correct'); sol.style.display = 'none'; correctSorten++;
    } else {
      input.classList.add('wrong');
      sol.textContent = '→ ' + s.correct.map(function(ki) { return KULTUR_TYPEN[ki]; }).join(', ');
      sol.style.display = 'block';
    }
  });
  showResult(correctSorten, SORTEN.length, SORTEN.length);
}

/* ---------- gemeinsam ---------- */
function showResult(correct, filled, total) {
  var banner = document.getElementById('resultBanner');
  if (correct === total) {
    Zuordnung3.showResult(banner, true, 'Perfekt! Alle ' + total + ' Felder richtig.');
  } else {
    Zuordnung3.showResult(banner, false, correct + ' von ' + (filled || total) + ' richtig. Rot markierte nochmals überprüfen.');
  }
}

Zuordnung3.levelBar({
  instructions: {
    einfach: 'Ziehen Sie jede Kultur-Karte zu allen passenden Sorten. Manche Kultur wird mehrfach gebraucht.',
    mittel:  'Klicken Sie in der Tabelle alle Kulturen an, die bei der jeweiligen Sorte eingesetzt werden.',
    schwer:  'Schreiben Sie zu jeder Sorte alle zutreffenden Kulturarten auf (mit Komma getrennt).'
  },
  checkBtn: { einfach: '', mittel: '', schwer: '' },
  build: { einfach: buildEinfach, mittel: buildMittel, schwer: buildSchwer },
  check: { einfach: checkEinfach, mittel: checkMittel, schwer: checkSchwer }
});
setLevel('einfach');
</script>
</body>
</html>
