<script src="../assets/zuordnung.js?v=183dfbb6"></script>
<script>
Zuordnung.init({
  gruppen: [
    { key: 'kasein', label: 'Kasein' },
    { key: 'albumin', label: 'Molkenproteine (Albumin)' },
    { key: 'globulin', label: 'Globulin' }
  ],
  karten: [
    { text: 'Kügelchen-Durchmesser 0,1 µm oder weniger', gruppe: 'kasein' },
    { text: 'Kügelchen sind negativ geladen und stossen sich gegenseitig ab', gruppe: 'kasein' },
    { text: 'Wird bei der Käseproduktion mit Labgerinnung aus der Milch gewonnen', gruppe: 'kasein' },
    { text: 'Dichte 1450 kg/m³', gruppe: 'kasein' },
    { text: 'Anteil in der Milch: 2,5 % (25 g/kg)', gruppe: 'kasein' },
    { text: 'Lässt sich nicht mit Lab ausscheiden', gruppe: 'albumin' },
    { text: 'Gerinnt beim Erhitzen der Milch über 72 °C', gruppe: 'albumin' },
    { text: 'Verursacht den Kochgeschmack bei starker Erhitzung', gruppe: 'albumin' },
    { text: 'Bleibt bei der Käseproduktion in der Molke (Sirte)', gruppe: 'albumin' },
    { text: 'Wird gewonnen, indem Molke auf 90 °C erhitzt und Säure zugegeben wird', gruppe: 'albumin' },
    { text: 'Teilchengrösse kleiner als 0,01 µm', gruppe: 'globulin' },
    { text: 'Noch hitzeempfindlicher als Albumin', gruppe: 'globulin' },
    { text: 'In normaler Milch nur in Spuren vorhanden', gruppe: 'globulin' },
    { text: 'In grossen Mengen im Kolostrum (Brieschmilch) enthalten', gruppe: 'globulin' },
    { text: 'Dient neugeborenen Kälbern als Abwehrstoff gegen Krankheitserreger', gruppe: 'globulin' }
  ],
  intro: {
    zuordnen: 'Tippen Sie auf die Eiweissart, zu der die Eigenschaft unten gehört, oder ziehen Sie die Karte dorthin.'
  }
});
</script>
