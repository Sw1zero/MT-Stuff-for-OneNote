<!DOCTYPE html>
<html lang="de-CH">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Molkerei 3D: Grundriss</title>
  <link rel="stylesheet" href="../style.css?v=d6d6b61d">
  <style>
    body { padding: 16px; }
    h1 { color: var(--blue-dark); font-size: 1.3rem; }
    svg { max-width: 100%; height: auto; background: #fff; border-radius: var(--radius-md); box-shadow: var(--shadow-sm); font-family: var(--font); }
  </style>
  <script src="anlagen.js"></script>
  <script src="geometrie.js"></script>
</head>
<body>
  <h1>Grundriss Molkerei (Vorschlag)</h1>
  <p>Gezeichnet aus <code>anlagen.js</code>. Dunkel: in 3D gebaut. Hell: Umriss, Anlage folgt. Rot: Startpunkt. Gestrichelt: Untergeschoss. Masse in Metern.</p>
  <div id="plan"></div>
  <script>
    const K = 10, RAND = 40; // 10 px pro Meter
    const breite = Math.max(...RAEUME.map(r => r.x1)), tiefe = Math.max(...RAEUME.map(r => r.z1));
    const X = x => RAND + x * K, Z = z => RAND + z * K;
    const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
    let s = '';
    // Untergeschoss-Räume nur gestrichelt über dem Erdgeschoss
    for (const r of [...RAEUME].sort((p, q) => bodenVon(q) - bodenVon(p))) {
      const ug = bodenVon(r) < 0, y = ug ? Z(r.z1) - 22 : Z(r.z0);
      s += `<rect x="${X(r.x0)}" y="${Z(r.z0)}" width="${(r.x1 - r.x0) * K}" height="${(r.z1 - r.z0) * K}" fill="${ug ? 'none' : r.farbe}"${ug ? ' stroke="#5B6676" stroke-width="2" stroke-dasharray="8 5"' : ''}/>`;
      s += `<text x="${X(r.x0) + 6}" y="${y + 16}" font-size="13" font-weight="600" fill="${ug ? '#5B6676' : '#134061'}">${esc(r.name)}</text>`;
      s += `<text x="${X(r.x0) + 6}" y="${y + 30}" font-size="10" fill="#5B6676">${r.x1 - r.x0} × ${r.z1 - r.z0} m, Decke ${r.hoehe} m${ug ? `, Boden ${bodenVon(r)} m` : ''}</text>`;
    }
    for (const an of ANLAGEN) {
      const r = raumVon(an.raum), x = r.x0 + an.x - an.b / 2, z = r.z0 + an.z - an.t / 2, ug = bodenVon(r) < 0;
      s += `<rect x="${X(x)}" y="${Z(z)}" width="${an.b * K}" height="${an.t * K}" fill="${an.bau ? '#134061' : ug ? 'none' : '#69A9C9'}" fill-opacity="${an.bau ? 1 : 0.45}" stroke="${ug ? '#5B6676' : '#134061'}" stroke-width="${ug ? 1 : 0.6}"${ug ? ' stroke-dasharray="3 2"' : ''}><title>${esc(an.name)} (${an.b} × ${an.t} m)</title></rect>`;
      s += `<text x="${X(r.x0 + an.x)}" y="${Z(z) - 3}" font-size="9" text-anchor="middle" fill="#1a202c">${esc(an.name)}</text>`;
    }
    for (const l of anschluesse()) {
      const pts = rohrWeg(l).map(p => `${X(p.x)},${Z(p.z)}`).join(' ');
      s += `<polyline points="${pts}" fill="none" stroke="#1a202c" stroke-width="5"/>`;
      s += `<polyline points="${pts}" fill="none" stroke="${MEDIEN[l.medium].farbe}" stroke-width="3"><title>${MEDIEN[l.medium].name}</title></polyline>`;
    }
    for (const w of waende().filter(w => w.y0 === 0 && w.boden === 0)) {
      const [x1, z1, x2, z2] = w.laeuft === 'x' ? [w.a, w.c, w.b, w.c] : [w.c, w.a, w.c, w.b];
      s += `<line x1="${X(x1)}" y1="${Z(z1)}" x2="${X(x2)}" y2="${Z(z2)}" stroke="#1a202c" stroke-width="3"/>`;
    }
    s += `<circle cx="${X(START.x)}" cy="${Z(START.z)}" r="5" fill="#CC3333"/>`;
    // Massstab 10 m und Achsen alle 20 m
    s += `<line x1="${X(0)}" y1="${Z(tiefe) + 22}" x2="${X(10)}" y2="${Z(tiefe) + 22}" stroke="#1a202c" stroke-width="2"/><text x="${X(5)}" y="${Z(tiefe) + 36}" font-size="11" text-anchor="middle">10 m</text>`;
    for (let x = 0; x <= breite; x += 20) s += `<text x="${X(x)}" y="${RAND - 8}" font-size="10" text-anchor="middle" fill="#5B6676">${x}</text>`;
    for (let z = 0; z <= tiefe; z += 20) s += `<text x="${RAND - 8}" y="${Z(z) + 4}" font-size="10" text-anchor="end" fill="#5B6676">${z}</text>`;
    document.getElementById('plan').innerHTML =
      `<svg data-testid="grundriss" viewBox="0 0 ${breite * K + 2 * RAND} ${tiefe * K + 2 * RAND}" width="${breite * K + 2 * RAND}">${s}</svg>`;
  </script>
</body>
</html>
