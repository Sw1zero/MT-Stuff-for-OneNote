<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Salzbad berechnen</title>
  <link rel="stylesheet" href="../style.css?v=ce6f6fbe">
</head>
<body>

<header class="bzwu-header">
  <div class="header-text">
    <span class="school-badge">BZWU Wil-Uzwil · Milchtechnologin / Milchtechnologe EFZ · Rechner</span>
    <h1>Fachrechner Salzbad</h1>
    <p>Prozentrechnung · Volumen · Umrechnung · Mischungskreuz</p>
  </div>
  <div class="header-logos">
    <img src="../assets/logos/bzwu.png" alt="BZWU" class="header-logo">
    <img src="../assets/logos/milchtechnologen.svg" alt="Milchtechnologen" class="header-logo">
  </div>
</header>

<main class="page-main">
  <a class="back-link" href="../index.html">← Alle Lerntools</a>
  <div id="sbUeben"><div id="rechner"></div></div>
  <div id="sbRechner"></div>
</main>

<footer class="bzwu-footer">
  BZWU Wil-Uzwil · Milchtechnologin / Milchtechnologe EFZ · Philipp Neukomm
</footer>

<script src="../assets/rechner.js?v=e1257f9f"></script>
<script src="../assets/mischungskreuz.js?v=2e9d7f15"></script>
<script>
var pick = Rechner.pick, z = Rechner.zahl;

/* Dichtetabelle aus dem AB b.2, Zwischenwerte: 0.5 % mehr Salz = 0.004 kg/l mehr */
var DENSITY = { 16: 1.119, 17: 1.127, 18: 1.135, 19: 1.143, 20: 1.151, 21: 1.159, 22: 1.167, 23: 1.175, 24: 1.183, 25: 1.191 };
function getDensity(pct) {
  var base = Math.floor(pct);
  return DENSITY[base] + (pct - base) * 0.008;
}

/* Salzbad auf- oder abschwächen: Masse über die Dichte, dann Mischungskreuz (für Übung und freien Rechner) */
function salzbadKreuz(vol, ist, ziel) {
  var auf = ziel > ist, d = getDensity(ist), masse = vol * d, zugabe = auf ? 'Salz' : 'Wasser';
  var a = Mischungskreuz.aufgabe({ nameA: 'Salzbad', a: ist, nameB: zugabe, b: auf ? 100 : 0, c: ziel, gesucht: 'mengen', menge: masse, gegeben: 'A',
    text: 'Ein Salzbad hat <strong>' + z(vol) + ' l</strong> und <strong>' + z(ist) + ' %</strong> NaCl. Es soll auf <strong>' + z(ziel) + ' %</strong> ' +
      (auf ? 'aufgesalzen' : 'abgeschwächt') + ' werden. Wie viel kg ' + zugabe + ' braucht es? (Dichte bei ' + z(ist) + ' % aus der Tabelle)' });
  a.zugabe = zugabe;
  a.felder = a.felder.slice(0, 1);  // gefragt ist nur die Zugabe
  a.weg = ['Volumen: ' + z(vol) + ' l', 'Masse = ' + z(vol) + ' l × ' + z(d) + ' kg/l (Dichte bei ' + z(ist) + ' %) = ' + z(masse) + ' kg']
    .concat(a.weg.slice(0, a.weg.length - 1));  // ohne Gesamtmenge
  return a;
}

var SB_VOLS = [];
for (var _sv = 2000; _sv <= 8000; _sv += 100) SB_VOLS.push(_sv);
var SB_KONZ = [18, 19, 20, 21, 22, 23, 24];
var LAENGEN = [3.0, 3.5, 4.0, 4.5, 5.0, 5.5, 6.0, 7.0];
var BREITEN = [1.5, 2.0, 2.5, 3.0];
var HOEHEN  = [0.4, 0.5, 0.6, 0.8, 1.0, 1.2, 1.5, 1.8, 2.0];

function genProz() {
  var konz = pick(SB_KONZ), gewicht = Math.round(pick(SB_VOLS) * getDensity(konz) / 10) * 10, salz = gewicht * konz / 100;
  return {
    text: 'Ein Salzbad wiegt <strong>' + z(gewicht) + ' kg</strong> und hat eine NaCl-Konzentration von <strong>' + konz + ' %</strong>. Wie viel kg Salz sind darin?',
    felder: [{ label: 'Salzmenge', einheit: 'kg', wert: salz }],
    weg: ['Salz = Gesamtgewicht × NaCl % ÷ 100', 'Salz = ' + z(gewicht) + ' kg × ' + konz + ' ÷ 100 = <strong>' + z(salz) + ' kg</strong>']
  };
}

function genVol() {
  var l = pick(LAENGEN), b = pick(BREITEN), h = pick(HOEHEN), m3 = l * b * h, vol = m3 * 1000;
  return {
    text: 'Ein Salzbad-Behälter misst <strong>' + z(l) + ' m</strong> × <strong>' + z(b) + ' m</strong> × <strong>' + z(h) + ' m</strong>. Wie gross ist das Volumen in Liter?',
    felder: [{ label: 'Volumen', einheit: 'l', wert: vol }],
    weg: ['Volumen = Länge × Breite × Höhe = ' + z(l) + ' m × ' + z(b) + ' m × ' + z(h) + ' m = ' + z(m3) + ' m³',
      '1 m³ = 1000 l, also ' + z(m3) + ' m³ = <strong>' + z(vol) + ' l</strong>']
  };
}

function genUmr() {
  var konz = pick(SB_KONZ), vol = pick(SB_VOLS), d = getDensity(konz), masse = vol * d;
  return {
    text: 'Ein Salzbad hat <strong>' + z(vol) + ' l</strong> Volumen und <strong>' + konz + ' %</strong> NaCl. Lesen Sie die Dichte in der Tabelle ab und rechnen Sie in kg um.',
    felder: [{ label: 'Masse', einheit: 'kg', wert: masse }],
    weg: ['Dichte bei ' + konz + ' % aus der Tabelle: ' + z(d) + ' kg/l', 'Masse = ' + z(vol) + ' l × ' + z(d) + ' kg/l = <strong>' + z(masse) + ' kg</strong>']
  };
}

function genMix() {
  var auf = Math.random() < 0.5, ist, ziel;
  do {
    ist = pick(auf ? [18, 18.5, 19, 19.5, 20, 20.5, 21, 21.5, 22] : [22, 22.5, 23, 23.5, 24]);
    ziel = pick(auf ? [21, 21.5, 22, 22.5, 23] : [19, 19.5, 20, 20.5, 21, 21.5, 22]);
  } while (auf ? ziel <= ist : ziel >= ist);
  return salzbadKreuz(pick(SB_VOLS), ist, ziel);
}

/* Freie Rechner */
var IN_DM = { m: 10, dm: 1, cm: 0.1 };
function imBereich(k) { return k >= 16 && k <= 25 ? '' : 'Die Konzentration muss zwischen 16 % und 25 % liegen (Dichtetabelle).'; }

var FREI = [
  { name: 'Prozentrechnung', intro: 'Wie viel Salz ist im Salzbad?',
    felder: [{ id: 'g', label: 'Gesamtgewicht', einheiten: ['kg', 't'] }, { id: 'k', label: 'Konzentration', einheit: '%' }],
    rechne: function (w) {
      if (w.k < 0 || w.k > 100) return { fehler: 'Die Konzentration muss zwischen 0 und 100 % liegen.' };
      var g = w.gEinheit === 't' ? w.g * 1000 : w.g, salz = g * w.k / 100;
      return { ergebnis: 'Salzmenge = <strong>' + z(salz, 1) + ' kg</strong>',
        weg: (w.gEinheit === 't' ? [z(w.g) + ' t = ' + z(g) + ' kg'] : []).concat(['Salz = Gesamtgewicht × Konzentration ÷ 100', 'Salz = ' + z(g) + ' kg × ' + z(w.k) + ' ÷ 100 = <strong>' + z(salz) + ' kg</strong>']) };
    } },
  { name: 'Volumen', intro: 'Volumen des Salzbad-Behälters in Liter.',
    felder: [{ id: 'l', label: 'Länge', einheiten: ['m', 'dm', 'cm'] }, { id: 'b', label: 'Breite', einheiten: ['m', 'dm', 'cm'] }, { id: 'h', label: 'Höhe', einheiten: ['m', 'dm', 'cm'] }],
    rechne: function (w) {
      var dm = ['l', 'b', 'h'].map(function (k) { return w[k] * IN_DM[w[k + 'Einheit']]; }), vol = dm[0] * dm[1] * dm[2];
      var umr = ['l', 'b', 'h'].filter(function (k) { return w[k + 'Einheit'] !== 'dm'; }).map(function (k, i) { return z(w[k]) + ' ' + w[k + 'Einheit'] + ' = ' + z(w[k] * IN_DM[w[k + 'Einheit']]) + ' dm'; });
      return { ergebnis: 'Volumen = <strong>' + z(vol, 0) + ' l</strong>',
        weg: (umr.length ? ['In dm umrechnen: ' + umr.join(', ')] : []).concat(['V = L × B × H = ' + dm.map(function (x) { return z(x) + ' dm'; }).join(' × ') + ' = <strong>' + z(vol) + ' dm³ = ' + z(vol) + ' l</strong>']) };
    } },
  { name: 'Umrechnung', intro: 'Volumen mit der Dichte in kg umrechnen.',
    felder: [{ id: 'v', label: 'Volumen', einheit: 'l' }, { id: 'k', label: 'Konzentration', einheit: '%' }],
    rechne: function (w) {
      if (imBereich(w.k)) return { fehler: imBereich(w.k) };
      var d = getDensity(w.k), m = w.v * d;
      return { ergebnis: 'Masse = <strong>' + z(m, 1) + ' kg</strong>',
        weg: ['Dichte bei ' + z(w.k) + ' % aus der Tabelle: ' + z(d) + ' kg/l', 'Masse = ' + z(w.v) + ' l × ' + z(d) + ' kg/l = <strong>' + z(m) + ' kg</strong>'] };
    } },
  { name: 'Mischungskreuz', intro: 'Aufsalzen oder abschwächen: Ist das Ziel höher, kommt Salz dazu, sonst Wasser.',
    felder: [{ id: 'v', label: 'Volumen Salzbad', einheit: 'l' }, { id: 'ist', label: 'Aktuelle Konzentration', einheit: '%' }, { id: 'ziel', label: 'Zielkonzentration', einheit: '%' }],
    rechne: function (w) {
      if (imBereich(w.ist)) return { fehler: imBereich(w.ist) };
      if (w.ziel === w.ist) return { fehler: 'Ziel und aktuelle Konzentration sind gleich, es braucht nichts.' };
      if (w.ziel <= 0 || w.ziel >= 100) return { fehler: 'Die Zielkonzentration muss zwischen 0 und 100 % liegen.' };
      var a = salzbadKreuz(w.v, w.ist, w.ziel), m = a.felder[0].wert;
      return { ergebnis: 'Benötigtes ' + a.zugabe + ' = <strong>' + z(m, 1) + ' kg</strong>' + (a.zugabe === 'Wasser' ? ' (= ' + z(m, 1) + ' l)' : ''),
        nachher: a.nachher, weg: a.weg };
    } }
];

var DICHTE_HTML = '<table class="r-tabelle"><tr><th>NaCl in %</th><th>Dichte in kg/l</th></tr>' +
  Object.keys(DENSITY).map(function (k) { return '<tr><td>' + k + '</td><td>' + z(DENSITY[k], 3) + '</td></tr>'; }).join('') +
  '</table><p>0.5 % mehr Salz erhöht die Dichte um 0.004 kg/l.</p><p>Salzbad immer so rechnen: 1. Volumen, 2. Masse, 3. Salz und Wasser.</p>';
var HILFE = { titel: 'Dichtetabelle und Vorgehen', html: DICHTE_HTML };

Rechner.umschalter('sbUeben', 'sbRechner');
Rechner.init({
  kategorien: [
    { name: 'Prozentrechnung', aufgaben: [genProz] },
    { name: 'Volumen', aufgaben: [genVol] },
    { name: 'Umrechnung', aufgaben: [genUmr] },
    { name: 'Mischungskreuz', aufgaben: [genMix] }
  ],
  hilfe: HILFE
});
Rechner.frei('sbRechner', { rechner: FREI, hilfe: HILFE });
</script>
</body>
</html>
