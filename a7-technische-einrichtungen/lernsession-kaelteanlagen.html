<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kälteanlagen (a.7)</title>
  <link rel="stylesheet" href="../style.css">
  <script src="../assets/dnd.js"></script>
  <style>
    .back-link { display:inline-block; font-size:0.82rem; color:var(--text-muted); text-decoration:none; margin-bottom:1rem; }
    .back-link:hover { color:var(--red); }
    .ls-wrap { max-width:640px; margin:0 auto; }

    .hud { display:flex; align-items:center; gap:12px; background:var(--blue-dark); color:#fff; border-radius:var(--radius-md); padding:10px 14px; margin-bottom:14px; box-shadow:var(--shadow-sm); }
    .hud-xp { display:flex; align-items:baseline; gap:5px; flex-shrink:0; }
    .hud-label { font-size:0.6rem; font-weight:700; letter-spacing:0.1em; opacity:0.8; }
    .hud-val { font-size:1.15rem; font-weight:800; display:inline-block; }
    .hud-val.pop { animation:xppop 0.4s ease; }
    @keyframes xppop { 0%{transform:scale(1);} 40%{transform:scale(1.45); color:#9ad1e8;} 100%{transform:scale(1);} }
    .hud-bar { flex:1; height:8px; background:rgba(255,255,255,0.2); border-radius:4px; overflow:hidden; }
    .hud-bar-fill { height:100%; width:0%; background:linear-gradient(90deg,#69A9C9,#9ad1e8); border-radius:4px; transition:width 0.4s ease; }
    .hud-bar-fill.on-fire { animation:barpulse 0.9s ease-in-out infinite; }
    @keyframes barpulse { 0%,100%{box-shadow:0 0 4px 1px rgba(154,209,232,0.4);} 50%{box-shadow:0 0 10px 3px rgba(154,209,232,0.85);} }
    .hud-streak { position:relative; display:flex; align-items:center; gap:8px; font-size:0.84rem; font-weight:700; background:rgba(255,255,255,0.14); padding:3px 9px; border-radius:12px; white-space:nowrap; flex-shrink:0; transition:transform 0.15s, background 0.3s; }
    .streak-num-fire { color:#ff8c00; text-shadow:0 0 6px rgba(255,100,0,0.8); }
    .hud-streak.pulse { transform:scale(1.25); }
    .streak-pop { position:absolute; top:-4px; right:-4px; font-size:0.72rem; font-weight:800; color:#ffa040; pointer-events:none; white-space:nowrap; animation:streakPopAnim 0.9s ease-out forwards; }
    @keyframes streakPopAnim { 0%{opacity:1;transform:translateY(0) scale(1);} 70%{opacity:1;} 100%{opacity:0;transform:translateY(-20px) scale(0.75);} }
    .hud-fire-wrap { display:inline-block; position:relative; width:22px; height:22px; vertical-align:middle; overflow:visible; flex-shrink:0; }
    .hud-fire-wrap .fire { position:absolute; width:100px; height:100px; top:50%; left:50%; transform:translate(-50%,-50%) scale(0.22); transform-origin:center center; background:transparent; }
    @keyframes scaleUpDown { 0%,100%{transform:scaleY(1) scaleX(1);} 50%,90%{transform:scaleY(1.1);} 75%{transform:scaleY(0.95);} 80%{transform:scaleX(0.95);} }
    @keyframes shake { 0%,100%{transform:skewX(0) scale(1);} 50%{transform:skewX(5deg) scale(0.9);} }
    @keyframes particleUp { 0%{opacity:0;} 20%{opacity:1;} 80%{opacity:1;} 100%{opacity:0;top:-100%;transform:scale(0.5);} }
    @keyframes glow { 0%,100%{background-color:#ef5a00;} 50%{background-color:#ff7800;} }
    .hud-fire-wrap .fire-center { position:absolute; height:100%; width:100%; animation:scaleUpDown 3s ease-out infinite both; }
    .hud-fire-wrap .fire-center .main-fire { position:absolute; width:100%; height:100%; background-image:radial-gradient(farthest-corner at 10px 0,#d43300 0%,#ef5a00 95%); transform:scaleX(0.8) rotate(45deg); border-radius:0 40% 60% 40%; filter:drop-shadow(0 0 10px #d43322); }
    .hud-fire-wrap .fire-center .particle-fire { position:absolute; top:60%; left:45%; width:10px; height:10px; background:#ef5a00; border-radius:50%; filter:drop-shadow(0 0 10px #d43322); animation:particleUp 2s ease-out infinite both; }
    .hud-fire-wrap .fire-right { height:100%; width:100%; position:absolute; animation:shake 2s ease-out infinite both; }
    .hud-fire-wrap .fire-right .main-fire { position:absolute; top:15%; right:-25%; width:80%; height:80%; background:#ef5a00; transform:scaleX(0.8) rotate(45deg); border-radius:0 40% 60% 40%; filter:drop-shadow(0 0 10px #d43322); }
    .hud-fire-wrap .fire-right .particle-fire { position:absolute; top:45%; left:50%; width:15px; height:15px; background:#ef5a00; transform:scaleX(0.8) rotate(45deg); border-radius:50%; filter:drop-shadow(0 0 10px #d43322); animation:particleUp 2s ease-out infinite both; }
    .hud-fire-wrap .fire-left { position:absolute; height:100%; width:100%; animation:shake 3s ease-out infinite both; }
    .hud-fire-wrap .fire-left .main-fire { position:absolute; top:15%; left:-20%; width:80%; height:80%; background:#ef5a00; transform:scaleX(0.8) rotate(45deg); border-radius:0 40% 60% 40%; filter:drop-shadow(0 0 10px #d43322); }
    .hud-fire-wrap .fire-left .particle-fire { position:absolute; top:10%; left:20%; width:10%; height:10%; background:#ef5a00; border-radius:50%; filter:drop-shadow(0 0 10px #d43322); animation:particleUp 3s ease-out infinite both; }
    .hud-fire-wrap .fire-bottom .main-fire { position:absolute; top:30%; left:20%; width:75%; height:75%; background:#ff7800; transform:scaleX(0.8) rotate(45deg); border-radius:0 40% 100% 40%; filter:blur(10px); animation:glow 2s ease-out infinite both; }

    .ls-meta { font-size:0.8rem; font-weight:600; color:var(--text-muted); text-align:center; margin-bottom:6px; }
    .ls-dots { display:flex; gap:5px; justify-content:center; margin-bottom:20px; flex-wrap:wrap; }
    .ls-dot { width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:0.7rem; font-weight:700; background:#edf2f7; color:var(--text-subtle); border:2px solid transparent; }
    .ls-dot.active { border-color:var(--blue-dark); color:var(--blue-dark); }
    .ls-dot.done { background:#38a169; color:#fff; }

    .station { background:var(--surface); border-radius:var(--radius-lg); box-shadow:var(--shadow-sm); padding:24px; margin-bottom:18px; }
    .station.hidden { display:none; }
    .station-kicker { font-size:0.72rem; font-weight:700; text-transform:uppercase; letter-spacing:0.08em; color:var(--blue-light); margin-bottom:4px; }
    .station-title { font-size:1.15rem; font-weight:700; color:var(--blue-dark); margin-bottom:10px; }
    .station-lead { font-size:0.9rem; color:var(--text); line-height:1.6; margin-bottom:18px; }
    .station-lead b { color:var(--blue-dark); }
    .station.boss { border:2px solid #f0c36d; box-shadow:0 0 0 4px #fff7e6; }
    .station.boss .station-kicker { color:#d97706; }

    .read { font-size:0.9rem; line-height:1.65; color:var(--text); }
    .read p { margin-bottom:12px; }
    .read h4 { font-size:0.92rem; color:var(--blue-dark); margin:14px 0 6px; }
    .read ul { margin:0 0 12px 1.15rem; }
    .read li { margin-bottom:5px; }
    .read b { color:var(--blue-dark); }
    .read .factbox { background:var(--blue-tint); border-left:4px solid var(--blue-light); border-radius:var(--radius-sm); padding:10px 14px; margin:12px 0; font-size:0.86rem; line-height:1.55; }
    .read-btn-row { margin-top:16px; }
    .pdf-frame { width:100%; height:520px; border:1px solid var(--border); border-radius:var(--radius-md); display:block; }
    @media(max-width:560px){ .pdf-frame { height:360px; } }

    .read-btn { width:210px; height:42px; border-radius:40px; border:1px solid rgba(255,255,255,0.25); background-color:var(--blue-dark); display:flex; align-items:center; justify-content:center; cursor:pointer; transition:transform 0.3s; overflow:hidden; font-family:var(--font); padding:0 6px; }
    .read-btn-icon { width:32px; height:32px; background:linear-gradient(to bottom,var(--blue-light),#2a6fa8); border-radius:50px; display:flex; align-items:center; justify-content:center; overflow:hidden; z-index:2; transition:width 0.3s; flex-shrink:0; }
    .read-btn-text { flex:1; display:flex; align-items:center; justify-content:center; color:#fff; font-size:0.88rem; font-weight:600; white-space:nowrap; overflow:hidden; transition:all 0.3s; }
    .read-btn:hover:not(:disabled) .read-btn-icon { width:190px; }
    .read-btn:hover:not(:disabled) .read-btn-text { width:0; font-size:0; opacity:0; }
    .read-btn:active:not(:disabled) { transform:scale(0.95); }
    .read-btn:disabled { cursor:default; }
    .read-btn.done .read-btn-icon { background:linear-gradient(to bottom,#48bb78,#38a169); }

    /* ---- Slideshow ---- */
    .slideshow { border-radius:10px; overflow:hidden; box-shadow:0 6px 28px rgba(0,0,0,0.13),0 1px 4px rgba(0,0,0,0.07); border:1px solid rgba(0,0,0,0.08); }
    .slide-panel { display:none; }
    .slide-panel.active { display:block; }
    .slide-panel.slide-in-right { animation:slideInRight 0.3s cubic-bezier(0.22,0.61,0.36,1) both; }
    .slide-panel.slide-in-left  { animation:slideInLeft  0.3s cubic-bezier(0.22,0.61,0.36,1) both; }
    @keyframes slideInRight { from{transform:translateX(44px);opacity:0} to{transform:translateX(0);opacity:1} }
    @keyframes slideInLeft  { from{transform:translateX(-44px);opacity:0} to{transform:translateX(0);opacity:1} }
    .slide-header { padding:20px 22px 16px; display:flex; align-items:center; gap:16px; border-bottom:1px solid rgba(0,0,0,0.09); }
    .slide-icon { font-size:2.5rem; line-height:1; flex-shrink:0; width:56px; height:56px; display:flex; align-items:center; justify-content:center; border-radius:10px; background:rgba(255,255,255,0.52); box-shadow:0 1px 5px rgba(0,0,0,0.12); }
    .slide-htitle { font-size:1.05rem; font-weight:700; line-height:1.3; }
    .slide-body { padding:16px 22px 14px; font-size:0.9rem; line-height:1.65; color:var(--text); background:var(--surface); }
    .slide-body p { margin-bottom:10px; }
    .slide-body ul,.slide-body ol { margin:0 0 10px 1.2rem; }
    .slide-body li { margin-bottom:6px; }
    .slide-body b { color:var(--blue-dark); }
    .slide-body img { width:100%; border-radius:8px; margin:8px 0; display:block; }
    .slide-body .factbox { background:var(--blue-tint); border-left:4px solid var(--blue-light); border-radius:var(--radius-sm); padding:9px 13px; margin:10px 0 2px; font-size:0.84rem; line-height:1.55; }
    .slide-nav-row { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:16px; }
    .slide-dots { display:flex; gap:6px; align-items:center; }
    .slide-dot { width:8px; height:8px; border-radius:50%; background:var(--border); transition:background 0.2s,transform 0.2s; cursor:pointer; }
    .slide-dot.active { background:var(--blue-dark); transform:scale(1.35); }
    .slide-dot.done { background:var(--blue-light); }
    .slide-nav-btn { font-family:var(--font); font-size:0.82rem; font-weight:600; padding:7px 14px; border-radius:20px; border:1.5px solid var(--border); background:var(--surface); color:var(--text-muted); cursor:pointer; transition:all 0.15s; }
    .slide-nav-btn:hover:not(:disabled) { border-color:var(--blue-light); color:var(--blue-dark); }
    .slide-nav-btn:disabled { opacity:0.32; cursor:default; }
    .slide-counter { font-size:0.76rem; color:var(--text-subtle); font-weight:600; white-space:nowrap; }

    .station-media { margin-bottom:18px; }
    .station-media img { width:100%; height:auto; display:block; border-radius:var(--radius-md); border:1px solid var(--border); box-shadow:var(--shadow-sm); }

    .q-block { margin-bottom:18px; }
    .q-block:last-child { margin-bottom:0; }
    .q-text { font-size:0.92rem; font-weight:600; margin-bottom:10px; }
    .opt { display:block; width:100%; text-align:left; font-family:var(--font); font-size:0.88rem; color:var(--text); background:var(--surface); border:1.5px solid var(--border); border-radius:var(--radius-md); padding:11px 14px; margin-bottom:8px; cursor:pointer; transition:all 0.15s; line-height:1.4; }
    .opt:hover:not(:disabled) { border-color:var(--blue-light); }
    .opt:disabled { cursor:default; }
    .opt.correct { border-color:#38a169; background:#f0fff4; }
    .opt.wrong { border-color:var(--red); background:var(--red-light); }

    .tf-item { padding:12px 0; border-bottom:1px solid var(--border); }
    .tf-item:last-child { border-bottom:none; }
    .tf-statement { font-size:0.9rem; margin-bottom:8px; }
    .tf-btns { display:flex; gap:8px; }
    .tf-btn { font-family:var(--font); font-size:0.82rem; font-weight:600; padding:7px 18px; border-radius:20px; border:1.5px solid var(--border); background:var(--surface); color:var(--text-muted); cursor:pointer; transition:all 0.15s; }
    .tf-btn:hover:not(:disabled) { border-color:var(--blue-light); }
    .tf-btn:disabled { cursor:default; }
    .tf-btn.sel-correct { background:#38a169; border-color:#38a169; color:#fff; }
    .tf-btn.sel-wrong { background:var(--red); border-color:var(--red); color:#fff; }
    .tf-btn.reveal { border-color:#38a169; color:#276749; }
    .tf-exp { font-size:0.78rem; color:var(--text-muted); margin-top:8px; display:none; }
    .tf-exp.show { display:block; }

    .gap-text { font-size:0.95rem; line-height:2.1; }
    .gap-text select, .lp-select { font-family:var(--font); font-size:0.85rem; font-weight:600; border:1.5px solid var(--blue-light); border-radius:var(--radius-sm); padding:3px 6px; background:var(--blue-tint); color:var(--blue-dark); }
    .gap-text select.correct, .lp-select.correct { border-color:#38a169; background:#f0fff4; color:#276749; }
    .gap-text select.wrong, .lp-select.wrong { border-color:var(--red); background:var(--red-light); color:var(--red-dark); }
    .lp-select { width:100%; }

    .slots-grid { display:grid; grid-template-columns:1fr 1fr; gap:0.55rem; margin-bottom:0.5rem; }
    @media (max-width:560px){ .slots-grid { grid-template-columns:1fr; } }
    .lb-bank { display:flex; flex-wrap:wrap; gap:0.5rem; background:var(--blue-light); border-radius:var(--radius-md); padding:0.9rem 1rem; margin-bottom:1rem; min-height:52px; }
    .lb-chip { font-family:var(--font); font-size:0.82rem; font-weight:500; background:var(--surface); border:2px solid var(--border); border-radius:20px; padding:0.3rem 0.8rem; cursor:grab; color:var(--text); user-select:none; touch-action:none; transition:border-color 0.15s,opacity 0.15s; }
    .lb-chip:hover { border-color:var(--blue-light); }
    .lb-chip.used { opacity:0.2; pointer-events:none; }
    .lb-chip.selected { background:var(--blue-dark); border-color:var(--blue-dark); color:#fff; }
    .lb-slot { flex:1; min-height:36px; border:2px dashed var(--border); border-radius:var(--radius-sm); padding:0.3rem 0.65rem; font-size:0.82rem; font-family:var(--font); color:var(--text-subtle); display:flex; align-items:center; transition:all 0.15s; background:var(--surface); }
    .lb-slot.lb-over,.lb-slot.lb-ready { border-color:var(--blue-light); border-style:solid; background:#f0f7ff; }
    .lb-slot.lb-filled { border-style:solid; border-color:var(--blue-light); color:var(--text); font-weight:500; cursor:grab; touch-action:none; user-select:none; }
    .lb-slot.correct { border-color:#16a34a !important; background:#f0fdf4 !important; color:#15803d !important; cursor:default; }
    .lb-slot.wrong   { border-color:var(--red) !important; background:var(--red-light) !important; color:var(--red) !important; cursor:default; }
    .slot-row { display:flex; align-items:flex-start; gap:0.5rem; }
    .slot-num { width:28px; height:28px; flex-shrink:0; border-radius:50%; background:var(--blue-dark); color:#fff; font-size:0.76rem; font-weight:700; display:flex; align-items:center; justify-content:center; margin-top:3px; }
    .type-cell { flex:1; }
    .type-input { width:100%; font-family:var(--font); font-size:0.84rem; padding:0.45rem 0.65rem; border:1.5px solid var(--border); border-radius:var(--radius-sm); background:#f8fafc; color:var(--text); transition:border-color 0.15s; }
    .type-input:focus { outline:none; border-color:var(--blue); background:#fff; }
    .type-input.correct { border-color:#16a34a; background:#f0fdf4; }
    .type-input.wrong { border-color:var(--red); background:var(--red-light); }
    .type-sol { font-size:0.72rem; color:#15803d; margin-top:2px; }

    .check-btn-row { margin-top:16px; }

    .finish { text-align:center; }
    .finish .rank { font-size:1.25rem; font-weight:800; color:var(--blue-dark); margin:4px 0 2px; }
    .finish .big-score { font-size:2.4rem; font-weight:800; color:var(--blue-dark); margin:6px 0 2px; }
    .finish .score-sub { font-size:0.86rem; color:var(--text-muted); margin-bottom:16px; }
    .badges { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin:0 auto 18px; max-width:520px; }
    .badge-chip { display:inline-flex; align-items:center; gap:5px; font-size:0.76rem; font-weight:600; padding:6px 12px; border-radius:20px; border:1.5px solid var(--border); background:#f8fafc; color:var(--text-subtle); }
    .badge-chip.earned { background:#fff7e6; border-color:#f0c36d; color:#92400e; }
    .badge-chip .lock { opacity:0.6; }
    .finish ul { text-align:left; max-width:500px; margin:0 auto 20px; font-size:0.86rem; color:var(--text); line-height:1.6; }
    .finish li { margin-bottom:6px; }

    .ls-nav { display:flex; justify-content:space-between; gap:10px; }
    .ls-nav .spacer { flex:1; }
  </style>
</head>

<header class="bzwu-header">
  <div class="header-text">
  <span class="school-badge">BZWU Wil-Uzwil · Milchtechnologin / Milchtechnologe EFZ · a.7</span>
  <h1 id="pageTitle">Kälteanlagen</h1>
  <p id="subtitle">Kompressionsprinzip, Regulierung, Wartung und WRG</p>
  </div>
  <div class="header-logos">
    <img src="../assets/logos/bzwu.png" alt="BZWU" class="header-logo">
    <img src="../assets/logos/milchtechnologen.svg" alt="Milchtechnologen" class="header-logo">
  </div>
</header>

<main class="page-main">
  <a class="back-link" href="../index.html">← Alle Lerntools</a>

  <div class="ls-wrap">
    <div class="hud">
      <div class="hud-xp"><span class="hud-label">XP</span><span class="hud-val" id="hudXp">0</span></div>
      <div class="hud-bar"><div class="hud-bar-fill" id="hudBar"></div></div>
      <div class="hud-streak" id="hudStreak">
        <span id="hudStreakEmoji">🔥</span>
        <div class="hud-fire-wrap" id="hudFireWrap" style="display:none">
          <div class="fire">
            <div class="fire-bottom"><div class="main-fire"></div></div>
            <div class="fire-center"><div class="main-fire"></div><div class="particle-fire"></div></div>

    <div class="ls-nav">
      <button class="btn btn-ghost" id="prevBtn" onclick="goPrev()">&#8592; Zurück</button>
      <span class="spacer"></span>
      <button class="btn btn-primary" id="nextBtn" onclick="goNext()">Weiter &#8594;</button>
    </div>
  </div>
</main>

<footer class="bzwu-footer">BZWU Wil-Uzwil · Milchtechnologin / Milchtechnologe EFZ · Philipp Neukomm</footer>

<script>
var MODE = /[?&]mode=challenge/.test(location.search) ? 'challenge' : 'lernpfad';

var ALL = [
  { kicker:'Folien · Kompressionsprinzip', title:'Aufbau und Funktion der Kälteanlage', type:'slides',
    lead:'Lesen Sie alle Folien, danach prüfen Sie sich.',
    slides:[
      { icon:'🔄', color:'#1e4e8c', bg:'#dbeeff',
        title:'Kältemaschine = Wärmetransportmaschine',
        body:'<p>Damit ein Stoff verdampft, braucht er <b>Energie</b>. Diese Energie nimmt er aus seiner Umgebung. Dadurch kühlt die Umgebung ab. Genau diesen Effekt nutzt jede Kälteanlage.</p><p>Ein einfaches Beispiel aus dem Alltag: Wenn Sie nach dem Duschen nass aus der Kabine treten, frieren Sie sofort, obwohl der Raum warm ist. Das Wasser auf Ihrer Haut verdampft. Für diesen Vorgang braucht es Wärme, und diese Wärme kommt direkt von Ihrer Haut. Dasselbe passiert beim Schwitzen: Der Schweiss verdampft und kühlt den Körper ab. Probieren Sie es aus: Blasen Sie auf Ihre nasse Hand. Sie spüren sofort, wie sie kühler wird.</p><p>In einer Kälteanlage übernimmt ein spezielles Mittel diese Aufgabe, das <b>Kältemittel</b>. Es verdampft im Kühlraum und nimmt dabei die Wärme des Raumes auf. Danach transportiert es diese Wärme nach draussen und gibt sie dort wieder ab.</p><div class="factbox">Eine Kältemaschine erzeugt keine Kälte. Sie transportiert Wärme von innen nach aussen. Die Kälte im Kühlraum ist nur ein Nebeneffekt davon.</div>'
      },
      { icon:'❄️', color:'#6b21a8', bg:'#f3e8ff',
        title:'Die 4 Hauptbauteile',
        body:'<p>Gewerbliche Kälteanlagen arbeiten nach dem <b>Kompressionsprinzip</b>. Das Kältemittel durchläuft einen geschlossenen Kreislauf. Im Bild sehen Sie die vier Bauteile mit ihren Nummern.</p><img src="images/a.7_Kaelteanlage_Nummern.png" alt="Schema einer Kälteanlage"><p>Im <b>(1) Verdampfer</b> verdampft das flüssige Kältemittel. Dafür benötigt es Wärme, die es dem Kühlraum oder dem Eiswasserbassin entzieht. Dadurch wird es dort kalt. Das gasförmige Kältemittel wird vom <b>(2) Kompressor</b> angesaugt und verdichtet. Durch die Verdichtung steigen Druck und Temperatur stark an.</p><p>Das heisse, verdichtete Gas strömt in den <b>(3) Kondensator</b>. Dort kühlt es ab, wird wieder flüssig und gibt seine Wärme an die Luft oder ans Wasser ab. Danach fliesst das flüssige Kältemittel durch das <b>(4) Expansionsventil</b>. Dieses Ventil senkt den Druck, sodass das Kältemittel die richtige Temperatur für den Verdampfer erreicht. Dann beginnt der Kreislauf von vorne.</p>'

        body:'<p>Bei einem einfachen Kühlschrank reicht ein einziger <b>Thermostat</b>: Er misst die Temperatur im Inneren und schaltet den Kompressor je nach Bedarf ein oder aus. Bei grossen gewerblichen Anlagen sind dagegen mehrere Regelungselemente nötig. Das Bild zeigt, wie diese zusammenarbeiten.</p><img src="images/a.7_Kaelteregulierung_mit_Nummern.png" alt="Schema einer Kälteregulierung"><p>Auf der Niederdruckseite vor dem Kompressor sitzt der <b>(1) Niederdruckpressostat</b>, auf der Hochdruckseite dahinter der <b>(2) Hochdruckpressostat</b>. Das <b>(3) Magnetventil</b> öffnet und schliesst die Kältemittelzufuhr zum Verdampfer. Es bekommt seinen Befehl vom <b>(4) Thermostaten</b>, der die Kühlraumtemperatur misst. Das <b>(5) Thermostatische Expansionsventil</b> sitzt direkt vor dem Verdampfer und regelt, wie viel Kältemittel hindurchfliesst. Dafür bekommt es den Messwert vom <b>(6) Temperaturfühler</b> am Ende des Verdampfers.</p>'

    slides:[
      { icon:'🔧', color:'#15803d', bg:'#dcfce7',
        title:'Wartung: Was Sie selbst kontrollieren',
        body:'<p>Die Verdampfer in Kühlräumen neigen dazu, einzuvereisen. Mit der Zeit bildet sich ein Eisbelag auf den Lamellen. Dieser Belag wirkt wie eine Isolationsschicht und verhindert, dass Wärme vom Kühlraum ans Kältemittel übergehen kann. Die Folge: Der Raum kühlt weniger gut und der Stromverbrauch der Anlage steigt. Wenn die Anlage nicht automatisch abtaut, müssen Sie sie täglich abschalten und so lange ausgeschaltet lassen, bis das Eis vollständig getaut ist.</p><p>Luftgekühlte Kondensatoren geben viel Wärme an die Luft ab und dürfen deshalb nie in geschlossenen oder schlecht belüfteten Räumen installiert werden. Die feinen Lamellen des Kondensators setzen sich mit der Zeit mit Staub und Schmutz zu, was die Kühlleistung vermindert. Reinigen Sie die Lamellen regelmässig mit <b>Pressluft</b>. Wasser unter Druck eignet sich nicht, weil es die Lamellen verbiegen kann.</p><p>Bei älteren Anlagen treibt oft ein <b>Keilriemen</b> den Kompressor an. Prüfen Sie regelmässig, ob der Riemen die richtige Spannung hat. Ein zu loser Riemen rutscht durch und überträgt weniger Kraft. Ein zu strammer Riemen belastet die Lager unnötig.</p><div class="factbox">Einstellungen an Regelungseinrichtungen dürfen nur Fachpersonen vornehmen. Als Milchtechnologin oder Milchtechnologe kontrollieren und reinigen Sie, stellen aber nichts neu ein.</div>'

      { icon:'♻️', color:'#1e4e8c', bg:'#dbeeff',
        title:'Wärmerückgewinnung (WRG)',
        body:'<p>Wenn eine Kälteanlage läuft, gibt der Kondensator ständig Wärme ab. Das ist die Wärme, die der Verdampfer aus dem Kühlraum aufgenommen hat, plus die Energie des Kompressormotors. Ohne Wärmerückgewinnung geht diese Wärme einfach verloren. Mit einem <b>WRG-Boiler</b> wird sie sinnvoll genutzt.</p><img src="images/a.7_Waermerueckgewinnung_mit_Nummern.png" alt="Schema Boiler mit Wärmerückgewinnung"><p>Das Kältemittel kommt als heisses Gas vom Kompressor bei <b>(3)</b> und fliesst in den <b>(4) Kondensator</b> im Inneren des Boilers. Dort gibt es seine Wärme an das Wasser ab, kühlt sich ab und wird wieder flüssig. Danach fliesst es weiter zum <b>(5) Druckreduzierventil</b>. Kaltes Wasser tritt unten bei <b>(1)</b> in den Boiler ein und wird durch die Kondensatorwärme erwärmt. Oben bei <b>(2)</b> wird das vorgewärmte Wasser entnommen. Die <b>(6) Nacherhitzung</b> im oberen Teil des Boilers bringt das Wasser mit Heizung oder Elektrizität auf die gewünschte Endtemperatur.</p>'

/* Challenge = ohne Info-Lesetexte und Slides */
var STATIONS = ALL.filter(function(s){ return MODE === 'challenge' ? (s.type !== 'info' && s.type !== 'pdf' && s.type !== 'slides' && s.type !== 'video') : true; });

(function(){
  var t = (MODE === 'challenge') ? 'Challenge' : 'Lernpfad';
  document.getElementById('pageTitle').textContent = t + ': Kälteanlagen';
  document.getElementById('subtitle').textContent = (MODE === 'challenge')
    ? 'Prüfungsmodus: ohne Hilfen, Bauteile eintippen'
    : 'Wissensvermittlung: mit Lesetexten und Übungen';
  document.title = t + ': Kälteanlagen (a.7)';
})();

var N = STATIONS.length;
var current = 0;
var solved = [], earned = [], maxPts = [];
for (var i = 0; i < N; i++) { solved[i] = false; earned[i] = 0; maxPts[i] = 0; }
var xp = 0, streak = 0, bestStreak = 0;

function findIdx(id){ for(var i=0;i<N;i++){ if(STATIONS[i].id===id) return i; } return -1; }
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;} return a; }
function shuffleIdx(n){ var a=[]; for(var i=0;i<n;i++) a.push(i); return shuffle(a); }
function fold(s){ return String(s).toLowerCase().replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim(); }
function matchKeys(input, it){ var f=fold(input); if(!f) return false; if(f===fold(it.name)) return true; for(var i=0;i<it.keys.length;i++){ if(f.indexOf(fold(it.keys[i]))!==-1) return true; } return false; }

function renderHud(){
  document.getElementById('hudXp').textContent = xp;
  var sc=0; for(var i=0;i<N;i++){ if(solved[i]) sc++; }
  document.getElementById('hudBar').style.width = Math.round(sc/N*100)+'%';
  document.getElementById('hudStreakNum').textContent = streak;
  var onFire = streak >= 3;
  document.getElementById('hudBar').classList.toggle('on-fire', onFire);
  document.getElementById('hudStreakEmoji').style.display = onFire ? 'none' : '';
  document.getElementById('hudFireWrap').style.display = onFire ? 'inline-block' : 'none';
  document.getElementById('hudStreakNum').className = onFire ? 'streak-num-fire' : '';
}
function addXp(n){ xp+=n; var el=document.getElementById('hudXp'); renderHud(); el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); }
function showStreakPop(){ var el=document.createElement('span'); el.className='streak-pop'; el.textContent='+1 🔥'; document.getElementById('hudStreak').appendChild(el); setTimeout(function(){ el.remove(); }, 900); }
function registerAnswer(ok){
  if(ok){ streak++; if(streak>bestStreak) bestStreak=streak; addXp(10+(streak>=3?5:0)); showStreakPop(); var s=document.getElementById('hudStreak'); s.classList.remove('pulse'); void s.offsetWidth; s.classList.add('pulse'); }
  else { streak=0; renderHud(); }
}

function buildAll(){
  var stage=document.getElementById('stage'); stage.innerHTML='';
  STATIONS.forEach(function(st, idx){
    var card=document.createElement('div');
    card.className='station'+(st.boss?' boss':'')+(idx===0?'':' hidden'); card.id='station-'+idx;
    card.innerHTML='<div class="station-kicker">'+st.kicker+'</div>'+
      '<div class="station-title">'+st.title+'</div>'+
      '<div class="station-lead">'+st.lead+'</div>'+
      (st.media?'<div class="station-media">'+st.media+'</div>':'')+
      '<div class="station-body" id="body-'+idx+'"></div>';
    stage.appendChild(card);
    buildBody(idx, st);
  });
  var fin=document.createElement('div'); fin.className='station hidden'; fin.id='station-finish';
  fin.innerHTML='<div class="finish" id="finishBody"></div>'; stage.appendChild(fin);
}
function buildBody(idx, st){
  if(st.type==='pdf')    buildPdf(idx, st);
  if(st.type==='video')  buildVideo(idx, st);
  if(st.type==='info')   buildInfo(idx, st);
  if(st.type==='slides') buildSlides(idx, st);
  if(st.type==='tf')     buildTF(idx, st);
  if(st.type==='label')  (MODE==='challenge') ? buildLabelType(idx, st) : buildLabelChoose(idx, st);
  if(st.type==='gaps')   buildGaps(idx, st);
  if(st.type==='quiz')   buildQuiz(idx, st);
}

    '<div class="read-btn-icon">'+CHECK_SVG+'</div>'+

    if(solved[idx]) return; solved[idx]=true; addXp(5);

function buildSlides(idx, st){
  maxPts[idx]=0;
  var cur=0;
  var slides=st.slides;
  var body=document.getElementById('body-'+idx);

  var html='<div class="slideshow" id="ssw-'+idx+'">';
  slides.forEach(function(sl,si){
    html+='<div class="slide-panel'+(si===0?' active':'')+'" id="ssp-'+idx+'-'+si+'">';
    html+='<div class="slide-header" style="background:'+sl.bg+';">';
    html+='<span class="slide-icon">'+sl.icon+'</span>';
    html+='<span class="slide-htitle" style="color:'+sl.color+';">'+sl.title+'</span>';
    html+='</div><div class="slide-body read">'+sl.body+'</div></div>';
  });
  html+='</div>';
  html+='<div class="slide-nav-row">';
  html+='<button class="slide-nav-btn" id="sprev-'+idx+'" disabled>&#8592; Zurück</button>';
  html+='<div style="display:flex;align-items:center;gap:8px;"><div class="slide-dots" id="sdots-'+idx+'"></div>';
  html+='<span class="slide-counter" id="sctr-'+idx+'"></span></div>';
  html+='<button class="slide-nav-btn" id="snext-'+idx+'">Weiter &#8594;</button>';
  html+='</div>';
  html+='<div class="read-btn-row" id="sbtnrow-'+idx+'" style="display:'+(slides.length<=1?'':'none')+'">';
  html+='<button class="read-btn" id="readbtn-'+idx+'">';
  html+='<div class="read-btn-icon">'+CHECK_SVG+'</div>';
  html+='<span class="read-btn-text">Gelesen &#10003; (+5 XP)</span></button></div>';
  body.innerHTML=html;

  function renderDots(){
    var el=document.getElementById('sdots-'+idx); el.innerHTML='';
    slides.forEach(function(sl,si){
      var d=document.createElement('span'); d.className='slide-dot'+(si===cur?' active':si<cur?' done':'');
      d.addEventListener('click',function(){ if(si!==cur) go(si); });
      el.appendChild(d);
    });
    var ctr=document.getElementById('sctr-'+idx);
    if(ctr) ctr.textContent=(cur+1)+' / '+slides.length;
  }
  function renderNav(){
    document.getElementById('sprev-'+idx).disabled=(cur===0);
    document.getElementById('snext-'+idx).disabled=(cur===slides.length-1);
    var btnRow=document.getElementById('sbtnrow-'+idx);
    if(btnRow) btnRow.style.display=(cur===slides.length-1)?'':'none';
  }
  function go(newIdx){
    var dir=newIdx>cur?'right':'left';
    var panel=document.getElementById('ssp-'+idx+'-'+newIdx);
    slides.forEach(function(sl,si){ document.getElementById('ssp-'+idx+'-'+si).classList.remove('active','slide-in-right','slide-in-left'); });
    panel.classList.add('active',dir==='right'?'slide-in-right':'slide-in-left');
    cur=newIdx; renderDots(); renderNav();
  }
  renderDots(); renderNav();
  document.getElementById('sprev-'+idx).addEventListener('click',function(){ if(cur>0) go(cur-1); });
  document.getElementById('snext-'+idx).addEventListener('click',function(){ if(cur<slides.length-1) go(cur+1); });

  var tsX=0;
  document.getElementById('ssw-'+idx).addEventListener('touchstart',function(e){ tsX=e.touches[0].clientX; },{passive:true});
  document.getElementById('ssw-'+idx).addEventListener('touchend',function(e){
    var dx=e.changedTouches[0].clientX-tsX;
    if(Math.abs(dx)>42){ if(dx<0&&cur<slides.length-1) go(cur+1); else if(dx>0&&cur>0) go(cur-1); }
  },{passive:true});

  document.getElementById('readbtn-'+idx).addEventListener('click',function(){
    if(solved[idx]) return; solved[idx]=true; addXp(5);
    this.disabled=true; this.classList.add('done');
    this.querySelector('.read-btn-text').textContent='Gelesen ✓';
    updateNav();
  });
}

/* Beschriften – Lernpfad: Drag & Drop */
var _lbD={word:null,src:null,bank:null,sel:null,selChip:null};
function _lbOnDrop(box, word, source){
  if(box.classList.contains('correct')||box.classList.contains('wrong')) return;
  var disp=box.dataset.filled||null;
  if(source.isSlot){ _lbClear(source.el); if(disp) _lbFill(source.el,disp); }
  else { _lbUse(word,_lbD.bank); if(disp) _lbRet(disp,_lbD.bank); }
  _lbFill(box,word);
}
function _lbFill(box,word){ box.dataset.filled=word; box.textContent=word; box.className='lb-slot lb-filled'; box.setAttribute('draggable','true'); }
function _lbClear(box){ delete box.dataset.filled; box.textContent='—'; box.className='lb-slot'; box.setAttribute('draggable','false'); }
function _lbUse(word,bank){ var ok=false; bank.querySelectorAll('.lb-chip').forEach(function(c){ if(!ok&&c.dataset.word===word&&!c.classList.contains('used')){c.classList.add('used');ok=true;} }); }
function _lbRet(word,bank){ var ok=false; bank.querySelectorAll('.lb-chip').forEach(function(c){ if(!ok&&c.dataset.word===word&&c.classList.contains('used')){c.classList.remove('used');ok=true;} }); }
function _lbDrop(box){
  if(!_lbD.word||box.classList.contains('correct')||box.classList.contains('wrong')) return;
  var disp=box.dataset.filled||null;
  if(_lbD.src&&_lbD.src.classList.contains('lb-slot')){ _lbClear(_lbD.src); if(disp) _lbFill(_lbD.src,disp); }
  else { _lbUse(_lbD.word,_lbD.bank); if(disp) _lbRet(disp,_lbD.bank); }
  _lbFill(box,_lbD.word); _lbD.word=_lbD.src=null;
}
function _lbSelChip(chip,word,bank){
  if(chip.classList.contains('selected')){ chip.classList.remove('selected'); _lbD.sel=null; _lbD.selChip=null; document.querySelectorAll('.lb-slot.lb-ready').forEach(function(b){b.classList.remove('lb-ready');}); return; }
  document.querySelectorAll('.lb-chip.selected').forEach(function(c){c.classList.remove('selected');});
  chip.classList.add('selected'); _lbD.sel=word; _lbD.selChip=chip; _lbD.bank=bank;
  document.querySelectorAll('.lb-slot').forEach(function(b){ b.classList.remove('lb-ready'); if(!b.dataset.filled&&!b.classList.contains('correct')&&!b.classList.contains('wrong')) b.classList.add('lb-ready'); });
}
function _lbClickBox(box,bank){
  if(box.classList.contains('correct')||box.classList.contains('wrong')) return;
  if(box.dataset.filled){ _lbRet(box.dataset.filled,bank); _lbClear(box); if(_lbD.sel) box.classList.add('lb-ready'); return; }
  if(!_lbD.sel) return;
  _lbFill(box,_lbD.sel); _lbUse(_lbD.sel,bank); _lbD.sel=null;
  if(_lbD.selChip){_lbD.selChip.classList.remove('selected');_lbD.selChip=null;}
  document.querySelectorAll('.lb-slot.lb-ready').forEach(function(b){b.classList.remove('lb-ready');});
}
function buildLabelChoose(idx,st){
  maxPts[idx]=st.items.length;
  var names=st.items.map(function(it){return it.name;}).filter(function(v,i,a){return a.indexOf(v)===i;});
  var body=document.getElementById('body-'+idx);
  var bank=document.createElement('div'); bank.className='lb-bank';
  shuffle(names).forEach(function(word){
    var chip=document.createElement('span'); chip.className='lb-chip'; chip.textContent=word; chip.dataset.word=word; chip.setAttribute('draggable','true');
    chip.addEventListener('dragstart',function(e){_lbD.word=word;_lbD.src=chip;_lbD.bank=bank;e.dataTransfer.effectAllowed='move';});
    chip.addEventListener('touchstart',function(e){_lbD.bank=bank;MTDnD.touchStart(e,chip,word,false,'.lb-slot',_lbOnDrop);},{passive:false});
    chip.addEventListener('click',function(){_lbSelChip(chip,word,bank);});
    bank.appendChild(chip);
  });
  body.appendChild(bank);
  var grid=document.createElement('div'); grid.className='slots-grid';
  st.items.forEach(function(p){
    var row=document.createElement('div'); row.className='slot-row';
    var badge=document.createElement('div'); badge.className='slot-num'; badge.textContent=p.n;
    var box=document.createElement('div'); box.className='lb-slot'; box.dataset.slot=p.n; box.textContent='—';
    box.addEventListener('dragover',function(e){e.preventDefault();if(!box.classList.contains('correct')&&!box.classList.contains('wrong'))box.classList.add('lb-over');});
    box.addEventListener('dragleave',function(){box.classList.remove('lb-over');});
    box.addEventListener('drop',function(e){e.preventDefault();box.classList.remove('lb-over');_lbDrop(box);});
    box.addEventListener('dragstart',function(e){if(!box.dataset.filled){e.preventDefault();return;}_lbD.word=box.dataset.filled;_lbD.src=box;_lbD.bank=bank;e.dataTransfer.effectAllowed='move';});
    box.addEventListener('touchstart',function(e){if(!box.dataset.filled)return;_lbD.bank=bank;MTDnD.touchStart(e,box,box.dataset.filled,true,'.lb-slot',_lbOnDrop);},{passive:false});
    box.addEventListener('click',function(){_lbClickBox(box,bank);});
    row.appendChild(badge);row.appendChild(box);grid.appendChild(row);
  });
  body.appendChild(grid);
  var checkBtn=document.createElement('button'); checkBtn.className='btn btn-primary'; checkBtn.style.marginTop='12px';
  checkBtn.textContent='Überprüfen';
  checkBtn.addEventListener('click',function(){
    if(solved[idx]) return; var correct=0;
    st.items.forEach(function(p){
      var box=grid.querySelector('[data-slot="'+p.n+'"]');
      box.classList.remove('lb-filled','lb-over','lb-ready');
      if(box.dataset.filled===p.name){box.classList.add('correct');correct++;}else{box.classList.add('wrong');}
    });
    earned[idx]=correct; solved[idx]=true; checkBtn.disabled=true; updateNav();
  });
  body.appendChild(checkBtn);
}

function buildGaps(idx, st){
  var gapCount=0; var html='<div class="gap-text">';
  st.parts.forEach(function(part){
    if(typeof part==='string'){ html+=part; }
    else { var gi=gapCount++; var opts=shuffleIdx(part.opts.length);
      html+='<select data-g="'+gi+'" data-correct="'+part.correct+'"><option value="-1">…</option>';
      opts.forEach(function(oi){ html+='<option value="'+oi+'">'+part.opts[oi]+'</option>'; });
      html+='</select>';
    }
  });
  html+='</div><div class="check-btn-row"><button class="btn btn-primary" id="gapcheck-'+idx+'">Prüfen</button></div>';
  document.getElementById('body-'+idx).innerHTML=html;
  maxPts[idx]=gapCount;
  document.getElementById('gapcheck-'+idx).addEventListener('click', function(){
    if(solved[idx]) return;
    var sels=document.querySelectorAll('#body-'+idx+' select'); var ok=0;
    sels.forEach(function(sel){ sel.classList.remove('correct','wrong'); var good=(+sel.value===+sel.dataset.correct); if(good){sel.classList.add('correct'); ok++;} else sel.classList.add('wrong'); sel.disabled=true; registerAnswer(good); });
    earned[idx]=ok; solved[idx]=true; this.disabled=true; updateNav();
  });
}

function buildQuiz(idx, st){
  maxPts[idx]=st.questions.length;
  var body=document.getElementById('body-'+idx);
  st.questions.forEach(function(qq, qi){
    var block=document.createElement('div'); block.className='q-block';
    var h='<div class="q-text">'+(qi+1)+'. '+qq.q+'</div>';
    shuffleIdx(qq.opts.length).forEach(function(oi){ h+='<button class="opt" data-q="'+qi+'" data-o="'+oi+'">'+qq.opts[oi]+'</button>'; });
    block.innerHTML=h; body.appendChild(block);
  });
  body.querySelectorAll('.opt').forEach(function(btn){
    btn.addEventListener('click', function(){
      var qi=+btn.dataset.q, oi=+btn.dataset.o, qq=st.questions[qi];
      if(body.querySelector('.opt[data-q="'+qi+'"]:disabled')) return;
      body.querySelectorAll('.opt[data-q="'+qi+'"]').forEach(function(b){ b.disabled=true; if(+b.dataset.o===qq.correct) b.classList.add('correct'); });
      if(oi!==qq.correct){ btn.classList.add('wrong'); registerAnswer(false); } else { earned[idx]++; registerAnswer(true); }
      var answered=0; for(var k=0;k<st.questions.length;k++){ if(document.querySelector('#body-'+idx+' .opt[data-q="'+k+'"]:disabled')) answered++; }
      if(answered===st.questions.length) solved[idx]=true;
      updateNav();
    });
  });
}

function renderProgress(){
  var dots=document.getElementById('lsDots'); dots.innerHTML='';
  for(var i=0;i<N;i++){ var d=document.createElement('div'); d.className='ls-dot'+(i===current?' active':'')+(solved[i]?' done':''); d.textContent=solved[i]?'✓':(i+1); dots.appendChild(d); }
  document.getElementById('lsMeta').textContent = (current<N) ? ('Posten '+(current+1)+' von '+N) : 'Auswertung';
}
function showCard(which){
  document.querySelectorAll('.station').forEach(function(c){ c.classList.add('hidden'); });
  document.getElementById(which==='finish'?'station-finish':'station-'+which).classList.remove('hidden');
  window.scrollTo({top:0, behavior:'smooth'});
}
function updateNav(){
  var nextBtn=document.getElementById('nextBtn'), prevBtn=document.getElementById('prevBtn');
  prevBtn.style.visibility=(current===0)?'hidden':'visible';
  if(current<N){ nextBtn.disabled=!solved[current]; nextBtn.textContent=(current===N-1)?'Zur Auswertung →':'Weiter →'; }
  renderProgress(); renderHud();
}
function goNext(){ if(current<N){ if(!solved[current]) return; current++; if(current<N){ showCard(current); updateNav(); } else { showFinish(); } } }
function goPrev(){ if(current===0) return; if(current>=N) current=N-1; else current--; showCard(current); document.getElementById('nextBtn').style.visibility='visible'; document.getElementById('nextBtn').disabled=false; updateNav(); }

function showFinish(){
  var total=0, max=0; for(var i=0;i<N;i++){ total+=earned[i]; max+=maxPts[i]; }
  var pct=max>0?Math.round(total/max*100):0;
  var rank = pct>=90?'Kälte-Meister 🥇' : pct>=75?'Kälte-Profi' : pct>=50?'Kälte-Geselle' : 'Kälte-Lehrling';
  var badges=[
    { icon:'📖', name:'Aufmerksamer Leser', got: MODE!=='challenge' },
    { icon:'❄️', name:'Anlage-Kenner', got: findIdx('a_label')>=0 && earned[findIdx('a_label')]===maxPts[findIdx('a_label')] },
    { icon:'⚙️', name:'Regulierungs-Profi', got: findIdx('c_label')>=0 && earned[findIdx('c_label')]===maxPts[findIdx('c_label')] },
    { icon:'♻️', name:'WRG-Spezialist', got: findIdx('e_label')>=0 && earned[findIdx('e_label')]===maxPts[findIdx('e_label')] },
    { icon:'⚡', name:'Serie (Streak 8+)', got: bestStreak>=8 },
    { icon:'🥇', name:'Kälte-Meister (90 %)', got: pct>=90 }
  ];
  var got=0, bh=''; badges.forEach(function(b){ if(b.got) got++; bh+='<span class="badge-chip'+(b.got?' earned':'')+'">'+(b.got?b.icon:'<span class="lock">🔒</span>')+' '+b.name+'</span>'; });
  document.getElementById('finishBody').innerHTML=
    '<div class="station-kicker">'+(MODE==='challenge'?'Prüfung beendet':'Geschafft')+'</div>'+
    '<div class="rank">'+rank+'</div>'+
    '<div class="big-score">'+xp+' XP</div>'+
    '<div class="score-sub">'+total+' / '+max+' Punkte ('+pct+' %) · längste Serie 🔥 '+bestStreak+' · '+got+'/'+badges.length+' Abzeichen</div>'+
    '<div class="badges">'+bh+'</div>'+
    '<button class="btn btn-primary" onclick="restart()">Nochmals starten</button>'+
    '<a class="back-link" href="../index.html" style="display:block;margin-top:14px;">← Alle Lerntools</a>';
  showCard('finish');
  document.getElementById('nextBtn').style.visibility='hidden';
  document.getElementById('prevBtn').style.visibility='visible';
  renderProgress();
}
function restart(){
  current=0; xp=0; streak=0; bestStreak=0;
  for(var i=0;i<N;i++){ solved[i]=false; earned[i]=0; }
  document.getElementById('nextBtn').style.visibility='visible';
  buildAll(); showCard(0); updateNav();
}

buildAll(); showCard(0); updateNav();
