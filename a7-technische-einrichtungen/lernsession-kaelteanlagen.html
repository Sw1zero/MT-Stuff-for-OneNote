  { kicker:'Folien · Kompressionsprinzip', title:'Aufbau und Funktion der Kälteanlage', type:'slides',

    slides:[
      { icon:'🔄', color:'#1e4e8c', bg:'#dbeeff',
        title:'Kältemaschine = Wärmetransportmaschine',
        body:'<p>Damit ein Stoff verdampft, braucht er <b>Energie</b>. Diese Energie nimmt er aus seiner Umgebung. Dadurch kühlt die Umgebung ab. Genau diesen Effekt nutzt jede Kälteanlage.</p><p>Ein einfaches Beispiel aus dem Alltag: Wenn Sie nach dem Duschen nass aus der Kabine treten, frieren Sie sofort, obwohl der Raum warm ist. Das Wasser auf Ihrer Haut verdampft. Für diesen Vorgang braucht es Wärme, und diese Wärme kommt direkt von Ihrer Haut. Dasselbe passiert beim Schwitzen: Der Schweiss verdampft und kühlt den Körper ab. Probieren Sie es aus: Blasen Sie auf Ihre nasse Hand. Sie spüren sofort, wie sie kühler wird.</p><p>In einer Kälteanlage übernimmt ein spezielles Mittel diese Aufgabe, das <b>Kältemittel</b>. Es verdampft im Kühlraum und nimmt dabei die Wärme des Raumes auf. Danach transportiert es diese Wärme nach draussen und gibt sie dort wieder ab.</p><div class="factbox">Eine Kältemaschine erzeugt keine Kälte. Sie transportiert Wärme von innen nach aussen. Die Kälte im Kühlraum ist nur ein Nebeneffekt davon.</div>'
      },
      { icon:'❄️', color:'#6b21a8', bg:'#f3e8ff',
        title:'Die 4 Hauptbauteile',
        body:'<p>Gewerbliche Kälteanlagen arbeiten nach dem <b>Kompressionsprinzip</b>. Das Kältemittel durchläuft einen geschlossenen Kreislauf. Im Bild sehen Sie die vier Bauteile mit ihren Nummern.</p><img src="images/a.7_Kaelteanlage_Nummern.png" alt="Schema einer Kälteanlage"><p>Im <b>(1) Verdampfer</b> verdampft das flüssige Kältemittel. Dafür benötigt es Wärme, die es dem Kühlraum oder dem Eiswasserbassin entzieht. Dadurch wird es dort kalt. Das gasförmige Kältemittel wird vom <b>(2) Kompressor</b> angesaugt und verdichtet. Durch die Verdichtung steigen Druck und Temperatur stark an.</p><p>Das heisse, verdichtete Gas strömt in den <b>(3) Kondensator</b>. Dort kühlt es ab, wird wieder flüssig und gibt seine Wärme an die Luft oder ans Wasser ab. Danach fliesst das flüssige Kältemittel durch das <b>(4) Expansionsventil</b>. Dieses Ventil senkt den Druck, sodass das Kältemittel die richtige Temperatur für den Verdampfer erreicht. Dann beginnt der Kreislauf von vorne.</p>'
      },
      { icon:'🧪', color:'#15803d', bg:'#dcfce7',
        title:'Kältemittel',
        body:'<p>Nicht jede Flüssigkeit eignet sich als Kältemittel. Es muss bei tiefen Temperaturen verdampfen, und zwar bei einem Druck, der weder zu hoch noch zu tief ist.</p><p>In der Milchverarbeitung werden heute hauptsächlich die chlorfreien Sicherheitskältemittel <b>R134a</b> und <b>R404a</b> eingesetzt. Als Beispiel: R134a verdampft bei einer Verdampfungstemperatur von -10 °C bei nur <b>2 bar</b> Druck. Im Kondensator, wo die Temperatur etwa 50 °C beträgt, liegt der Druck bei <b>13,2 bar</b>. Diese Druckdifferenz treibt den gesamten Kreislauf an. Wichtig zu wissen: Auch R134a und R404a tragen zum <b>Treibhauseffekt</b> bei. Sie dürfen für neue Anlagen deshalb nur noch so lange eingesetzt werden, bis bessere Alternativen verfügbar sind.</p><p>Grosse Industrieanlagen arbeiten oft mit <b>Ammoniak (NH3)</b>. Ammoniak ist ein natürliches Kältemittel und belastet die Umwelt weniger. Es hat jedoch einen wichtigen Nachteil: Es ist giftig. Deshalb müssen Anlagen mit NH3 regelmässig von ausgebildetem Fachpersonal kontrolliert werden.</p><div class="factbox">Ältere Anlagen enthalten manchmal noch <b>FCKW</b> (Fluorchlorkohlenwasserstoffe). Diese Stoffe zerstören die <b>Ozonschicht</b> und sind für neue Anlagen verboten. Bei einer Leckage darf kein FCKW mehr nachgefüllt werden.</div>'
      }
    ] },

  { kicker:'Folien · Kälteregulierung', title:'Regulierung der Kälteanlage', type:'slides',
    lead:'Drei Regelungselemente im Detail.',
    slides:[
      { icon:'⚙️', color:'#1e4e8c', bg:'#dbeeff',
        title:'Überblick: Kleine und grosse Anlagen',
        body:'<p>Bei einem einfachen Kühlschrank reicht ein einziger <b>Thermostat</b>: Er misst die Temperatur im Inneren und schaltet den Kompressor je nach Bedarf ein oder aus. Bei grossen gewerblichen Anlagen sind dagegen mehrere Regelungselemente nötig. Das Bild zeigt, wie diese zusammenarbeiten.</p><img src="images/a.7_Kaelteregulierung_mit_Nummern.png" alt="Schema einer Kälteregulierung"><p>Auf der Niederdruckseite vor dem Kompressor sitzt der <b>(1) Niederdruckpressostat</b>, auf der Hochdruckseite dahinter der <b>(2) Hochdruckpressostat</b>. Das <b>(3) Magnetventil</b> öffnet und schliesst die Kältemittelzufuhr zum Verdampfer. Es bekommt seinen Befehl vom <b>(4) Thermostaten</b>, der die Kühlraumtemperatur misst. Das <b>(5) Thermostatische Expansionsventil</b> sitzt direkt vor dem Verdampfer und regelt, wie viel Kältemittel hindurchfliesst. Dafür bekommt es den Messwert vom <b>(6) Temperaturfühler</b> am Ende des Verdampfers.</p>'
      },
      { icon:'🌡️', color:'#15803d', bg:'#dcfce7',
        title:'Expansionsventil und Magnetventil',
        body:'<p>Das <b>thermostatische Expansionsventil (5)</b> hat eine sehr genaue Aufgabe: Es muss sicherstellen, dass das Kältemittel am Ende des Verdampfers vollständig verdampft ist. Das ist wichtig, weil <b>flüssiges Kältemittel im Kompressor</b> grossen Schaden anrichten würde.</p><p>Der <b>Temperaturfühler (6)</b> misst ständig die Temperatur am Ende des Verdampfers. Ist es dort zu warm, bedeutet das, dass zu wenig Kältemittel im Verdampfer ist. Das Expansionsventil öffnet sich etwas weiter und lässt mehr durchfliessen. Ist die Temperatur zu tief, dreht das Ventil ab und lässt weniger durch. So bleibt die Menge immer genau richtig.</p><p>Das <b>Magnetventil (3)</b> funktioniert anders: Es öffnet oder schliesst vollständig, es gibt keinen Zwischenzustand. Es sitzt direkt vor dem Expansionsventil und bekommt seinen Befehl vom <b>Thermostaten (4)</b>. Wenn die Kühlraumtemperatur zu hoch ist, öffnet das Magnetventil und das Kältemittel fliesst. Wenn die gewünschte Temperatur erreicht ist, schliesst es und die Kühlung stoppt.</p>'
      },
      { icon:'🔧', color:'#92400e', bg:'#fff7ed',
        title:'Druckregelung mit Pressostat',
        body:'<p>Der <b>Pressostat</b> ist ein Druckschalter. Er misst den Druck des Kältemittels im Leitungsnetz und schaltet den Kompressor je nach Druckzustand ein oder aus.</p><p>Der <b>(1) Niederdruckpressostat</b> sitzt vor dem Kompressor auf der Niederdruckseite. Er misst den Ansaugdruck. Wenn der Druck einen bestimmten Wert überschreitet, schaltet er den Kompressor ein. Wenn der Druck auf den gewünschten Wert gesunken ist, schaltet er ihn wieder aus.</p><p>Auf der <b>Hochdruckseite</b> nach dem Kompressor ist häufig ein <b>(2) Hochdruckpressostat</b> eingebaut. Dieser wirkt als Sicherheitseinrichtung. Wenn der Druck nach dem Kompressor zu gross wird, schaltet er den Kompressor sofort aus und schützt die Anlage. Das kann zum Beispiel passieren, wenn die Kondensatorlamellen verschmutzt sind und die Wärme nicht mehr richtig abgeführt werden kann.</p><div class="factbox">Merkhilfe: Der (1) Niederdruckpressostat sitzt vor dem Kompressor. Der (2) Hochdruckpressostat sitzt dahinter und schützt die Anlage.</div>'
      }
    ] },

  { kicker:'Folien · Gefahren', title:'Gefahren an der Kälteanlage', type:'slides',
    lead:'Drei Hauptgefahren und das richtige Verhalten.',
    slides:[
      { icon:'☠️', color:'#c40027', bg:'#fde8ed',
        title:'Gefahr 1: Ammoniak-Vergiftung',
        body:'<p>Ammoniak (NH3) ist giftig und stark reizend für Augen und Atemwege. Es ist <b>leichter als Luft</b> und steigt bei einer Leckage nach oben, deshalb sind Gasmelder im oberen Raumbereich montiert.</p><p>Verhalten bei Alarm oder stechendem Geruch:</p><ol><li>Raum <b>sofort verlassen</b> und Türe schliessen</li><li>Fluchtwege benutzen, nie den Lift</li><li>Fachperson bzw. Notfallorganisation alarmieren</li></ol><div class="factbox">Nur ausgebildetes Fachpersonal darf an NH3-Anlagen Eingriffe vornehmen.</div>'
      },
      { icon:'💥', color:'#1e4e8c', bg:'#dbeeff',
        title:'Gefahr 2: Pressostat-Versagen',
        body:'<p>Verschmutzte Kondensatorlamellen oder ein defekter <b>Hochdruckpressostat</b> lassen den Druck ungebremst steigen. Ohne rechtzeitige Abschaltung können Leitungen oder Verschraubungen bersten.</p><p>Der Hochdruckpressostat ist die zentrale Sicherheitseinrichtung gegen Überdruck. Er darf nie überbrückt oder ausser Betrieb gesetzt werden.</p><div class="factbox">Ungewöhnliche Geräusche oder ein Überdruck-Alarm: Anlage sofort ausser Betrieb nehmen und Fachperson beiziehen.</div>'

  { kicker:'Folien · Wartung & WRG', title:'Wartung und Wärmerückgewinnung', type:'slides',
    lead:'Was bei Wartung und WRG zu beachten ist.',
    slides:[
      { icon:'🔧', color:'#15803d', bg:'#dcfce7',
        title:'Wartung: Was Sie selbst kontrollieren',
        body:'<p>Die Verdampfer in Kühlräumen neigen dazu, einzuvereisen. Mit der Zeit bildet sich ein Eisbelag auf den Lamellen. Dieser Belag wirkt wie eine Isolationsschicht und verhindert, dass Wärme vom Kühlraum ans Kältemittel übergehen kann. Die Folge: Der Raum kühlt weniger gut und der Stromverbrauch der Anlage steigt. Wenn die Anlage nicht automatisch abtaut, müssen Sie sie <b>täglich abschalten</b> und so lange ausgeschaltet lassen, bis das Eis vollständig getaut ist.</p><p>Luftgekühlte Kondensatoren geben viel Wärme an die Luft ab und dürfen deshalb nie in geschlossenen oder schlecht belüfteten Räumen installiert werden. Die feinen Lamellen des Kondensators setzen sich mit der Zeit mit Staub und Schmutz zu, was die Kühlleistung vermindert. Reinigen Sie die Lamellen regelmässig mit <b>Pressluft</b>. Wasser unter Druck eignet sich nicht, weil es die Lamellen verbiegen kann.</p><p>Bei älteren Anlagen treibt oft ein <b>Keilriemen</b> den Kompressor an. Prüfen Sie regelmässig, ob der Riemen die richtige Spannung hat. Ein zu loser Riemen rutscht durch und überträgt weniger Kraft. Ein zu strammer Riemen belastet die Lager unnötig.</p><div class="factbox">Einstellungen an Regelungseinrichtungen dürfen nur Fachpersonen vornehmen. Als Milchtechnologin oder Milchtechnologe kontrollieren und reinigen Sie, stellen aber nichts neu ein.</div>'
      },
      { icon:'♻️', color:'#1e4e8c', bg:'#dbeeff',
        title:'Wärmerückgewinnung (WRG)',
        body:'<p>Wenn eine Kälteanlage läuft, gibt der Kondensator ständig Wärme ab. Das ist die Wärme, die der Verdampfer aus dem Kühlraum aufgenommen hat, plus die Energie des Kompressormotors. Ohne Wärmerückgewinnung geht diese Wärme einfach verloren. Mit einem <b>WRG-Boiler</b> wird sie sinnvoll genutzt.</p><img src="images/a.7_Waermerueckgewinnung_mit_Nummern.png" alt="Schema Boiler mit Wärmerückgewinnung"><p>Das Kältemittel kommt als heisses Gas vom Kompressor bei <b>(3)</b> und fliesst in den <b>(4) Kondensator</b> im Inneren des Boilers. Dort gibt es seine Wärme an das Wasser ab, kühlt sich ab und wird wieder flüssig. Danach fliesst es weiter zum <b>(5) Druckreduzierventil</b>. Kaltes Wasser tritt unten bei <b>(1)</b> in den Boiler ein und wird durch die Kondensatorwärme erwärmt. Oben bei <b>(2)</b> wird das vorgewärmte Wasser entnommen. Die <b>(6) Nacherhitzung</b> im oberen Teil des Boilers bringt das Wasser mit Heizung oder Elektrizität auf die gewünschte Endtemperatur.</p>'
      },
      { icon:'⚠️', color:'#c40027', bg:'#fde8ed',
        title:'Grenzen der WRG',
        body:'<p>Die Wärmerückgewinnung hat ihre Grenzen. Es wäre unwirtschaftlich, das Wasser im Boiler nur mit der Kondensatorwärme auf hohe Temperaturen wie 70 °C zu erwärmen. Je wärmer das Wasser im Boiler ist, desto grösser wird der Temperaturunterschied, den der Kompressor überwinden muss. Das erfordert deutlich mehr elektrische Energie. Ab einem bestimmten Punkt frisst der Mehrverbrauch des Kompressors die Einsparungen wieder auf.</p><p>Ähnliches gilt für die Nutzung der WRG-Wärme in Fabrikationsprozessen, zum Beispiel für einen Erhitzer oder die Pasteurisierung. Die dafür benötigten Temperaturen liegen oft zu hoch. Deshalb ist die WRG für solche Prozesse in den meisten Betrieben nicht wirtschaftlich.</p><p>Eine Kälteanlage mit WRG braucht zudem immer einen <b>zusätzlichen Kondensator</b>. Manchmal ist das Wasser im Boiler schon so warm, dass es keine weitere Wärme aufnehmen kann. In diesem Fall muss die Wärme anderswo abgeführt werden, sonst könnte die Anlage nicht weiter kühlen.</p><div class="factbox">WRG lohnt sich vor allem zum Vorwärmen von Brauchwarmwasser. Für hohe Prozesstemperaturen ist sie in den meisten Betrieben nicht wirtschaftlich.</div>'
      }
    ] },
