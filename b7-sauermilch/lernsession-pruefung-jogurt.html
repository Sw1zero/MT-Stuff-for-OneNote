  /* 7 */ {

      '<ul>' +

      '</ul>' +
      '<h4>Eigenschaften</h4>' +
      '<ul>' +
        '<li><i>Sc. thermophilus</i>: Temp.-Optimum 37–42 °C, bildet die <b>Anfangssäure</b>, wirkt <b>viskositätserhöhend</b>.</li>' +
        '<li><i>Lb. bulgaricus</i>: Temp.-Optimum 40–45 °C, bildet die <b>Endsäure</b>, sorgt für die <b>Aromabildung</b>, neigt zum <b>Nachsäuern</b>.</li>' +
      '</ul>' +
      '<div class="factbox">Mild oder sauer steuern Sie über den Laktobazillen-Anteil: <b>weniger Laktobazillen → milder</b>, weniger Nachsäuern. Im Endprodukt mind. <b>10 Mio. Joghurtbakterien pro Gramm</b>.</div>'
  },
  /* 8 */ {
    kicker:'Lückentext', title:'Kulturen & Parameter', id:'kulturen', type:'gaps',
    lead:'Wählen Sie die richtigen Werte und Begriffe.',
    parts:[

      { opts:['37–42 °C','45–50 °C','20–25 °C'], correct:0 },
      ' und bildet die ',
      { opts:['Anfangssäure','Endsäure','Essigsäure'], correct:0 },
      '. <i>Lb. bulgaricus</i> ist verantwortlich für die ',
      { opts:['Aromabildung','Gasbildung','Entrahmung'], correct:0 },
      ' und neigt zum ',
      { opts:['Nachsäuern','Aufrahmen','Gerinnen mit Lab'], correct:0 },
      '. Bebrütet wird bei ',
      { opts:['40–44 °C','10–15 °C','55–60 °C'], correct:0 },
      '.'
    ]
  },
  /* 9 */ {
    kicker:'Quiz', title:'Symbiose & Wirkung', id:'symbiose', type:'quiz',
    lead:'Drei Fragen zur Zusammenarbeit der Kulturen.',
    questions:[
      { q:'Was leisten die Laktobazillen in der Symbiose?',
        opts:['Sie wirken proteolytisch und liefern den Streptokokken Aminosäuren','Sie senken den pH-Wert für die Streptokokken','Sie binden Wasser und erhöhen die Viskosität'], correct:0 },

    lead:'Warum wird die Milch durch die Säure fest?',

      '<p>Bei rund <b>pH 4,6</b> (isoelektrischer Punkt) verliert das <b>Kasein</b> seine negative Ladung, die Teilchen stossen sich nicht mehr ab und gerinnen zu einer <b>Gallerte</b>. Die <b>Molkenproteine</b> bleiben dabei gelöst.</p>' +
      '<div class="factbox">Die <b>Synärese</b> (Molke wird abgepresst) ist bei der Säuregerinnung <b>schwächer</b> als bei der Labgerinnung, die Gallerte soll möglichst nicht erschüttert werden.</div>'
  },
  /* 11 */ {
    kicker:'Lückentext', title:'Säuregerinnung erklären', id:'gerinnung', type:'gaps',
    lead:'Füllen Sie die Lücken im Ablauf der Säuregerinnung.',

      { opts:['Milchsäure','Propionsäure','Buttersäure'], correct:0 },
      '. Der pH-Wert ',
      { opts:['sinkt','steigt','bleibt gleich'], correct:0 },
      '. Bei pH ',
      { opts:['4,6','6,8','3,0'], correct:0 },
      ' gerinnt das ',
      { opts:['Kasein','Albumin','Laktose'], correct:0 },
      ' zu einer Gallerte, während die ',
      { opts:['Molkenproteine','Fettkügelchen','Mineralstoffe'], correct:0 },
      ' gelöst bleiben.'
    ]
  },
  /* 12 */ {
    kicker:'Info · Technologie', title:'Technologische Aspekte', type:'info',

      '<h4>Homogenisieren</h4>' +
      '<p>Werte: <b>mind. 65 °C, 180–220 bar</b>. Vorteile: es <b>verhindert das Aufrahmen</b> (keine Fettschicht beim Bebrüten, wichtig für stichfesten Joghurt), gibt ein <b>feineres Mundgefühl</b> und bindet mehr Wasser.</p>' +
      '<h4>Hitzebehandlung (85–95 °C)</h4>' +
      '<p>Die Joghurtmilch wird <b>höher als 72 °C</b> erhitzt, weil dabei die <b>Molkenproteine denaturieren</b>. Sie können dann mehr Wasser binden, dadurch scheidet stichfester Joghurt weniger Molke ab und gerührter wird dickflüssiger.</p>' +
      '<div class="factbox">Joghurt darf <b>nicht nachträglich pasteurisiert</b> werden: im Endprodukt müssen mind. 10 Mio. <b>lebende</b> Joghurtbakterien pro Gramm sein.</div>'

      { q:'Warum darf Joghurt nicht nachträglich pasteurisiert werden?',

      '</ul>' +
      '<h4>Nachsäuern</h4>' +

      { q:'Wie lässt sich das Nachsäuern am besten reduzieren?',
