    "Joghurt wird mit den Bakterienarten Streptococcus thermophilus und Lactobacillus bulgaricus gesäuert. Diese beiden leben in [Symbiose] und säuern gemeinsam schneller und stärker als jede Art für sich allein.\n\n" +
    "Lactobacillus bulgaricus wirkt [proteolytisch] und stellt den Streptokokken [Aminosäuren] aus dem Milcheiweiss zur Verfügung. Im Gegenzug senkt Streptococcus thermophilus den [pH]-Wert und ermöglicht so den Laktobazillen ein schnelleres Wachstum.\n\n" +
    "Bei der Säuerung bildet Streptococcus thermophilus vor allem die [Anfangssäure], Lactobacillus bulgaricus die [Endsäure]. Letzterer neigt deshalb stark zum [Nachsäuern].\n\n" +
    "Über die Bebrütungstemperatur steuern Sie das Verhältnis der beiden Arten: Bei rund 40 °C vermehren sich die [Streptokokken] schneller, bei rund 45 °C dagegen die [Laktobazillen].\n\n" +
    "Eine Kultur mit wenig Laktobazillen ergibt ein eher [mildes] Joghurt und braucht eine längere Bebrütungszeit. Eine Kultur mit hohem Laktobazillen-Anteil neigt dagegen zum [Übersäuern]."
});
