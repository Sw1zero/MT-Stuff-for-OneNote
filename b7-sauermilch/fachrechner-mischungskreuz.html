<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fachrechner – Mischungskreuz</title>
  <link rel="stylesheet" href="../style.css?v=9d4bf0bd">
</head>
<body>

<header class="bzwu-header">
  <div class="header-text">
  <span class="school-badge">BZWU Wil-Uzwil · Milchtechnologin / Milchtechnologe EFZ · Rechner</span>
  <h1>Mischungskreuz</h1>
  <p>Zwei Komponenten mischen, um einen Zielwert zu erreichen.</p>
  </div>
  <div class="header-logos">
    <img src="../assets/logos/bzwu.png" alt="BZWU" class="header-logo">
    <img src="../assets/logos/milchtechnologen.svg" alt="Milchtechnologen" class="header-logo">
  </div>
</header>

<main class="page-main">
  <a class="back-link" href="../index.html">← Alle Lerntools</a>
  <div id="mischungskreuz"></div>
</main>

<footer class="bzwu-footer">
  BZWU Wil-Uzwil · Milchtechnologin / Milchtechnologe EFZ · Philipp Neukomm
</footer>

<script src="../assets/rechner.js?v=5fca8161"></script>
<script src="../assets/mischungskreuz.js?v=53580109"></script>
<script>
var pick = Rechner.pick, z = Rechner.zahl;

var Q_VOLL   = [3.5, 3.6, 3.7, 3.8, 3.9, 4.0, 4.1, 4.2];
var Q_MAGER  = [0.03, 0.05, 0.1];
var Q_ZIEL   = [1.5, 1.8, 2.0, 2.5, 2.8, 3.0];
var Q_MENGE  = [100, 150, 200, 250, 300, 400, 500, 800, 1000];
var Q_FRUCHT = [6, 7, 8, 9, 10];

function genFett() {
  var a = pick(Q_VOLL), b = pick(Q_MAGER), c = pick(Q_ZIEL), M = pick(Q_MENGE);
  return Mischungskreuz.aufgabe({ nameA: 'Vollmilch', a: a, nameB: 'Magermilch', b: b, c: c, gesucht: 'mengen', menge: M, probe: true,
    text: 'Sie sollen <strong>' + z(M) + ' kg</strong> Jogurtmilch mit <strong>' + z(c) + ' %</strong> Fett herstellen. Zur Verfügung stehen Vollmilch mit <strong>' +
      z(a) + ' %</strong> und Magermilch mit <strong>' + z(b) + ' %</strong> Fett. Wie viel kg von jeder Komponente brauchen Sie?' });
}

function genFrucht() {
  var zutat = pick(['Fruchtgrundstoff', 'Zucker']), c = pick(Q_FRUCHT), M = pick(Q_MENGE);
  return Mischungskreuz.aufgabe({ nameA: zutat, a: 100, nameB: 'Nature-Jogurt', b: 0, c: c, gesucht: 'mengen', menge: M,
    text: 'Sie wollen <strong>' + z(M) + ' kg</strong> Fruchtjogurt mit <strong>' + z(c) + ' %</strong> ' + zutat + ' herstellen (' + zutat +
      ' = 100 %, Nature-Jogurt = 0 %). Wie viel kg ' + zutat + ' und wie viel kg Nature-Jogurt brauchen Sie?' });
}

function genAnteil() {
  var a = pick(Q_VOLL), b = pick(Q_MAGER), c = pick(Q_ZIEL);
  return Mischungskreuz.aufgabe({ nameA: 'Vollmilch', a: a, nameB: 'Magermilch', b: b, c: c, gesucht: 'anteile',
    text: 'Vollmilch (<strong>' + z(a) + ' %</strong>) und Magermilch (<strong>' + z(b) + ' %</strong>) werden zu Jogurtmilch mit <strong>' +
      z(c) + ' %</strong> Fett gemischt. Wie gross ist der Anteil jeder Komponente an der Mischung in %?' });
}

Mischungskreuz.seite({
  uebung: {
    kategorien: [
      { name: 'Fettgehalt einstellen', aufgaben: [genFett] },
      { name: 'Frucht oder Zucker', aufgaben: [genFrucht] },
      { name: 'Mischungsverhältnis', aufgaben: [genAnteil] }
    ],
  hilfe: { titel: 'So geht das Mischungskreuz', html:
    '<ol><li>Links oben Komponente A mit ihrem Wert, links unten Komponente B.</li>' +
    '<li>In die Mitte den Zielwert.</li>' +
    '<li>Über Kreuz rechnen, immer grosse minus kleine Zahl. Rechts stehen die Teile.</li>' +
    '<li>Teile zusammenzählen: Gesamtteile.</li>' +
    '<li>Menge = Teile ÷ Gesamtteile × Gesamtmenge.</li></ol>' +
    '<p>Der Zielwert liegt immer zwischen den beiden Werten.</p>' }
  },
  rechner: { probe: true, vorlagen: [
    { titel: 'Fettgehalt einstellen', nameA: 'Vollmilch', a: 3.8, nameB: 'Magermilch', b: 0.05, c: 1.5, menge: 100 },
    { titel: 'Fruchtgrundstoff beimischen', nameA: 'Fruchtgrundstoff', a: 100, nameB: 'Nature-Jogurt', b: 0, c: 8, menge: 100 },
    { titel: 'Zucker beimischen', nameA: 'Zucker', a: 100, nameB: 'Nature-Jogurt', b: 0, c: 6, menge: 100 }
  ] }
});
</script>
</body>
</html>
