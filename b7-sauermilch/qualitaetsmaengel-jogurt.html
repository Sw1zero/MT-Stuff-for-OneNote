<script>
Lernkaertchen.init({
  karten: [
    { vorne: 'Erklären Sie, wie es zu einer geblähten Jogurtverpackung kommen kann. Nennen Sie drei Möglichkeiten, wie das passieren kann.', hinten: '<strong>Ursache:</strong> Hefen produzieren bei der Gärung CO₂ → Druck in der Verpackung steigt.<br><br><strong>Eintragsquellen:</strong><ul><li>Raumluft</li><li>Kontaminierter Grundstoff oder Zucker</li><li>Unsaubere Anlagen oder Kontakt mit den Händen</li></ul>', kategorie: 'Mikrobiologisch' },
    { vorne: 'Beschreiben Sie, auf welchem Weg Schimmelpilze auf die Jogurtoberfläche gelangen können. Bringen Sie ein Beispiel.', hinten: 'Schimmelpilze gelangen über <strong>Raumluft</strong> (z. B. offene Fenster im Abfüllraum), über <strong>unsaubere Verpackungen</strong> oder über <strong>Spritzwasser</strong> auf die Oberfläche.', kategorie: 'Mikrobiologisch' },
    { vorne: 'Erklären Sie, welche Produktionsfehler zu einem griesigen Jogurt führen können. Nennen Sie vier Ursachen.', hinten: '<ul><li>Nature-Jogurt zu wenig strukturbearbeitet</li><li>Abfallende Bebrütungstemperatur</li><li>Zu hohe Bebrütungstemperatur (Lb.-Anteil zu hoch)</li><li>Zu hohe fettfreie Milchtrockenmasse</li></ul>', kategorie: 'Konsistenz & Struktur' },
    { vorne: 'Erklären Sie, warum eine ungenügende thermische Belastung der Milch zu einer zu tiefen Viskosität des Jogurts führt.', hinten: 'Bei ungenügender Erhitzung werden die <strong>Molkenproteine nicht ausreichend denaturiert</strong>. Sie können dann nicht genügend Wasser binden → Jogurt wird zu dünnflüssig.', kategorie: 'Konsistenz & Struktur' },
    { vorne: 'Beschreiben Sie fünf verschiedene Ursachen, die zu einem zu dünnflüssigen Jogurt führen können.', hinten: '<ul><li>Ungenügende thermische Belastung der Milch</li><li>Keine oder ungenügende Homogenisation</li><li>Zu starke mechanische Belastung der Gallerte (starkes Rühren, ungeeignete Pumpen)</li><li>Zu tiefe fettfreie Trockenmasse / Verwässerung</li><li>Ungenügende Säuerung</li></ul>', kategorie: 'Konsistenz & Struktur' },
    { vorne: 'Erklären Sie, warum Erschütterungen während der Gerinnung oder des Kühlens zur Molkenabscheidung führen können. Bringen Sie ein Beispiel.', hinten: 'Die Gallerte ist während der Gerinnung und beim Kühlen mechanisch empfindlich. <strong>Erschütterungen</strong> (z. B. Transport auf unebener Strasse) zerstören das Proteingerüst → Molke tritt aus.', kategorie: 'Konsistenz & Struktur' },
    { vorne: 'Beschreiben Sie, wie Lufteinzug beim Mischen die Qualität des Jogurts beeinflussen kann. Erklären Sie den Zusammenhang mit der Molkenabscheidung.', hinten: 'Luftblasen, die durch undichte Leitungen oder falsches Mischen eingetragen werden, <strong>stören die Gallertstruktur</strong>. Das Proteingerüst wird beschädigt → Molke scheidet sich ab → Molkenlässigkeit.', kategorie: 'Konsistenz & Struktur' },
    { vorne: 'Beschreiben Sie zwei mögliche Ursachen für einen fadenziehenden Jogurt. Bringen Sie je ein Beispiel.', hinten: '<ul><li><strong>Zu tiefe Bebrütungstemperatur</strong> (z. B. Thermostat defekt) → Fadenziehende Milchsäurebakterien sind im Vorteil</li><li><strong>Infektion mit fadenziehenden Milchsäurebakterien</strong> (z. B. durch unzureichende Anlagenreinigung)</li></ul>', kategorie: 'Konsistenz & Struktur' },
    { vorne: 'Erklären Sie, warum ein zu langsames oder ungenügendes Kühlen nach der Bebrütung zu einem übersäuerten Jogurt führt.', hinten: 'Bei hoher Temperatur arbeiten die Milchsäurebakterien weiter → <strong>Nachsäuerung</strong>: Milchsäureproduktion setzt sich fort → Säuregehalt steigt an. Erst unter 10 °C wird die Säuerung gestoppt.', kategorie: 'Geschmack' },
    { vorne: 'Erklären Sie den Einfluss eines hohen Laktobazillenanteils in der Jogurtkultur auf die Säuerung. Bringen Sie ein Beispiel.', hinten: 'Laktobazillen säuern <strong>stärker</strong> als Streptokokken. Ein zu hoher Lb.-Anteil führt zu übermässiger Milchsäurebildung → Jogurt wird übersäuert (z. B. wenn die Kultur aus dem Gleichgewicht gerät und Lb. dominieren).', kategorie: 'Geschmack' }
  ]
});
</script>
