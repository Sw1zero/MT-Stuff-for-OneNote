<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prozess-Entscheid – Jogurtherstellung</title>
  <link rel="stylesheet" href="../style.css?v=d6d6b61d">
</head>
<body>

<header class="bzwu-header">
  <div class="header-text">
    <span class="school-badge">BZWU Wil-Uzwil · Milchtechnologin / Milchtechnologe EFZ · b.7</span>
    <h1>Prozess-Entscheid – Jogurtherstellung</h1>
    <p>Treffen Sie bei jedem Schritt die richtige Entscheidung</p>
  </div>
  <div class="header-logos">
    <img src="../assets/logos/bzwu.png" alt="BZWU" class="header-logo">
    <img src="../assets/logos/milchtechnologen.svg" alt="Milchtechnologen" class="header-logo">
  </div>
</header>

<main class="q-wrap">
  <a class="back-link" href="../index.html">← Alle Lerntools</a>
  <div id="quiz"></div>
</main>

<footer class="bzwu-footer">
  BZWU Wil-Uzwil · Milchtechnologin / Milchtechnologe EFZ · Philipp Neukomm
</footer>

<script src="../assets/quiz.js?v=6c3e9a7b"></script>
<script>
  var STEPS = [
    {
      name: 'Hitzebehandlung',
      situation: 'Die Jogurtmilch ist auf den richtigen Fettgehalt standardisiert und die fettfreie Trockenmasse wurde erhöht. Nun muss die Milch hitzebehandelt werden.',
      question: 'Welche Temperatur und Zeit wählen Sie für die Hitzebehandlung der Jogurtmilch?',
      choices: [
        {
          label: '72 °C, 15 Sekunden (Pasteurisierung)',
          correct: false,
          feedback: 'Bei 72 °C werden die Molkenproteine zu wenig denaturiert. Folge: Sie können nicht genügend Wasser binden → der Jogurt wird dünnflüssig und scheidet Molke ab (Molkenlässigkeit).'
        },
        {
          label: '85–95 °C, 2–10 Minuten',
          correct: true,
          feedback: 'Richtig! Bei 85–95 °C werden die Molkenproteine ausreichend denaturiert. Sie vergrössern ihre Oberfläche und binden mehr Wasser → der Jogurt wird cremig und stabil.'
        },
        {
          label: '120 °C, 5 Minuten (UHT)',
          correct: false,
          feedback: 'Bei 120 °C entsteht ein unerwünschter Kochgeschmack. Ausserdem werden Proteine zu stark verändert, was die Qualität beeinträchtigt.'
        },
      ]
    },
    {
      name: 'Abkühlen',
      situation: 'Die Hitzebehandlung war erfolgreich. Bevor die Kultur zugegeben wird, muss die Milch auf die richtige Temperatur abgekühlt werden.',
      question: 'Auf welche Temperatur kühlen Sie die Jogurtmilch ab?',
      choices: [
        {
          label: '25 °C',
          correct: false,
          feedback: 'Bei 25 °C arbeiten die thermophilen Jogurtbakterien (Sc. thermophilus, Lb. bulgaricus) nicht. Ihr Temperaturoptimum liegt bei 40–44 °C – bei 25 °C findet so gut wie keine Säuerung statt.'
        },
        {
          label: '40–44 °C',
          correct: true,
          feedback: 'Richtig! 40–44 °C ist das Temperaturoptimum der Jogurtbakterien. Die Kultur wird jetzt zugegeben.'
        },
        {
          label: '50 °C',
          correct: false,
          feedback: 'Bei 50 °C werden die Milchsäurebakterien stark geschädigt oder abgetötet. Ohne lebende Bakterien findet keine Milchsäuregärung statt, also kein Jogurt.'
        },
      ]
    },
    {
      name: 'Impfen',
      situation: 'Die Milch hat 42 °C erreicht. Nun wird die Betriebskultur zugegeben.',
      question: 'Wie viel Betriebskultur geben Sie zur Jogurtmilch?',
      choices: [
        {
          label: '0.5 %',
          correct: false,
          feedback: 'Zu wenig Kultur verlängert die Bebrütungszeit auf über 10 Stunden und liefert unzuverlässige Ergebnisse. Die Keimzahl im Endprodukt könnte zu tief sein (gesetzlich mind. 10 Mio. KBE/g).'
        },
        {
          label: '2 %',
          correct: true,
          feedback: 'Richtig! 2 % Betriebskultur ist die Standarddosierung und führt zu einer Bebrütungszeit von 4–7 Stunden.'
        },
        {
          label: '10 %',
          correct: false,
          feedback: 'Zu viel Kultur bewirkt eine zu schnelle, unkontrollierte Säuerung. Der pH-Wert fällt zu rasch, was die Qualität beeinträchtigt und die Produktion erschwert.'
        },
      ]
    },
    {
      name: 'Bebrüten',
      situation: 'Die Kultur wurde zugegeben. Nun bebrütet der Jogurt, entweder stichfest in der Verpackung oder gerührt im Tank.',
      question: 'Bei welcher Temperatur bebrüten Sie den Jogurt?',
      choices: [
        {
          label: '30 °C',
          correct: false,
          feedback: 'Zu kalt: Die thermophilen Bakterien arbeiten zu langsam. Risiko: fadenziehender Jogurt durch unausgeglichene Bakterienaktivität, und sehr lange Bebrütungszeiten.'
        },
        {
          label: '40–44 °C',
          correct: true,
          feedback: 'Richtig! Bei 40–44 °C arbeiten Streptococcus thermophilus und Lactobacillus bulgaricus in Symbiose optimal zusammen und vergären die Laktose effizient zu Milchsäure.'
        },
        {
          label: '50 °C',
          correct: false,
          feedback: 'Zu heiss: Bei 50 °C sterben die Milchsäurebakterien ab. Ohne aktive Bakterien findet keine Milchsäuregärung statt, der pH-Wert fällt nicht, kein Jogurt entsteht.'
        },
      ]
    },
    {
      name: 'pH kontrollieren',
      situation: 'Der Jogurt bebrütet. Sie messen den pH-Wert bzw. den Säuregrad (°SH) regelmässig. Der pH-Wert sinkt stetig.',
      question: 'Bei welchem pH-Wert leiten Sie das Kühlen ein?',
      choices: [
        {
          label: 'pH 5.0 (ca. 20 °SH)',
          correct: false,
          feedback: 'Zu früh: Der Jogurt ist noch nicht ausreichend gesäuert. Die Gallerte ist sehr schwach, der Jogurt schmeckt fade und nicht charakteristisch säuerlich.'
        },
        {
          label: 'pH 4.5 (36–38 °SH)',
          correct: true,
          feedback: 'Richtig! Bei pH 4.5 (= 36–38 °SH) hat die Säuerung den idealen Punkt erreicht. Jetzt muss rasch gekühlt werden, um Nachsäuerung zu verhindern.'
        },
        {
          label: 'pH 4.0 (ca. 52 °SH)',
          correct: false,
          feedback: 'Zu spät: Bei pH 4.0 ist der Jogurt bereits übersäuert. Ausserdem setzt sich die Nachsäuerung während des Kühlens fort, der Jogurt wird noch saurer.'
        },
      ]
    },
    {
      name: 'Kühlen',
      situation: 'Der Säuregrad hat 36–38 °SH (pH 4.5) erreicht. Der Jogurt muss nun gekühlt werden, um die Bakterienaktivität zu stoppen.',
      question: 'Wie schnell kühlen Sie den Jogurt?',
      choices: [
        {
          label: 'Langsam über 4–5 Stunden auf < 10 °C',
          correct: false,
          feedback: 'Zu langsam: Die Milchsäurebakterien sind noch aktiv und vergären weiter (Nachsäuerung). Folge: Der Jogurt wird übersäuert und der pH-Wert sinkt unter 4.5.'
        },
        {
          label: 'Rasch innerhalb 1 Stunde auf < 5 °C',
          correct: true,
          feedback: 'Richtig! Rasches Kühlen stoppt die Bakterienaktivität und verhindert Nachsäuerung. Der Jogurt bleibt bei pH 4.5 stabil.'
        },
      ]
    },
  ];

// Jeder Prozessschritt wird eine Quizfrage, die Erklärung hängt an der gewählten Antwort
Quiz.init({
  mischen: false,
  questions: STEPS.map(function (s) {
    var richtig = s.choices.filter(function (c) { return c.correct; })[0];
    return {
      badge: s.name,
      question: s.situation + ' ' + s.question,
      answers: s.choices.map(function (c) { return c.label; }),
      correct: s.choices.indexOf(richtig),
      feedback: s.choices.map(function (c) { return c.feedback.replace(/^Richtig! /, ''); }),
      explanation: richtig.feedback.replace(/^Richtig! /, '')
    };
  })
});
</script>
</body>
</html>
