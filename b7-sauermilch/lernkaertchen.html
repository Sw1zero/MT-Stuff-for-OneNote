<script>
Lernkaertchen.init({
  karten: [
    { vorne: 'Milchsäurebakterien (MSB)', hinten: 'Mikroorganismen, die Laktose zu Milchsäure vergären und so die Sauermilch herstellen.', kategorie: 'Mikrobiologie' },
    { vorne: 'Milchsäuregärung', hinten: 'Stoffwechselprozess: MSB gewinnen Energie aus Laktose, als Nebenprodukt entsteht Milchsäure.', kategorie: 'Mikrobiologie' },
    { vorne: 'Streptococcus thermophilus (Sc)', hinten: 'Jogurtbakterium, Temperaturoptimum 37–42 °C; viscositätserhöhend, säuert zu Beginn der Bebrütung stark.', kategorie: 'Mikrobiologie' },
    { vorne: 'Lactobacillus delbrueckii ssp. bulgaricus (Lb)', hinten: 'Jogurtbakterium, Temperaturoptimum 40–45 °C; Endsäurebildner, neigt zum Nachsäuern.', kategorie: 'Mikrobiologie' },
    { vorne: 'Symbiose (Jogurtbakterien)', hinten: 'Lb spalten Milcheiweiss auf und stellen Sc Aminosäuren bereit. Sc senkt den pH-Wert und ermöglicht Lb schnelleres Wachstum.', kategorie: 'Mikrobiologie' },
    { vorne: 'proteolytisch', hinten: 'Eiweissspaltend; Lb spalten Milcheiweiss auf und stellen so Aminosäuren für Streptococcus thermophilus bereit.', kategorie: 'Mikrobiologie' },
    { vorne: 'koloniebildende Einheiten (KBE)', hinten: 'Messgrösse für lebende Bakterien; Jogurt muss gesetzlich mind. 10 Mio. KBE/g enthalten.', kategorie: 'Mikrobiologie' },
    { vorne: 'thermophil', hinten: 'Bakterien mit Temperaturoptimum bei 40–45 °C, z. B. Jogurtbakterien.', kategorie: 'Mikrobiologie' },
    { vorne: 'mesophil', hinten: 'Bakterien mit Temperaturoptimum bei ca. 20–30 °C, z. B. Rahmsäurewecker für nordische Sauermilch.', kategorie: 'Mikrobiologie' },
    { vorne: 'Direktstarterkultur', hinten: 'Gebrauchsfertige Kultur, die direkt zur Jogurtmilch dosiert wird; kein Voranzüchten nötig.', kategorie: 'Mikrobiologie' },
    { vorne: 'Betriebskultur', hinten: 'Im Betrieb selbst hergestellte Flüssigkultur; die Bakterien sind bereits mit Wasser versorgt und verkürzen so die Bebrütungszeit.', kategorie: 'Mikrobiologie' },
    { vorne: 'lyophilisiert', hinten: 'Gefriergetrocknet; eine Handelsform von Kulturen (neben Tiefgefrierkultur und Flüssigkultur).', kategorie: 'Mikrobiologie' },
    { vorne: 'probiotisch', hinten: 'Mikroorganismen, die gesundheitsfördernd wirken, weil sie die Magen-Darm-Passage überleben und sich im Dickdarm ansiedeln.', kategorie: 'Mikrobiologie' },
    { vorne: 'Kefirkörner / Kefirpilze', hinten: 'Träger der Kefirkultur; bestehen aus Eiweiss und Kohlenhydraten, auf denen MSB und Hefen in Symbiose leben.', kategorie: 'Mikrobiologie' },
    { vorne: 'Laktose', hinten: 'Milchzucker; Substrat (Energiequelle) für die Milchsäuregärung der MSB.', kategorie: 'Chemie & Physik' },
    { vorne: 'Milchsäure', hinten: 'Nebenprodukt der Milchsäuregärung; senkt den pH-Wert der Milch und führt zur Kaseingerinnung.', kategorie: 'Chemie & Physik' },
    { vorne: 'Kasein', hinten: 'Haupteiweiss der Milch; trägt in normaler Milch überwiegend negative Ladungen und bleibt einzeln gelöst.', kategorie: 'Chemie & Physik' },
    { vorne: 'Säuregerinnung', hinten: 'Milchsäure neutralisiert die negativen Ladungen der Kaseinkügelchen; diese ziehen sich an und bilden ein dreidimensionales Netzwerk (Gallerte).', kategorie: 'Chemie & Physik' },
    { vorne: 'Molkenproteine', hinten: 'Eiweissanteile in der wässrigen Milchphase; werden durch Säure nicht gefällt, aber durch Hitze denaturiert.', kategorie: 'Chemie & Physik' },
    { vorne: 'Denaturierung der Molkenproteine', hinten: 'Entfaltung der Molkenproteine bei 85–95 °C; vergrössert ihre Oberfläche, sodass mehr Wasser gebunden wird → weniger Molkenabscheidung.', kategorie: 'Chemie & Physik' },
    { vorne: 'Gallerte', hinten: 'Gelartige, dreidimensionale Netzstruktur aus Kasein; entsteht durch die Säuregerinnung und hält Wasser und andere Milchbestandteile eingeschlossen.', kategorie: 'Chemie & Physik' },
    { vorne: 'Synärese', hinten: 'Zusammenziehen der Gallerte unter Abpressung von Molke; bei Säuregerinnung schwächer als bei Labgerinnung.', kategorie: 'Chemie & Physik' },
    { vorne: 'Viskosität', hinten: 'Dickflüssigkeit / Zähigkeit; wichtige Qualitätsgrösse bei Jogurt. Wird durch fTM, Homogenisation und Kultur beeinflusst.', kategorie: 'Chemie & Physik' },
    { vorne: 'pH-Wert', hinten: 'Mass für den Säuregehalt; das Kühlen der Jogurtgallerte wird bei pH 4,5 eingeleitet (= 36–38 °SH).', kategorie: 'Chemie & Physik' },
    { vorne: 'Säuregrad (°SH)', hinten: 'Schweizer Mass für die titrierbare Säure; Kühlen bei 36–38 °SH, was einem pH-Wert von 4,5 entspricht.', kategorie: 'Chemie & Physik' },
    { vorne: 'Nachsäuern', hinten: 'Unerwünschte Säurezunahme nach der Bebrütung durch verbleibende Aktivität der MSB, auch bei Kühltemperatur.', kategorie: 'Chemie & Physik' },
    { vorne: 'Standardisieren', hinten: 'Einstellen des Fettgehalts der Jogurtmilch auf den vorgesehenen Rezepturwert durch Zugabe von Rahm oder Magermilch.', kategorie: 'Produktion' },
    { vorne: 'Erhöhung der fettfreien Trockenmasse (fTM)', hinten: 'Zugabe von Magermilchpulver, Milchproteinkonzentrat oder WPC; erhöht Viskosität und vermindert Molkenabscheidung um 1,5–3 %.', kategorie: 'Produktion' },
    { vorne: 'Homogenisieren', hinten: 'Zerkleinerung der Fettkügelchen unter Druck (180–220 bar); verhindert Aufrahmung, verbessert Wasserbindung und Mundgefühl.', kategorie: 'Produktion' },
    { vorne: 'Hitzebehandlung (Jogurtmilch)', hinten: '85–95 °C während 2–10 Minuten; bewirkt starke Denaturierung der Molkenproteine, deutlich höher als normale Pasteurisierung.', kategorie: 'Produktion' },
    { vorne: 'Impfen', hinten: 'Zugabe der Jogurtkultur (2 % Betriebskultur oder Direktstarter) zur abgekühlten Jogurtmilch unter hygienischen Bedingungen.', kategorie: 'Produktion' },
    { vorne: 'Bebrüten', hinten: 'Inkubation bei 40–44 °C während 4–7 Stunden; MSB vergären Laktose, pH-Wert sinkt, Gallerte entsteht.', kategorie: 'Produktion' },
    { vorne: 'Strukturbearbeitung', hinten: 'Aufrühren / Glätten der Gallerte beim gerührten Jogurt (z. B. Spaltenfilter, Druckhalteventil); Griessigkeit kann dadurch behoben werden.', kategorie: 'Produktion' },
    { vorne: 'Warmmischverfahren', hinten: 'Früchte werden bei 20–30 °C zur Jogurtgallerte gemischt; Jogurt dickt in der Verpackung weiter nach.', kategorie: 'Produktion' },
    { vorne: 'Kaltmischverfahren', hinten: 'Früchte werden bei < 5 °C gemischt; bietet zeitliche Flexibilität (Nature-Jogurt und Fruchtzugabe können an verschiedenen Tagen erfolgen).', kategorie: 'Produktion' },
    { vorne: 'Nachpasteurisation', hinten: 'Erneute Erhitzung des Trinkjogurts vor dem Abfüllen; verlängerte Haltbarkeit, keine lebenden MSB mehr im Produkt.', kategorie: 'Produktion' },
    { vorne: 'Sterilluftüberdruck', hinten: 'Schutz offener Produktionsanlagen durch steril gefilterte Luft; erzeugt leichten Überdruck und verhindert Hefen-/Schimmelinfektion.', kategorie: 'Produktion' },
    { vorne: 'Fruchtgrundstoff', hinten: 'Mischung aus ca. 50 % Früchten und 50 % Zucker; pasteurisiert, bei Kühltemperatur gelagert, mehrere Wochen haltbar.', kategorie: 'Zutaten' },
    { vorne: 'Molkenproteinkonzentrat (WPC)', hinten: 'Flüssige Alternative zur Trockenmasse-Erhöhung (Ultrafiltrat aus Molke); einfache Zudosierung ohne Staubentwicklung.', kategorie: 'Zutaten' },
    { vorne: 'Verdickungsmittel', hinten: 'Zusatzstoff im Fruchtgrundstoff; verhindert Entmischung der Frucht-Zuckermasse.', kategorie: 'Zutaten' },
    { vorne: 'Strukturstabilisator', hinten: 'Nötig bei Trinkjogurt; verhindert Molkenabscheidung nach intensiver mechanischer Bearbeitung der Gallerte.', kategorie: 'Zutaten' },
    { vorne: 'Allergene', hinten: 'Bestandteile, die Allergien auslösen können (z. B. Haselnüsse in Grundstoffen); Abfüllung von allergenhaltigen Sorten stets am Schluss der Charge.', kategorie: 'Zutaten' },
    { vorne: 'VLtH', hinten: 'Verordnung über Lebensmittel tierischer Herkunft; legt gesetzliche Anforderungen an Sauermilchprodukte fest (Keimzahl, Fettgehalt, Sachbezeichnung).', kategorie: 'Recht & Qualität' },
    { vorne: 'Sachbezeichnung «Jogurt»', hinten: 'Darf nur verwendet werden, wenn: Kuhmilch + Sc thermophilus + Lb delbrueckii (oder andere Lactobacillen) + mind. 10 Mio. KBE/g im Endprodukt.', kategorie: 'Recht & Qualität' },
    { vorne: 'Fettgehaltsstufen (Jogurt)', hinten: 'Magerjogurt: max. 5 g/kg | Teilentrahmt: 5–35 g/kg | Vollmilchjogurt: mind. 35 g/kg | Rahmangereicherter: mind. 50 g/kg – bezogen auf den Milchanteil.', kategorie: 'Recht & Qualität' },
    { vorne: 'Mindesthaltbarkeitsdatum (MHD)', hinten: 'Bei Jogurt 18–28 Tage; muss auf der Verpackung deklariert sein.', kategorie: 'Recht & Qualität' },
    { vorne: 'Griessigkeit', hinten: 'Konsistenzmangel: körnige, sandige Struktur. Ursachen: zu tiefe Bebrütungstemperatur, ungenügende Strukturbearbeitung, zu hohe fTM.', kategorie: 'Qualitätsmängel' },
    { vorne: 'Molkenlässig', hinten: 'Wässrige Schicht im Jogurt (Synärese). Ursachen: ungenügende Denaturierung der Molkenproteine, keine Homogenisation, Erschütterungen während der Gerinnung.', kategorie: 'Qualitätsmängel' },
    { vorne: 'Übersäuert', hinten: 'pH-Wert zu tief, Jogurt zu sauer. Ursachen: zu lange Bebrütungszeit, langsames Kühlen, unterbrochene Kühlkette, hoher Laktobacillenanteil.', kategorie: 'Qualitätsmängel' },
    { vorne: 'Fadenziehend', hinten: 'Gallerte zieht Fäden. Ursachen: Infektion mit fadenziehenden MSB; zu tiefe Bebrütungstemperatur.', kategorie: 'Qualitätsmängel' },
    { vorne: 'Geblähte Verpackung', hinten: 'Verpackung durch Gasbildung aufgebläht. Ursache: Hefeinfektion (über Raumluft, Grundstoff oder unsaubere Anlagen).', kategorie: 'Qualitätsmängel' }
  ]
});
</script>
